<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다솜안경 학급 운영 시스템</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap');
  :root{
    --primary:#4f46e5;--pl:#eef0ff;--suc:#0ea374;--sl:#d7f5e9;
    --dan:#e23a5f;--dl:#ffe4ea;--warn:#b45309;--wl:#fef3c7;
    --gold:#f59e0b;--violet:#7c3aed;
    --g50:#f8f9fc;--g100:#f0f2f8;--g200:#e3e7f0;--g300:#cdd3e1;--g400:#97a0b5;--g500:#67718a;--g600:#4a5468;--g700:#363f52;--g800:#222a3b;--g900:#121826;
    --success-light:#d7f5e9;--danger-light:#ffe4ea;
    --r:16px;
    --sh:0 1px 2px rgba(18,24,38,.05),0 6px 20px -6px rgba(79,70,229,.10);
    --bg:#eef0f8;--card:#ffffff;--card-border:#e7eaf4;
    --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
    --glass-bar:rgba(255,255,255,.78);
  }
  [data-theme="dark"]{
    --primary:#818cf8;--pl:#272a55;--suc:#34d399;--sl:#0b3b2d;
    --dan:#fb7195;--dl:#4a1322;--warn:#fbbf24;--wl:#3c2c06;
    --gold:#fbbf24;--violet:#a78bfa;
    --g50:#171c2e;--g100:#1d2336;--g200:#2c3450;--g300:#3d466b;--g400:#6b7494;--g500:#99a2bd;--g600:#c0c7da;--g700:#dde1ee;--g800:#edf0f8;--g900:#f8f9fe;
    --success-light:#0b3b2d;--danger-light:#4a1322;
    --sh:0 1px 2px rgba(0,0,0,.45),0 10px 28px -8px rgba(0,0,0,.5);
    --bg:#0b1020;--card:#141a2e;--card-border:#242d49;
    --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
    --glass-bar:rgba(13,18,36,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--g900);min-height:100vh;font-size:15px;transition:background .3s,color .3s;}
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:.6rem;}
  /* .lcard / .llogo / .student-grid-sel / .stu-btn 은 아래 프리미엄 로그인 블록에서 정의 */
  .fg{margin-bottom:.9rem;}
  .fg label{display:block;font-size:.85rem;font-weight:500;color:var(--g700);margin-bottom:.35rem;}
  .fg select,.fg input{width:100%;padding:.65rem .9rem;border:1.5px solid var(--g200);border-radius:10px;font-size:1rem;font-family:inherit;outline:none;transition:border-color .2s;background:var(--card);color:var(--g900);}
  .fg select:focus,.fg input:focus{border-color:var(--primary);}
  /* 학생 이름 선택 그리드 */
  .stu-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--pl);}
  .stu-btn.selected{border-color:var(--primary);background:var(--primary);color:white;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:.62rem 1rem;border-radius:10px;border:none;font-size:.92rem;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit;}
  .bp{background:var(--primary);color:white;}.bp:hover{opacity:.9;}
  .bs{background:var(--g100);color:var(--g700);}.bs:hover{background:var(--g200);}
  .bsuc{background:var(--suc);color:white;}.bsuc:hover{opacity:.9;}
  .bdan{background:var(--dan);color:white;}.bdan:hover{opacity:.9;}
  .bsm{padding:.35rem .75rem;font-size:.82rem;}
  .bfull{width:100%;}
  #appScreen{display:none;min-height:100vh;flex-direction:column;}
  .topbar{background:var(--card);border-bottom:1px solid var(--card-border);padding:0 1.4rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .tlogo{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--primary);}
  /* 상단 탭 - 데스크탑 */
  .nav-tabs{display:none;background:var(--card);border-bottom:1px solid var(--card-border);padding:0 .8rem;overflow-x:auto;scrollbar-width:none;}
  .nav-tabs::-webkit-scrollbar{display:none;}
  .nt{padding:.7rem 1rem;font-size:.85rem;font-weight:500;color:var(--g500);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s;}
  .nt.active{color:var(--primary);border-bottom-color:var(--primary);}
  .nt:hover:not(.active){color:var(--g700);}
  /* 하단 탭 바 */
  .bottom-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--card-border);z-index:100;padding:0;padding-bottom:env(safe-area-inset-bottom,0);}
  .bt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.45rem 0 .35rem;font-size:.62rem;font-weight:500;color:var(--g400);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;border:none;background:none;gap:.12rem;position:relative;}
  .bt.active{color:var(--primary);}
  .bt.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2.5px;background:var(--primary);border-radius:0 0 4px 4px;}
  .bt-icon{font-size:1.15rem;line-height:1;}
  .bt-label{line-height:1;}
  .mc{padding:1.1rem;padding-bottom:5rem;max-width:860px;margin:0 auto;width:100%;}
  .tc{display:none;}.tc.active{display:block;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes treeShake{0%,100%{transform:rotate(0);}15%{transform:rotate(-6deg);}30%{transform:rotate(5deg);}45%{transform:rotate(-4deg);}60%{transform:rotate(3deg);}75%{transform:rotate(-1deg);}}
  .tree-shake{animation:treeShake .8s ease;}
  .card{background:var(--card);border-radius:var(--r);padding:1.2rem;box-shadow:var(--sh);margin-bottom:.9rem;}
  .ct{font-size:.97rem;font-weight:700;color:var(--g900);margin-bottom:.9rem;display:flex;align-items:center;gap:.4rem;}
  .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.9rem;}
  .si{background:var(--g50);border-radius:10px;padding:.85rem;text-align:center;}
  .sl{font-size:.75rem;color:var(--g500);margin-bottom:.2rem;}
  .sv{font-size:1.05rem;font-weight:700;}
  /* PnL Banner */
  .pb{border-radius:12px;padding:.9rem 1rem;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;}
  .pb.pos{background:var(--sl);border:1.5px solid var(--suc);}
  .pb.neg{background:var(--dl);border:1.5px solid var(--dan);}
  .pb.neu{background:var(--g50);border:1.5px solid var(--g200);}
  .pb-label{font-size:.82rem;color:var(--g700);margin-bottom:.12rem;}
  .pb-amt{font-size:1.3rem;font-weight:700;}
  .pb-pct{font-size:.83rem;font-weight:600;margin-top:.08rem;}
  /* Stock card */
  .sc{border:1.5px solid var(--g200);border-radius:var(--r);padding:.9rem;margin-bottom:.65rem;}
  .sch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.6rem;}
  .scn{font-weight:700;font-size:.97rem;}
  .scp{text-align:right;}
  .scpv{font-size:1.1rem;font-weight:700;}
  .bdg{display:inline-block;padding:.16rem .55rem;border-radius:6px;font-size:.74rem;font-weight:500;}
  .bsemi{background:#dbeafe;color:var(--primary);}.bfood{background:#dcfce7;color:var(--suc);}.bent{background:#fce7f3;color:var(--dan);}
  .pnl-row{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:.5rem;}
  .pnl-cell{border-radius:8px;padding:.48rem .7rem;}
  .pnl-cell-neu{background:var(--g50);}
  .pnl-cell-pos{background:var(--sl);}
  .pnl-cell-neg{background:var(--dl);}
  /* News */
  .ni{padding:.7rem;border-left:3px solid var(--primary);background:var(--pl);border-radius:0 8px 8px 0;margin-bottom:.5rem;}
  .ni-title{font-size:.9rem;font-weight:500;}
  .ni-meta{font-size:.75rem;color:var(--g500);margin-top:.14rem;}
  /* Trade */
  .tr-row{display:flex;gap:.45rem;align-items:flex-end;flex-wrap:wrap;margin-top:.6rem;}
  .tr-row .fg{flex:1;min-width:100px;margin-bottom:0;}
  /* Rank */
  .ri{display:flex;align-items:center;gap:.85rem;padding:.7rem;border-radius:10px;margin-bottom:.45rem;background:var(--g50);}
  .rn{font-size:1rem;font-weight:700;min-width:26px;text-align:center;}
  .rn.gold{color:#d97706;}.rn.silver{color:var(--g500);}.rn.bronze{color:var(--warn);}
  .ri-info{flex:1;}
  .ri-name{font-weight:600;font-size:.9rem;}
  .ri-sub{font-size:.76rem;color:var(--g500);}
  .ri-ret{font-size:.92rem;font-weight:700;margin-left:auto;}
  /* Deposit */
  .dc{border:1.5px solid var(--g200);border-radius:var(--r);padding:.9rem;margin-bottom:.55rem;}
  .dch{display:flex;justify-content:space-between;align-items:flex-start;}
  .dct{font-weight:600;font-size:.9rem;}
  .dcr{font-size:.8rem;color:var(--suc);font-weight:500;}
  .dcd{font-size:.73rem;color:var(--g500);margin-top:.13rem;}
  /* Company */
  .co{border:1.5px solid var(--g200);border-radius:var(--r);padding:1rem;margin-bottom:.65rem;}
  .co-hd{display:flex;align-items:center;gap:.7rem;margin-bottom:.65rem;}
  .co-ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
  .co-nm{font-weight:700;font-size:.97rem;}
  .co-desc{font-size:.86rem;color:var(--g700);line-height:1.8;margin-bottom:.65rem;}
  .co-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;}
  .co-st{background:var(--g50);border-radius:8px;padding:.55rem .7rem;text-align:center;}
  .co-stl{font-size:.7rem;color:var(--g500);margin-bottom:.12rem;}
  .co-stv{font-size:.9rem;font-weight:700;}
  /* Cashier / Teacher */
  .cr{border:1px solid var(--g200);border-radius:10px;padding:.75rem .9rem;margin-bottom:.45rem;display:flex;justify-content:space-between;align-items:center;font-size:.86rem;}
  .ci{flex:1;}.cn{font-weight:600;}.cd{color:var(--g500);font-size:.76rem;}
  .ca{display:flex;gap:.32rem;}
  .tst{font-size:.85rem;font-weight:600;color:var(--g700);margin-bottom:.65rem;padding-bottom:.35rem;border-bottom:1px solid var(--g200);}
  .stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.45rem;}
  .sti{background:var(--g50);border-radius:8px;padding:.65rem .85rem;font-size:.83rem;}
  /* Modal */
  /* v6.6: 다크모드에서 인라인 input/textarea/select 배경이 흰색으로 남는 문제 일괄 수정 */
  input:not([type=range]):not([type=checkbox]):not([type=radio]),textarea,select{background:var(--card);color:var(--g900);border-color:var(--g200);}
  input::placeholder,textarea::placeholder{color:var(--g400);}
  /* v6.6: 버튼 누름 피드백 */
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:1rem;}
  .mo.open{display:flex;}
  .mi{background:var(--card);border-radius:16px;padding:1.4rem;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;}
  .mi-t{font-size:.97rem;font-weight:700;margin-bottom:.9rem;}
  .mi-a{display:flex;gap:.45rem;margin-top:.9rem;}
  /* Toast */
  #toast{position:fixed;bottom:6.6rem;left:50%;transform:translateX(-50%);background:var(--g900);color:var(--g50);padding:.56rem 1.1rem;border-radius:16px;font-size:.86rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:min(92vw,480px);width:max-content;text-align:center;line-height:1.5;white-space:normal;word-break:keep-all;}
  #toast.show{opacity:1;}
  /* Version badge */
  .ver{position:fixed;bottom:.6rem;right:.8rem;font-size:.7rem;color:var(--g500);background:rgba(255,255,255,.8);padding:.15rem .5rem;border-radius:20px;z-index:50;}
  [data-theme="dark"] .ver{background:rgba(0,0,0,.5);}
  /* Utils */
  .mt1{margin-top:.5rem;}.mt2{margin-top:1rem;}
  .flex{display:flex;}.gap2{gap:.5rem;}.jb{justify-content:space-between;}.ac{align-items:center;}
  .tsm{font-size:.84rem;}.txs{font-size:.75rem;}.fb{font-weight:700;}.tr{text-align:right;}
  .tg{color:var(--g500);}.tp{color:var(--primary);}.tsuc{color:var(--suc);}.tdan{color:var(--dan);}
  .div{border:none;border-top:1px solid var(--g200);margin:.9rem 0;}
  .empty{text-align:center;color:var(--g500);font-size:.85rem;padding:1.5rem;}
  .pbg{background:var(--wl);color:var(--warn);border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:600;}
  input[type=number]{-moz-appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
  /* 데스크탑: 상단 탭 표시, 하단 탭 숨김 */
  [data-theme="dark"] .bsemi{background:#1e3a5f;color:#93c5fd;}
  [data-theme="dark"] .bfood{background:#064e3b;color:#6ee7b7;}
  [data-theme="dark"] .bent{background:#4a1942;color:#f9a8d4;}
  [data-theme="dark"] .pb.pos{border-color:#065f46;}
  [data-theme="dark"] .pb.neg{border-color:#7f1d1d;}
  [data-theme="dark"] .rn.gold{color:#fbbf24;}
  [data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--card);color:var(--g900);border-color:var(--g200);}
  [data-theme="dark"] input{background:var(--card);color:var(--g900);}
  [data-theme="dark"] .ni{background:var(--pl);border-left-color:var(--primary);}
  [data-theme="dark"] .dc{border-color:var(--g200);}
  [data-theme="dark"] .sc{border-color:var(--g200);}
  [data-theme="dark"] .co{border-color:var(--g200);}
  @media(min-width:769px){.nav-tabs{display:flex!important;}.bottom-tabs{display:none!important;}.mc{padding-bottom:1.1rem;}}
  @media(max-width:480px){.sg{grid-template-columns:1fr 1fr;}.mc{padding:.9rem .75rem;padding-bottom:5rem;}.topbar{padding:0 .85rem;}}

/* ── 신문고 (두루마리) */
.scroll-wrap{position:relative;margin:.5rem 0;cursor:pointer;}
.scroll-top,.scroll-bottom{background:linear-gradient(90deg,#92400e,#b45309,#92400e);border-radius:8px;height:18px;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;z-index:2;}
.scroll-body{background:linear-gradient(180deg,#fef9c3,#fef3c7,#fef9c3);border:1px solid #fde68a;margin:-2px 6px;padding:1rem 1.25rem;position:relative;min-height:80px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08);}
.scroll-body::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 22px,rgba(180,140,60,.12) 22px,rgba(180,140,60,.12) 23px);pointer-events:none;}
.scroll-new{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #f59e0b;border-radius:16px;padding:1.2rem;text-align:center;margin:.5rem 0;box-shadow:0 4px 16px rgba(245,158,11,.15);}
.scroll-stamp{display:inline-block;background:rgba(185,28,28,.08);border:2px solid rgba(185,28,28,.25);border-radius:50%;width:52px;height:52px;line-height:52px;font-size:1.6rem;margin-bottom:.4rem;}
.scroll-item{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:.8rem 1rem;margin-bottom:.55rem;position:relative;box-shadow:0 2px 8px rgba(18,24,38,.05);transition:border-color .15s,transform .15s,box-shadow .15s;}
.scroll-item:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(124,58,237,.3);}
.scroll-item.unread::before{content:'NEW';position:absolute;top:.4rem;right:.6rem;background:#ef4444;color:white;font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:999px;}
.scroll-item.replied::after{content:'답장完';position:absolute;top:.4rem;right:.6rem;background:#16a34a;color:white;font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:999px;}
@keyframes unroll{from{max-height:0;opacity:0}to{max-height:300px;opacity:1}}
.scroll-unroll{animation:unroll .5s cubic-bezier(.34,1.56,.64,1);}

/* ── 부동산 지도 (실제 한반도 모양) */
:root{--kr-sea1:#d9eafc;--kr-sea2:#c3dcf8;--kr-land:#e6f4e0;--kr-coast:#84c08e;--kr-sea-txt:#7da7cf;}
[data-theme="dark"]{--kr-sea1:#0e1830;--kr-sea2:#13203f;--kr-land:#1d3326;--kr-coast:#3f7a52;--kr-sea-txt:#3d5a82;}
.re-map-wrap{overflow:visible;border:none;border-radius:0;background:transparent;padding:0;margin-bottom:1rem;}
.re-map-kr{position:relative;width:100%;max-width:470px;margin:0 auto;aspect-ratio:100/132;background:linear-gradient(180deg,var(--kr-sea1) 0%,var(--kr-sea2) 100%);border-radius:24px;border:1px solid var(--card-border);overflow:hidden;box-shadow:var(--sh);}
.re-map-kr .kr-svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
.re-map-kr .re-cell{position:absolute;transform:translate(-50%,-50%);width:25%;min-height:0;aspect-ratio:auto;padding:.4rem .12rem .38rem;border-radius:14px;border-width:2px;box-shadow:0 3px 10px rgba(18,24,38,.14);}
.re-map-kr .re-cell:hover,.re-map-kr .re-cell.empty:hover,.re-map-kr .re-cell.owned-other:hover,.re-map-kr .re-cell.selecting{transform:translate(-50%,-50%) scale(1.07);}
.re-map-kr .re-cell-emoji{font-size:1.5rem;}
.re-map-kr .cell-label{font-size:.76rem;margin-top:.1rem;}
.re-map-kr .cell-owner{font-size:.58rem;margin-top:.05rem;}
/* 건물 배지 — 마커 모서리에 황금 링으로 표시 */
.cell-bldg{position:absolute;top:-13px;left:-11px;width:31px;height:31px;border-radius:50%;background:var(--card);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.08rem;line-height:1;box-shadow:0 3px 10px rgba(245,158,11,.5);animation:bldgPop .5s cubic-bezier(.34,1.56,.64,1);z-index:2;}
@keyframes bldgPop{from{transform:scale(0) rotate(-30deg);}to{transform:scale(1) rotate(0);}}
.re-cell{border-radius:18px;border:2.5px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);user-select:none;position:relative;aspect-ratio:1;min-height:108px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:.5rem .25rem;}
.re-cell.empty{background:linear-gradient(145deg,#f0f9ff,#e0f2fe);border-color:#bae6fd;}
.re-cell.empty:hover{background:linear-gradient(145deg,#dbeafe,#bfdbfe);border-color:#3b82f6;transform:scale(1.05);box-shadow:0 6px 20px rgba(59,130,246,.25);}
.re-cell.owned-me{background:linear-gradient(145deg,#d1fae5,#a7f3d0);border-color:#34d399;box-shadow:0 4px 14px rgba(52,211,153,.2);}
.re-cell.owned-other{background:linear-gradient(145deg,#f3f4f6,#e5e7eb);border-color:#9ca3af;cursor:pointer;}
.re-cell.owned-other:hover{transform:scale(1.03);box-shadow:0 4px 12px rgba(0,0,0,.12);}
.re-cell.selecting{background:linear-gradient(145deg,#ede9fe,#ddd6fe);border-color:#7c3aed;transform:scale(1.06);box-shadow:0 6px 20px rgba(124,58,237,.3);}
.re-cell .cell-label{font-size:1rem;font-weight:900;margin-top:.25rem;line-height:1.1;letter-spacing:-.01em;}
.re-cell .cell-owner{font-size:.68rem;color:var(--g500);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .2rem;margin-top:.1rem;}
.re-cell-emoji{font-size:2.8rem;line-height:1;display:block;}
.re-legend{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem;}
.re-leg-item{display:flex;align-items:center;gap:.3rem;font-size:.72rem;color:var(--g600);}
.re-leg-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;}
.re-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-bottom:.85rem;}
.re-kpi{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:.7rem .85rem;}
.re-kpi-label{font-size:.7rem;color:var(--g500);margin-bottom:.18rem;}

/* ════════════ v6.6 VISUAL LAYER — 화려한 리스킨 (마크업 무변경 오버라이드) ════════════ */

/* 오로라 배경 — 은은한 브랜드 글로우 */
body{
  background:
    radial-gradient(1100px 560px at 112% -8%, rgba(139,92,246,.16), transparent 58%),
    radial-gradient(900px 520px at -12% 22%, rgba(79,70,229,.13), transparent 55%),
    radial-gradient(820px 540px at 50% 112%, rgba(14,163,116,.10), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
[data-theme="dark"] body{
  background:
    radial-gradient(1100px 560px at 112% -8%, rgba(139,92,246,.22), transparent 58%),
    radial-gradient(900px 520px at -12% 22%, rgba(99,102,241,.18), transparent 55%),
    radial-gradient(820px 540px at 50% 112%, rgba(52,211,153,.10), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}

/* 상단바 — 글래스 */
.topbar{
  background:var(--glass-bar);
  backdrop-filter:blur(16px) saturate(1.5);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);
  border-bottom:1px solid var(--card-border);
}
.tlogo{
  background:var(--grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  letter-spacing:-.01em;
}

/* 하단 탭바 — 떠 있는 알약형 글래스 바 (시그니처) */
.bottom-tabs{
  left:.55rem;right:.55rem;
  bottom:calc(.55rem + env(safe-area-inset-bottom,0px));
  padding:.3rem .25rem;
  border:1px solid var(--card-border);
  border-top:1px solid var(--card-border);
  border-radius:22px;
  background:var(--glass-bar);
  backdrop-filter:blur(18px) saturate(1.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 10px 32px -8px rgba(18,24,38,.22),0 2px 8px rgba(18,24,38,.06);
}
.bt{z-index:0;padding:.5rem 0 .42rem;border-radius:16px;color:var(--g400);font-weight:600;}
.bt.active{color:var(--primary);}
.bt.active::before{
  content:'';position:absolute;inset:.18rem .2rem;border-radius:14px;
  background:var(--pl);z-index:-1;
  top:auto;left:.2rem;right:.2rem;height:auto;inset:.18rem .2rem;
}
.bt .bt-icon{transition:transform .22s cubic-bezier(.34,1.56,.64,1);}
.bt.active .bt-icon{transform:translateY(-1px) scale(1.18);}
.mc{padding-bottom:6.2rem;}

/* 데스크탑 상단 탭 */
.nt{font-weight:600;border-radius:10px 10px 0 0;}
.nt.active{background:linear-gradient(180deg,var(--pl),transparent);}

/* 버튼 — 그라데이션 + 입체감 */
.btn{border-radius:12px;font-weight:600;letter-spacing:-.01em;}
.bp{background:var(--grad);box-shadow:0 4px 14px -4px rgba(79,70,229,.45);}
.bp:hover{opacity:1;filter:brightness(1.07);box-shadow:0 6px 18px -4px rgba(79,70,229,.55);}
.bsuc{background:linear-gradient(135deg,#0ea374,#10b981);box-shadow:0 4px 14px -4px rgba(14,163,116,.4);}
.bsuc:hover{opacity:1;filter:brightness(1.07);}
.bdan{background:linear-gradient(135deg,#e23a5f,#f43f5e);box-shadow:0 4px 14px -4px rgba(226,58,95,.4);}
.bdan:hover{opacity:1;filter:brightness(1.07);}
.bs{border:1px solid var(--card-border);}

/* 카드 — 더 부드럽고 깊이감 있게 + 진입 애니메이션 */
.card,.co,.sc,.dc{border:1px solid var(--card-border);}
.card{box-shadow:var(--sh);}
.tc.active{animation:riseIn .32s cubic-bezier(.21,.9,.35,1);}
@keyframes riseIn{from{opacity:0;transform:translateY(12px) scale(.992);}to{opacity:1;transform:translateY(0) scale(1);}}

/* 히어로 카드 — 빛나는 외곽 + 떠다니는 장식 */
.hero-shell{border-radius:22px;box-shadow:0 18px 44px -14px rgba(99,102,241,.45);}
.hero-shell::after{width:160px;height:160px;background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.28), rgba(255,255,255,.04) 70%);animation:floaty 7s ease-in-out infinite;pointer-events:none;}
@keyframes floaty{0%,100%{transform:translate(0,0);}50%{transform:translate(-8px,8px);}}
.hero-title{font-weight:800;}
.hero-kicker{font-family:'Space Grotesk',sans-serif;letter-spacing:.14em;font-weight:700;text-transform:uppercase;font-size:.66rem;}
.market-card{border-radius:20px;}
.market-price{font-family:'Space Grotesk','Noto Sans KR',sans-serif;}

/* ════════════ 프리미엄 로그인 (스플릿 패널) ════════════ */
#loginScreen{
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;
  background:
    radial-gradient(1000px 560px at 88% -12%, rgba(139,92,246,.2), transparent 60%),
    radial-gradient(820px 520px at 6% 108%, rgba(79,70,229,.16), transparent 60%),
    var(--bg);
}
.lshell{
  display:grid;grid-template-columns:minmax(280px,.92fr) minmax(440px,1.35fr);

  box-shadow:0 24px 60px -24px rgba(79,70,229,.4),0 6px 18px rgba(18,24,38,.08);

}
/* 좌측 브랜드 패널 */

.lbrand-title{font-family:'Space Grotesk','Noto Sans KR',sans-serif;font-weight:700;font-size:2.1rem;line-height:1.08;letter-spacing:-.02em;margin:.9rem 0 0;text-shadow:0 2px 18px rgba(0,0,0,.18);}

.lbrand-stat-v{font-size:1.6rem;line-height:1;}
.lbrand-stat-l{font-size:.72rem;font-weight:700;opacity:.92;margin-top:.45rem;}
.lbrand-foot{position:relative;z-index:1;font-size:.78rem;opacity:.85;font-weight:500;}
/* 우측 폼 카드 */
.lcard{background:var(--card);padding:1.2rem 1.6rem;display:flex;flex-direction:column;justify-content:center;max-width:none;border:none;border-radius:0;box-shadow:none;animation:none;}

.lcard-title{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin:.25rem 0 .3rem;color:var(--g900);}

.seg-btn{flex:1;border:none;background:transparent;font-family:inherit;font-weight:700;font-size:.84rem;color:var(--g500);padding:.45rem;border-radius:9px;cursor:pointer;transition:all .18s;}

.ldivider{display:flex;align-items:center;gap:.8rem;margin:.7rem 0;color:var(--g400);font-size:.76rem;font-weight:600;}
.ldivider::before,.ldivider::after{content:'';flex:1;height:1px;background:var(--card-border);}
/* 명예의 전당 — 패널 세로 중앙 */

.champ-rank-val{font-size:.82rem;font-weight:700;color:rgba(255,255,255,.85);}
/* 하단 기능 아이콘 + 푸터 */

.lbrand-stats{display:flex;gap:.5rem;margin-bottom:.8rem;}
.lbrand-stat{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:.5rem .3rem;text-align:center;backdrop-filter:blur(6px);}
.lbrand-stat-v{font-size:1.2rem;line-height:1;}
.lbrand-stat-l{font-size:.68rem;font-weight:700;opacity:.92;margin-top:.4rem;}

/* 폼 전환 애니메이션 */

.seg-btn{position:relative;}

.stu-btn{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.85rem .2rem .7rem;border-radius:18px;background:var(--card);border:1.5px solid var(--card-border);box-shadow:0 2px 6px rgba(18,24,38,.05);transition:all .16s;cursor:pointer;}
.stu-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(79,70,229,.4);border-color:var(--primary);}
.stu-btn .stu-av{font-size:3rem;line-height:1;transition:transform .18s cubic-bezier(.34,1.56,.64,1);display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:radial-gradient(circle at 35% 30%, #2a3358, #10152b 78%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08), inset 0 2px 6px rgba(0,0,0,.35), 0 1px 2px rgba(18,24,38,.15);}
[data-theme="dark"] .stu-btn .stu-av{background:radial-gradient(circle at 35% 30%, #262e4f, #0c0f22 78%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.07), inset 0 2px 6px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);}
.stu-btn:hover .stu-av{transform:scale(1.14);}
.stu-btn.selected{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 24px -8px rgba(79,70,229,.6);}
.stu-btn.selected[class*="fxc-"]{background:var(--grad) !important;}
.stu-btn.selected[class*="fxc-"]::before{opacity:.35;}
.stu-btn.selected .stu-av{transform:scale(1.18);background:none;box-shadow:none;}
.stu-btn .stu-nm{font-size:.92rem;font-weight:700;letter-spacing:-.02em;}

/* ══ 이펙트 카드 프레임 (fxc-*) — 장착 시 로그인 카드 전체가 등급색으로 발광 ══ */
.stu-btn[class*="fxc-"]{position:relative;overflow:hidden;}
.stu-btn[class*="fxc-"] .stu-nm{font-weight:800;}
/* 샤인 스윕 — 대각선 광택이 카드를 가로지름 */
.stu-btn[class*="fxc-"]::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);
  transform:translateX(-140%);animation:fxCardSweep 4s ease-in-out infinite;}
@keyframes fxCardSweep{0%,55%{transform:translateX(-140%);}75%{transform:translateX(140%);}100%{transform:translateX(140%);}}
@media (prefers-reduced-motion: reduce){.stu-btn[class*="fxc-"]::after{animation:none;display:none;}}

.fxc-black{border-color:#3f3f46 !important;background:linear-gradient(180deg,#f4f4f5,var(--card)) !important;box-shadow:0 0 0 1px #3f3f46,0 6px 20px -6px rgba(24,24,27,.5) !important;}
.fxc-black .stu-nm{color:#27272a;}

.fxc-gold .stu-nm{color:#b45309;}
.fxc-emerald{border-color:#10b981 !important;background:linear-gradient(180deg,#ecfdf5,var(--card)) !important;box-shadow:0 0 0 1.5px #34d399,0 8px 22px -6px rgba(16,185,129,.5) !important;}
.fxc-emerald .stu-nm{color:#047857;}
/* 회전 프레임 3종: ocean / rainbow / diamond — conic-gradient 테두리가 카드 둘레를 돎 */
.fxc-ocean,.fxc-rainbow,.fxc-diamond{border-color:transparent !important;background:linear-gradient(180deg,var(--card),var(--card)) padding-box !important;box-shadow:0 8px 22px -6px rgba(79,70,229,.4) !important;}
.fxc-ocean{position:relative;}
.fxc-ocean::before,.fxc-rainbow::before,.fxc-diamond::before{content:'';position:absolute;inset:-2px;border-radius:20px;z-index:-1;padding:2.5px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;}
.fxc-ocean::before{background:conic-gradient(from 0deg,#0ea5e9,#22d3ee,#a78bfa,#0ea5e9);animation:fxCardSpin 3s linear infinite;}
.fxc-rainbow::before{background:conic-gradient(from 0deg,#ff0040,#ff8a00,#ffe600,#00e676,#00b0ff,#7c4dff,#ff0040);animation:fxCardSpin 2.4s linear infinite;}
.fxc-diamond::before{background:conic-gradient(from 0deg,#e0f2fe,#ffffff,#bae6fd,#ffffff,#e0f2fe);animation:fxCardSpin 2.8s linear infinite;}
@keyframes fxCardSpin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){.fxc-ocean::before,.fxc-rainbow::before,.fxc-diamond::before{animation:none;}}
[data-theme="dark"] .fxc-black{background:linear-gradient(180deg,#27272a,var(--card)) !important;}
[data-theme="dark"] .fxc-black .stu-nm{color:#d4d4d8;}
[data-theme="dark"] .fxc-silver{background:linear-gradient(180deg,#334155,var(--card)) !important;}

[data-theme="dark"] .fxc-gold{background:linear-gradient(180deg,#451a03,var(--card)) !important;}
[data-theme="dark"] .fxc-gold .stu-nm{color:#fbbf24;}
[data-theme="dark"] .fxc-emerald{background:linear-gradient(180deg,#022c22,var(--card)) !important;}

/* 모달 */
.mi{border:1px solid var(--card-border);border-radius:22px;box-shadow:0 28px 64px -20px rgba(18,24,38,.4);animation:riseIn .26s cubic-bezier(.21,.9,.35,1);}
.mo{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);background:rgba(12,16,32,.5);}

/* 토스트 */
#toast{background:rgba(18,24,38,.92);backdrop-filter:blur(8px);box-shadow:0 10px 30px -8px rgba(0,0,0,.4);transform:translateX(-50%) translateY(6px);transition:opacity .3s,transform .3s;}
#toast.show{transform:translateX(-50%) translateY(0);}
[data-theme="dark"] #toast{background:rgba(237,240,248,.95);color:#121826;}

/* 버전 배지 */
.ver{border:1px solid var(--card-border);background:var(--glass-bar);backdrop-filter:blur(8px);}

/* 스크롤바 */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--g400);}

/* ════════════ v6.7 REFINEMENT LAYER — 한 단계 더 세련되게 ════════════ */

/* 배경: 오로라 + 초미세 도트 텍스처 */
body{
  background:
    radial-gradient(rgba(79,70,229,.05) 1px, transparent 1.4px),
    radial-gradient(1100px 560px at 112% -8%, rgba(139,92,246,.15), transparent 58%),
    radial-gradient(900px 520px at -12% 22%, rgba(79,70,229,.12), transparent 55%),
    radial-gradient(820px 540px at 50% 112%, rgba(14,163,116,.09), transparent 60%),
    var(--bg);
  background-size:22px 22px,auto,auto,auto,auto;
  background-attachment:fixed;
}
[data-theme="dark"] body{
  background:
    radial-gradient(rgba(129,140,248,.06) 1px, transparent 1.4px),
    radial-gradient(1100px 560px at 112% -8%, rgba(139,92,246,.2), transparent 58%),
    radial-gradient(900px 520px at -12% 22%, rgba(99,102,241,.16), transparent 55%),
    radial-gradient(820px 540px at 50% 112%, rgba(52,211,153,.09), transparent 60%),
    var(--bg);
  background-size:22px 22px,auto,auto,auto,auto;
  background-attachment:fixed;
}

/* 숫자 가독성: 고정폭 숫자 */
body{font-variant-numeric:tabular-nums;}

/* 상단바: 더 얇고 또렷하게 */
.topbar{box-shadow:0 1px 0 var(--card-border),0 8px 24px -16px rgba(18,24,38,.18);}
.tlogo{position:relative;padding-left:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
.tlogo::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:99px;background:var(--grad);box-shadow:0 0 0 3px var(--pl);pointer-events:none;}

/* 섹션 타이틀: 그라데이션 액센트 바 */
.ct{position:relative;padding-left:.72rem;font-weight:800;letter-spacing:-.015em;}
.ct::before{content:'';position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:99px;background:var(--grad);pointer-events:none;}

/* 카드: 정제된 그림자 스택 + 내부 하이라이트 */
.card{
  border-radius:18px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65),
    0 1px 2px rgba(18,24,38,.04),
    0 8px 24px -10px rgba(79,70,229,.12);
}
[data-theme="dark"] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.5);}

/* 히어로: 레이어드 광택 + 사선 패턴 */
.hero-shell{position:relative;}
.hero-shell::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px),
    linear-gradient(180deg, rgba(255,255,255,.14), transparent 38%);
  mix-blend-mode:overlay;
}

/* 칩 통일: 유리알 느낌 */
.news-chip,.pulse-chip{border-radius:999px;font-weight:700;letter-spacing:.01em;border:1px solid var(--card-border);background:var(--g50);}
.news-chip.neu{color:var(--g600);}
.pulse-chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(4px);}

/* 입력 포커스: 브랜드 글로우 링 */
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary) !important;box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);}

/* 하단 탭바: 더 컴팩트 + 액티브 글로우 */
.bottom-tabs{box-shadow:0 12px 36px -10px rgba(18,24,38,.28),0 2px 8px rgba(18,24,38,.07),inset 0 1px 0 rgba(255,255,255,.5);}
[data-theme="dark"] .bottom-tabs{box-shadow:0 12px 36px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);}
.bt.active::before{box-shadow:0 4px 12px -4px rgba(79,70,229,.4);}
.bt .bt-label{font-size:.6rem;letter-spacing:-.01em;}

/* 빈 상태 */
.empty{border:1.5px dashed var(--g200);border-radius:14px;background:var(--g50);}

/* 모달: 상단 그립 바 (모바일 시트 감성) */
.mi{position:relative;}
.mi::before{content:'';position:absolute;top:.55rem;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:99px;background:var(--g200);pointer-events:none;}

/* ── 이모지 특수 효과 (이모지 귀속 · 테두리+이펙트 중첩 가능) — v6.8 화려 버전 */
.fxw{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;line-height:1;padding:.12em .14em;vertical-align:middle;position:relative;isolation:isolate;}

/* ── 테두리 (b 슬롯) ── */
.fx-gold{border:3.5px solid #fbbf24;background:radial-gradient(circle at 32% 28%, rgba(255,235,150,.7), rgba(245,158,11,.2) 70%);box-shadow:0 0 14px 3px rgba(245,158,11,.85),inset 0 0 10px rgba(255,215,0,.6);animation:fxGoldPulse 1.5s ease-in-out infinite;}
@keyframes fxGoldPulse{0%,100%{box-shadow:0 0 10px 2px rgba(245,158,11,.7),inset 0 0 8px rgba(255,215,0,.5);}50%{box-shadow:0 0 20px 5px rgba(255,200,40,1),inset 0 0 12px rgba(255,225,90,.8);}}
.fx-silver{border:3.5px solid #f1f5f9;background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), rgba(148,163,184,.25) 70%);box-shadow:0 0 13px 3px rgba(203,213,225,.9),inset 0 0 10px rgba(255,255,255,.7);animation:fxSilverPulse 1.7s ease-in-out infinite;}
@keyframes fxSilverPulse{0%,100%{box-shadow:0 0 9px 2px rgba(203,213,225,.7),inset 0 0 7px rgba(255,255,255,.55);}50%{box-shadow:0 0 18px 5px rgba(226,232,240,1),inset 0 0 11px rgba(255,255,255,.85);}}
.fx-black{border:3.5px solid #1e293b;background:radial-gradient(circle at 32% 28%, rgba(100,116,139,.55), rgba(15,23,42,.3) 70%);box-shadow:0 0 13px 3px rgba(15,23,42,.9),inset 0 0 9px rgba(0,0,0,.7);animation:fxBlackPulse 2s ease-in-out infinite;}
@keyframes fxBlackPulse{0%,100%{box-shadow:0 0 11px 2px rgba(15,23,42,.85),inset 0 0 8px rgba(0,0,0,.6);}50%{box-shadow:0 0 16px 4px rgba(71,85,105,.95),inset 0 0 11px rgba(0,0,0,.75);}}
[data-theme="dark"] .fx-black{border-color:#cbd5e1;box-shadow:0 0 12px 3px rgba(148,163,184,.7),inset 0 0 8px rgba(0,0,0,.7);}
/* 무지개 — 회전하는 콘 그라데이션 링 */
.fx-rainbow{border:3px solid transparent;}
.fx-rainbow::before{content:'';position:absolute;inset:-4px;border-radius:999px;z-index:-1;padding:3px;background:conic-gradient(from 0deg,#ff0040,#ff8a00,#ffe600,#00e676,#00b0ff,#7c4dff,#ff0040);animation:fxSpin 2s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 6px rgba(124,77,255,.7));}
.fx-rainbow::after{content:'';position:absolute;inset:-4px;border-radius:999px;z-index:-2;background:conic-gradient(from 0deg,#ff0040,#ff8a00,#ffe600,#00e676,#00b0ff,#7c4dff,#ff0040);filter:blur(7px);opacity:.55;animation:fxSpin 2s linear infinite;}
@keyframes fxSpin{to{transform:rotate(360deg);}}
/* 에메랄드 — 초록 보석 광택 펄스 */
.fx-emerald{border:3.5px solid #10b981;background:radial-gradient(circle at 32% 28%, rgba(167,243,208,.7), rgba(16,185,129,.2) 70%);box-shadow:0 0 14px 3px rgba(16,185,129,.85),inset 0 0 10px rgba(110,231,183,.6);animation:fxEmeraldPulse 1.6s ease-in-out infinite;}
@keyframes fxEmeraldPulse{0%,100%{box-shadow:0 0 12px 2px rgba(16,185,129,.7),inset 0 0 8px rgba(110,231,183,.5);}50%{box-shadow:0 0 20px 5px rgba(52,211,153,1),inset 0 0 13px rgba(167,243,208,.85);}}
/* 오로라 — 청록-보라 그라데이션 회전 링 */
.fx-ocean{border:3.5px solid transparent;}
.fx-ocean::before{content:'';position:absolute;inset:-4px;border-radius:999px;z-index:-1;padding:3.5px;background:conic-gradient(from 0deg,#22d3ee,#3b82f6,#8b5cf6,#22d3ee);animation:fxSpin 3s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 7px rgba(59,130,246,.8));}
.fx-ocean::after{content:'';position:absolute;inset:-5px;border-radius:999px;z-index:-2;background:conic-gradient(from 0deg,#22d3ee,#3b82f6,#8b5cf6,#22d3ee);filter:blur(8px);opacity:.5;animation:fxSpin 3s linear infinite;}
/* 다이아 — 백색 프리즘 반짝임 + 회전 광채 */
.fx-diamond{border:3.5px solid #bae6fd;background:radial-gradient(circle at 30% 26%, rgba(255,255,255,.95), rgba(186,230,253,.3) 65%);box-shadow:0 0 16px 4px rgba(186,230,253,.95),inset 0 0 11px rgba(255,255,255,.8);animation:fxDiamondPulse 1.4s ease-in-out infinite;}
.fx-diamond::after{content:'';position:absolute;inset:-6px;border-radius:999px;z-index:-1;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,255,255,.95) 20deg,transparent 45deg,transparent 160deg,rgba(186,230,253,.9) 185deg,transparent 210deg,transparent 340deg,rgba(255,255,255,.9) 360deg);animation:fxSpin 2.5s linear infinite;filter:drop-shadow(0 0 5px rgba(255,255,255,.9));}
@keyframes fxDiamondPulse{0%,100%{box-shadow:0 0 13px 3px rgba(186,230,253,.85),inset 0 0 9px rgba(255,255,255,.7);}50%{box-shadow:0 0 22px 6px rgba(255,255,255,1),inset 0 0 14px rgba(224,242,254,.9);}}

/* ── 이펙트 (a 슬롯) ── */
/* 반짝임 — 회전하는 광선 + 밝기 펄스 (확실히 보이게) */
.fxa-shine{animation:fxShineGlow 1.5s ease-in-out infinite;}
.fxa-shine::after{content:'';position:absolute;inset:-6px;z-index:-1;border-radius:999px;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,255,255,.95) 18deg,transparent 36deg,transparent 162deg,rgba(255,243,180,.9) 180deg,transparent 198deg,transparent 342deg,rgba(255,255,255,.9) 360deg);animation:fxSpin 2.4s linear infinite;filter:drop-shadow(0 0 4px rgba(255,235,150,.9));}
.fxa-shine::before{content:'✦';position:absolute;top:-.5em;right:-.32em;font-size:.5em;color:#fff;text-shadow:0 0 6px #ffe680;animation:fxTwinkle 1s ease-in-out infinite;z-index:1;}
@keyframes fxShineGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,235,140,.8)) brightness(1.05);}50%{filter:drop-shadow(0 0 14px rgba(255,240,160,1)) brightness(1.25);}}
/* 네온 — 보라 펄스 링 */
.fxa-neon{animation:fxNeonGlow 1.3s ease-in-out infinite;}
.fxa-neon::after{content:'';position:absolute;inset:-3px;border-radius:999px;z-index:-1;border:2.5px solid #c084fc;box-shadow:0 0 10px #a855f7,0 0 18px #a855f7,inset 0 0 8px #c084fc;animation:fxNeonRing 1.3s ease-in-out infinite;}
@keyframes fxNeonRing{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
@keyframes fxNeonGlow{0%,100%{filter:drop-shadow(0 0 5px rgba(168,85,247,.85));}50%{filter:drop-shadow(0 0 13px rgba(192,132,252,1));}}
/* 불꽃 오라 — 일렁이는 화염 후광 */
.fxa-fire{animation:fxFireGlow .55s ease-in-out infinite alternate;}
.fxa-fire::after{content:'';position:absolute;inset:-9px;border-radius:50%;z-index:-1;background:radial-gradient(circle at 50% 62%,rgba(255,221,87,.95),rgba(249,115,22,.75) 42%,rgba(239,68,68,.4) 66%,transparent 78%);filter:blur(2.5px);animation:fxFireFlicker .4s ease-in-out infinite alternate;}
.fxa-fire::before{content:'🔥';position:absolute;top:-.62em;left:50%;transform:translateX(-50%);font-size:.55em;z-index:1;animation:fxFireDance .5s ease-in-out infinite alternate;}
@keyframes fxFireGlow{from{filter:drop-shadow(0 -2px 6px rgba(249,115,22,.9));}to{filter:drop-shadow(0 -4px 12px rgba(239,68,68,1)) brightness(1.1);}}
@keyframes fxFireFlicker{from{transform:scale(.94) translateY(1px);opacity:.85;}to{transform:scale(1.12) translateY(-1px);opacity:1;}}
@keyframes fxFireDance{from{transform:translateX(-50%) scale(.9) rotate(-6deg);}to{transform:translateX(-50%) scale(1.1) rotate(6deg);}}
/* 왕관 */
.fxa-crown::before{content:'👑';position:absolute;top:-.66em;left:50%;transform:translateX(-50%);font-size:.58em;pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3)) drop-shadow(0 0 5px rgba(255,215,0,.7));animation:fxCrownBob 1.6s ease-in-out infinite;z-index:1;}
@keyframes fxCrownBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-4deg);}50%{transform:translateX(-50%) translateY(-2px) rotate(4deg);}}
/* 별가루 — 사방 반짝이 파티클 */
.fxa-stardust::after{content:'✨';position:absolute;top:-.42em;right:-.46em;font-size:.5em;pointer-events:none;animation:fxTwinkle 1.2s ease-in-out infinite;z-index:1;}
.fxa-stardust::before{content:'⭐';position:absolute;bottom:-.36em;left:-.46em;font-size:.42em;pointer-events:none;animation:fxTwinkle 1.2s ease-in-out infinite .6s;z-index:1;}
.fxa-stardust{animation:fxStardustGlow 2s ease-in-out infinite;}
@keyframes fxStardustGlow{0%,100%{filter:drop-shadow(0 0 3px rgba(255,255,255,.6));}50%{filter:drop-shadow(0 0 9px rgba(255,255,200,.95));}}
@keyframes fxTwinkle{0%,100%{opacity:.3;transform:scale(.7) rotate(0deg);}50%{opacity:1;transform:scale(1.3) rotate(20deg);}}
/* 벚꽃 엔딩 — 벚꽃잎이 팔랑팔랑 떨어짐 */
.fxa-sakura{animation:fxSakuraGlow 3s ease-in-out infinite;}
.fxa-sakura::before{content:'🌸';position:absolute;top:-.55em;left:-.15em;font-size:.46em;pointer-events:none;animation:fxFall1 2.6s linear infinite;}
.fxa-sakura::after{content:'🌸';position:absolute;top:-.55em;right:-.1em;font-size:.4em;pointer-events:none;animation:fxFall2 3.1s linear infinite .8s;}
@keyframes fxSakuraGlow{0%,100%{filter:drop-shadow(0 0 3px rgba(251,182,206,.6));}50%{filter:drop-shadow(0 0 8px rgba(251,182,206,.9));}}
@keyframes fxFall1{0%{transform:translateY(-.3em) rotate(0deg);opacity:0;}15%{opacity:1;}100%{transform:translateY(1.6em) translateX(-.4em) rotate(220deg);opacity:0;}}
@keyframes fxFall2{0%{transform:translateY(-.3em) rotate(0deg);opacity:0;}15%{opacity:1;}100%{transform:translateY(1.7em) translateX(.4em) rotate(-200deg);opacity:0;}}
/* 행운 — 네잎클로버 + 반짝이는 초록 광채 */
.fxa-lucky{animation:fxLuckyGlow 1.6s ease-in-out infinite;}
.fxa-lucky::before{content:'🍀';position:absolute;top:-.5em;right:-.42em;font-size:.5em;pointer-events:none;animation:fxLuckyBob 1.5s ease-in-out infinite;z-index:1;}
.fxa-lucky::after{content:'✨';position:absolute;bottom:-.34em;left:-.4em;font-size:.4em;pointer-events:none;animation:fxTwinkle 1.3s ease-in-out infinite .4s;z-index:1;}
@keyframes fxLuckyGlow{0%,100%{filter:drop-shadow(0 0 3px rgba(74,222,128,.6));}50%{filter:drop-shadow(0 0 10px rgba(74,222,128,1));}}
@keyframes fxLuckyBob{0%,100%{transform:translateY(0) rotate(-12deg);}50%{transform:translateY(-2px) rotate(12deg);}}
/* 유성 — 별똥별이 대각선으로 가로지름 */
.fxa-meteor{animation:fxMeteorGlow 2s ease-in-out infinite;}
.fxa-meteor::before{content:'💫';position:absolute;top:-.5em;left:-.5em;font-size:.5em;pointer-events:none;animation:fxShoot 1.8s ease-in infinite;z-index:1;}
@keyframes fxMeteorGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(147,197,253,.6));}50%{filter:drop-shadow(0 0 11px rgba(147,197,253,.95));}}
@keyframes fxShoot{0%{transform:translate(0,0) scale(.6);opacity:0;}10%{opacity:1;}70%{opacity:1;}100%{transform:translate(1.7em,1.7em) scale(1);opacity:0;}}
/* 유령 오라 — 으스스하게 일렁이는 보라빛 + 유령 */
.fxa-ghost{animation:fxGhostFloat 2.4s ease-in-out infinite;}
.fxa-ghost::after{content:'';position:absolute;inset:-8px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(167,139,250,.55),rgba(124,58,237,.25) 55%,transparent 75%);filter:blur(3px);animation:fxGhostPulse 2.4s ease-in-out infinite;}
.fxa-ghost::before{content:'👻';position:absolute;top:-.5em;right:-.4em;font-size:.46em;pointer-events:none;animation:fxGhostBob 2s ease-in-out infinite;z-index:1;}
@keyframes fxGhostFloat{0%,100%{filter:drop-shadow(0 0 5px rgba(167,139,250,.7));}50%{filter:drop-shadow(0 0 12px rgba(167,139,250,1));}}
@keyframes fxGhostPulse{0%,100%{opacity:.6;transform:scale(.95);}50%{opacity:1;transform:scale(1.1);}}
@keyframes fxGhostBob{0%,100%{transform:translateY(0) rotate(-6deg);opacity:.75;}50%{transform:translateY(-3px) rotate(6deg);opacity:1;}}
/* 번개 — 찌릿한 전기 플래시 */
.fxa-thunder{animation:fxThunderFlash 2.2s steps(1) infinite;}
.fxa-thunder::before{content:'⚡';position:absolute;top:-.5em;left:50%;transform:translateX(-50%);font-size:.55em;pointer-events:none;animation:fxThunderBolt 2.2s ease-in-out infinite;z-index:1;}
.fxa-thunder::after{content:'';position:absolute;inset:-5px;border-radius:50%;z-index:-1;border:2px solid rgba(250,204,21,.7);box-shadow:0 0 10px rgba(250,204,21,.8);opacity:0;animation:fxThunderRing 2.2s ease-out infinite;}
@keyframes fxThunderFlash{0%,88%,100%{filter:drop-shadow(0 0 4px rgba(250,204,21,.5));}90%,94%{filter:drop-shadow(0 0 14px rgba(253,224,71,1)) brightness(1.3);}92%{filter:drop-shadow(0 0 4px rgba(250,204,21,.5));}}
@keyframes fxThunderBolt{0%,85%,100%{opacity:.5;transform:translateX(-50%) scale(.85);}90%{opacity:1;transform:translateX(-50%) scale(1.25);}}
@keyframes fxThunderRing{0%,85%{opacity:0;transform:scale(.8);}90%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.4);}}

/* ── 가챠(랜덤 뽑기) 연출 */

function applyStudentOrder(arr){
  const ord=(state&&state.studentOrder)||[];
  if(!ord.length) return arr;
  const idx=n=>{const i=ord.indexOf(n);return i<0?9999:i;};
  return [...arr].sort((a,b)=>idx(a.name)-idx(b.name));
}
function realStudents(){
  const base=STUDENTS.filter(s=>!TEST_ACCOUNTS.includes(s.name));
  const extra=(state&&state.extraStudents)||[];
  const removed=(state&&state.removedStudents)||[];
  return applyStudentOrder([...base,...extra].filter(s=>!removed.includes(s.name)));
}

function kst(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+9*3600000);}

function fE2(n){return parseFloat(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')+' '+CURRENCY;}

function daysLeft(dateStr){const now=kst();const t=new Date(dateStr);const diff=Math.ceil((t-now)/(1000*60*60*24));return Math.max(0,diff);}

function flushDirtyStudents(){
  if(!dirtyStudents.size) return Promise.resolve();
  const payload={};
  [...dirtyStudents].forEach(name=>{
    if(state?.students?.[name]){
      const d=JSON.parse(JSON.stringify(state.students[name]));
      // iconList 최신화 (iconMap → iconList)
      if(d.iconMap) d.iconList=Object.keys(d.iconMap).filter(e=>e&&e.trim());
      delete d.iconMap; // Firebase에는 iconMap 쓰지 않음
      payload[name]=d;
    }
  });
  dirtyStudents.clear();
  if(!Object.keys(payload).length) return Promise.resolve();
  return update(ref(db,ROOT+'/students'),payload);
}
function teacherSharedStatePayload(){
  const cloned=JSON.parse(JSON.stringify(state||{}));
  // ── 무거운 데이터는 제외 (각 함수에서 직접 경로로 저장) ──
  delete cloned.students;       // 학생: 별도 경로
  delete cloned.txLog;          // 거래내역: 별도 저장
  delete cloned.board;          // 게시판: set('/board') 로 저장
  delete cloned.homework;       // 과제: set('/homework') 로 저장
  delete cloned.patrolLog;      // 순찰: update('/patrolLog') 로 저장
  delete cloned.donationLog;    // 기부내역: update() 로 저장
  delete cloned.marketHistory;  // 시장히스토리: runMarket에서 저장
  // donationItems: id로 주소 지정 가능하도록 배열이 아닌 {id: item} 객체로 저장
  // (항목별 total을 개별 트랜잭션 경로로 원자적으로 증가시키기 위함)
  if(Array.isArray(cloned.donationItems)){
    const map={};
    cloned.donationItems.forEach(it=>{ if(it&&it.id) map[it.id]=it; });
    cloned.donationItems=map;
  }
  // ── undefined 값 제거 (Firebase update 오류 방지) ──
  Object.keys(cloned).forEach(k=>{ if(cloned[k]===undefined) cloned[k]=null; });
  // ── 나머지 배열 크기 제한 ──
  if(cloned.news && cloned.news.length>20) cloned.news=cloned.news.slice(0,20);
  if(cloned.stocks){
    Object.keys(cloned.stocks).forEach(sid=>{
      const s=cloned.stocks[sid];
      if(s.history && s.history.length>31) s.history=s.history.slice(-31);
      if(s.dateHistory && s.dateHistory.length>31) s.dateHistory=s.dateHistory.slice(-31);
      if(s.intraday && s.intraday.length>10) s.intraday=s.intraday.slice(-10);
    });
  }
  return cloned;
}

// 30-day pre-sim
function sim30(){
  const h={semi:[100],food:[100],ent:[100]},news=[];
  for(let d=0;d<30;d++){
    const big=(d===14||d===29);
    STOCKS.forEach(s=>{
      const pool=NP[s.id],ni=pool[Math.floor(Math.random()*pool.length)];
      let mc=big?0.10:0.03,c=(Math.random()*mc*2)-mc;
      if(ni.p)c=Math.abs(c); else c=-Math.abs(c);
      const prev=h[s.id][h[s.id].length-1];
      const np=Math.max(0.01,parseFloat((prev*(1+c)).toFixed(2)));
      h[s.id].push(np);
      news.unshift({sid:s.id,t:ni.t,p:ni.p,date:`${30-d}일 전`,price:np,prev,chg:((np-prev)/prev*100).toFixed(2)});
    });
  }
  return{h,news:news.slice(0,60)};
}

      delete state.lotteryEmojis;
    }
    if(!state._le) state._le=_enc(['🍀','💎','🌟','🏆','🔮']);
    if(!state.extraStudents) state.extraStudents=[];
    else if(!Array.isArray(state.extraStudents)) state.extraStudents=Object.values(state.extraStudents);
    if(!state.removedStudents) state.removedStudents=[];
    else if(!Array.isArray(state.removedStudents)) state.removedStudents=Object.values(state.removedStudents);
    if(state.boardEnabled===undefined) state.boardEnabled=true;
    if(state.timerEnabled===undefined) state.timerEnabled=true;
    if(!state.timerMinutes) state.timerMinutes=15;
    if(state.rankResetDate===undefined) state.rankResetDate=null;
    checkMonthlyRankReset();
    if(!state.donationLog) state.donationLog=[];
    else if(!Array.isArray(state.donationLog)) state.donationLog=Object.values(state.donationLog);
    if(!state.donationItems||!Array.isArray(state.donationItems)||state.donationItems.length===0){
      state.donationItems=[
        {id:'d1',name:'우리 반 나무 기부',amount:300,reward:'🌳 학급 나무 심기 기념일',total:0},
        {id:'d2',name:'이웃돕기 성금',amount:200,reward:'🎁 이웃돕기 상장 수여',total:0}
      ];
      // 기존 DB에 donationItems가 없던 경우 즉시 id 기준 객체로 기록 (다른 클라이언트도 바로 완전한 항목 정보를 받도록)
      const map={}; state.donationItems.forEach(it=>{ map[it.id]=it; });
      update(ref(db,ROOT+'/donationItems'),map).catch(()=>{});
    }

    // dep0(외부 입금 총액) 재계산: txLog 기반 정확한 값으로 1회 보정
    // dep0Fixed 플래그가 있으면 이미 보정된 것이므로 건너뜀
    const txLog=state.txLog||[];
    STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
      const st=state.students[s.name];
      if(!st) return;
      if(!st.dep0Fixed){
        const myTx=txLog.filter(t=>t.name===s.name);
        if(myTx.length>0){
          let netDeposit=0;
          myTx.forEach(t=>{
            const note=t.note||'';
            const isStockTrade=note.includes('\ub9e4\uc218')||note.includes('\ub9e4\ub3c4')||note.includes('매수')||note.includes('매도');
            if(isStockTrade) return;
            if(t.type==='deposit') netDeposit+=t.amt;
            else if(t.type==='withdraw') netDeposit-=t.amt;
          });
          if(netDeposit>0) st.dep0=netDeposit;
        }
        st.dep0Fixed=true;
        update(ref(db,ROOT+'/students/'+s.name),{dep0:st.dep0||0,dep0Fixed:true}).catch(()=>{});
      }
      // iconSpent 복구: iconSpent가 없고 dep0Fixed가 된 학생만 (신규 데이터는 건드리지 않음)
      if(!st.iconSpent && st.dep0Fixed && !st.iconSpentFixed){
        let spent=0;
        Object.keys(st.iconMap||{}).forEach(e=>{ spent+=emojiPrice(e); });
        // 기부는 별도이므로 여기서 더하지 않음
        if(spent>0){
          st.iconSpent=spent;
          st.iconSpentFixed=true;
          update(ref(db,ROOT+'/students/'+s.name),{iconSpent:spent,iconSpentFixed:true}).catch(()=>{});
        }
      }
    });

    // 깨진 뉴스 데이터 정리 (인코딩 문제로 손상된 기존 데이터 제거)
    function isCorrupted(str){
      if(!str||typeof str!=='string') return false;
      return /[\u00c0-\u024f]/.test(str);
    }
    let cleaned=false;
    if(state.news){
      const before=state.news.length;
      state.news=state.news.filter(n=>!isCorrupted(n.t));
      if(state.news.length<before){console.log(`Cleaned ${before-state.news.length} corrupted news`);cleaned=true;}
    }
    if(state.todayNews&&state.todayNews.items){
      if(state.todayNews.items.some(n=>isCorrupted(n.t))){
        console.log('Clearing corrupted todayNews');
        delete state.todayNews;cleaned=true;
      }
    }
    if(cleaned){
      // boot 시점에는 cu가 없으므로 직접 저장
      const cleanData={};
      if(state.news) cleanData.news=state.news;
      if(state.todayNews===undefined) cleanData.todayNews=null;
      update(ref(db,ROOT),cleanData).catch(()=>{});
    }

    // Run market if needed (weekdays only)
    runMarket();


    // ── Realtime listener: 공유 상태(주가/뉴스/설정)와 학생 데이터를 분리 구독
    // 루트 전체 구독 → 전체 데이터 매번 다운로드 방지
    function processStudentData(name, st){
      if(!st) return;
      if(!st.cb)  st.cb={semi:0,food:0,ent:0};
      if(!st.hld) st.hld={semi:0,food:0,ent:0};
      if(st.deps&&!Array.isArray(st.deps)) st.deps=Object.values(st.deps);
      if(!st.deps) st.deps=[];
      // txLog: 객체(ts키) → 배열로 변환 후 최신순 정렬
      if(st.txLog&&!Array.isArray(st.txLog)){
        st.txLog=Object.values(st.txLog).sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
      }
      if(!st.txLog) st.txLog=[];
      if(Array.isArray(st.iconList)){
        if(!st.iconMap) st.iconMap={};
        st.iconList.forEach(e=>{ if(e) st.iconMap[e]=true; });
      }
      if(Array.isArray(st.iconFxList)){
        st.iconFx={};
        st.iconFxList.forEach(it=>{ if(it&&it.e){ const{e,...v}=it; st.iconFx[e]=v; } });
      }
      if(st.iconCollection){
        const arr=Array.isArray(st.iconCollection)?st.iconCollection:Object.values(st.iconCollection);
        if(!st.iconMap) st.iconMap={};
        arr.forEach(e=>{ if(e) st.iconMap[e]=true; });
        delete st.iconCollection;
      }
      if(!st.iconMap) st.iconMap={};
    }

    // 1) 공유 상태 구독 (주가·뉴스·설정 등 — 무거운 배열은 제외)
    //    board/homework/patrolLog는 탭 진입 시 get()으로 1회 로드
    //    donationItems는 항목별 total에 race condition 방지 로직이 필요해 아래에서 별도 병합
    const SHARED_KEYS=['stocks','news','todayNews','lastHour','lastMD','dayCount',
      'pd','lotteryWon','police','viceTeachers','cashierName',
      'passwords','teacherPw','realestate','checkLists',
      'extraStudents','removedStudents','studentOrder','teacherIssues','marketPaused','marketMode','stockMode',
      'timerMinutes','timerEnabled','sellFee','returnSystemVersion',
      'marketRunLock','donationTree','homeworkUrl','tabsEnabled','lastWeekendPaid','globalNotice','rePending','dept'];

    onValue(ref(db,ROOT),(snap)=>{
      if(!snap.exists()) return;
      const remote=snap.val();

      // 공유 키 병합
      SHARED_KEYS.forEach(k=>{ if(remote[k]!==undefined) state[k]=remote[k]; });
      // donationItems: 배열/객체 정규화 + 항목별 total은 로컬·원격 중 큰 값 유지 (기부 트랜잭션 race condition 방지)
      if(remote.donationItems!==undefined){
        const remoteItems=Array.isArray(remote.donationItems)?remote.donationItems:Object.values(remote.donationItems||{});
        const localById={}; (state.donationItems||[]).forEach(it=>{ if(it&&it.id) localById[it.id]=it; });
        state.donationItems=remoteItems.filter(Boolean).map(it=>({...it, total:Math.max(localById[it.id]?.total||0, it.total||0)}));
      }
      // donationLog: 객체로 저장된 경우 배열로 변환
      if(state.donationLog && !Array.isArray(state.donationLog)){
        state.donationLog=Object.values(state.donationLog).sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
      }
      if(!state.students) state.students={};
      if(!state.rePending) state.rePending={};
      if(!state.dept) state.dept={};
      if(state.extraStudents&&!Array.isArray(state.extraStudents)) state.extraStudents=Object.values(state.extraStudents);
      if(!state.extraStudents) state.extraStudents=[];
      if(!state.lotteryWon) state.lotteryWon={};

      // board/homework/patrolLog — 원격에 변경 있으면 로컬 플래그 리셋 → 다음 탭 진입 시 재로드
      if(remote._boardTs && remote._boardTs !== state._boardTs){ _boardLoaded=false; state._boardTs=remote._boardTs; }
      if(remote._hwTs   && remote._hwTs   !== state._hwTs)  { _hwLoaded=false;     state._hwTs=remote._hwTs; }
      if(remote._patrolTs && remote._patrolTs !== state._patrolTs){ _patrolLoaded=false; state._patrolTs=remote._patrolTs; }
      STOCKS.forEach(s=>{
        if(!state.stocks?.[s.id]) return;
        const st=state.stocks[s.id];
        if(st.history&&!Array.isArray(st.history)) st.history=Object.values(st.history);
        if(!st.dateHistory) st.dateHistory=[];
        else if(!Array.isArray(st.dateHistory)) st.dateHistory=Object.values(st.dateHistory);
        if(!st.intraday) st.intraday=[];
        else if(!Array.isArray(st.intraday)) st.intraday=Object.values(st.intraday);
      });
      if(state.todayNews?.items&&!Array.isArray(state.todayNews.items))
        state.todayNews.items=Object.values(state.todayNews.items);
      if(state.news&&!Array.isArray(state.news)) state.news=Object.values(state.news);
      if(!state.news) state.news=[];
      if(state.pd&&!Array.isArray(state.pd)) state.pd=Object.values(state.pd);
      // txLog: SHARED_KEYS에서 제외됐으므로 remote에 없을 수 있음, 있으면 정규화만
      if(state.txLog&&!Array.isArray(state.txLog)) state.txLog=Object.values(state.txLog).sort((a,b)=>(b.ts||'').localeCompare(a.ts||'')).slice(0,500);
      if(!state.txLog) state.txLog=[];
      if(state.news) state.news=state.news.filter(n=>!isCorrupted(n.t));
      if(state.todayNews?.items?.some(n=>isCorrupted(n.t))) delete state.todayNews;

      // students 전체도 병합 (초기 로딩 or 교사용)
      // 학생 로그인 후에는 students 전체 수신 안 함 (자기 경로만 별도 구독)
      if(remote.students && (!cu || cu.type==='teacher')){
        Object.entries(remote.students).forEach(([name,st])=>{
          if(!state.students[name]) state.students[name]={};
          Object.assign(state.students[name], st);
          processStudentData(name, state.students[name]);
        });
      }
      STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
        if(!state.students[s.name])
          state.students[s.name]={bal:START_BALANCE,hld:{semi:0,food:0,ent:0},deps:[],dep0:0,cb:{semi:0,food:0,ent:0}};
        processStudentData(s.name, state.students[s.name]);
      });

      // Re-render current tab
      if(cu && cTab){
        try{
          const el=document.getElementById('tab-'+cTab);
          if(el&&el.classList.contains('active')){
            if(cTab==='invest'){
              const sub=document.getElementById('investSubContent');
              if(sub){
                switch(investSubTab){
                  case'market':rMarket(sub);break;case'company':rCompany(sub);break;
                  case'trade':if(cu.type!=='teacher'){
                    const savedT={};const fIdT=document.activeElement?.id;const ssT=document.activeElement?.selectionStart;
                    sub.querySelectorAll('input').forEach(inp=>{ if(inp.id) savedT[inp.id]=inp.value; });
                    rTrade(sub);
                    Object.entries(savedT).forEach(([id,val])=>{ const inp=document.getElementById(id); if(inp) inp.value=val; });
                    if(fIdT){ const f=document.getElementById(fIdT); if(f){ f.focus(); try{if(ssT!=null)f.setSelectionRange(ssT,ssT);}catch(e){} } }
                  }break;
                  case'deposit':if(cu.type!=='teacher'){
                    const savedD={};const fIdD=document.activeElement?.id;const ssD=document.activeElement?.selectionStart;
                    sub.querySelectorAll('input,select').forEach(inp=>{ if(inp.id) savedD[inp.id]=inp.value; });
                    rDeposit(sub);
                    Object.entries(savedD).forEach(([id,val])=>{ const inp=document.getElementById(id); if(inp) inp.value=val; });
                    if(fIdD){ const f=document.getElementById(fIdD); if(f){ f.focus(); try{if(ssD!=null)f.setSelectionRange(ssD,ssD);}catch(e){} } }
                  }break;
                }
              }
            } else {
              const saved={};
              const focusedId=document.activeElement?.id;
              const selStart=document.activeElement?.selectionStart;
              const selEnd=document.activeElement?.selectionEnd;
              el.querySelectorAll('input,textarea,select').forEach(inp=>{ if(inp.id) saved[inp.id]={val:inp.value}; });
              renderTab(cTab,el);
              Object.entries(saved).forEach(([id,{val}])=>{ const inp=document.getElementById(id); if(inp&&inp.value!==val) inp.value=val; });
              if(focusedId){ const f=document.getElementById(focusedId); if(f){ f.focus(); try{if(selStart!=null)f.setSelectionRange(selStart,selEnd??selStart);}catch(e){} } }
            }
          }
        }catch(e){console.warn('Tab rerender error:',e.message);}
      }
      document.getElementById('weekendBanner').style.display=isWE()?'block':'none';
      if(cu&&cu.type==='student') updateTopbarLabel();
      // timerMinutes 변경 시 타이머 재시작 (교사가 변경하면 즉시 반영)
      if(cu&&cu.type==='student'&&remote.timerMinutes&&remote.timerMinutes!==state._prevTimerMinutes){
        state._prevTimerMinutes=remote.timerMinutes;
        if(state.timerEnabled!==false) startSessionTimer();
      }
      // 공지 팝업 — 학생에게만, 아직 안 읽은 공지면 표시
      if(cu&&cu.type==='student'&&remote.globalNotice){
        showGlobalNoticeIfNew(remote.globalNotice);
      }
    });

    // Hide loading, show login
    document.getElementById('loadingScreen').style.display='none';
    // 로그인 버튼 활성화 + 이모지 포함해서 그리드 재렌더
    document.querySelectorAll('#loginScreen button').forEach(b=>b.disabled=false);
    populateStudentSelect();

    // 세션 자동 복원 (새로고침 시 재로그인 불필요)
    let restored=false;
    try{
      const saved=sessionStorage.getItem('daize-session');
      if(saved){
        const sess=JSON.parse(saved);
        if(sess.type==='teacher'){
          cu={type:'teacher',name:'임아현',isCashier:false,isTest:!!sess.isTest};
          restored=true;
        } else if(sess.type==='student'&&sess.name){
          const name=sess.name;
          if(sess.isTest){
            cu={type:'student',name,
              isCashier:name===state.cashierName,
              isPolice:(state.police||[]).includes(name),
              isVice:(state.viceTeachers||[]).includes(name),
              isTest:true
            };
            subscribeOwnStudent(name);
            restored=true;
          } else if(state.passwords&&state.passwords[name]){
            // 비밀번호가 존재하고, 타이머 초과 아닌 경우에만 복원 (테스트 계정은 제외)
            if(state.timerEnabled===false||TEST_ACCOUNTS.includes(name)||!isBlockedToday(name)){
              cu={type:'student',name,
                isCashier:name===state.cashierName,
                isPolice:(state.police||[]).includes(name),
                isVice:(state.viceTeachers||[]).includes(name)
              };
              // 학생 자기 경로만 구독 (전체 students 수신 중단)
              subscribeOwnStudent(name);
              restored=true;
            } else {
              sessionStorage.removeItem('daize-session');
            }
          } else {
            sessionStorage.removeItem('daize-session');
          }
        }
      }
    }catch(e){}

    if(restored){
      openApp();
      showToast('✅ 자동 로그인 완료!');
    } else {
      document.getElementById('loginScreen').style.display='flex';
      showToast('✅ 서버 연결 완료!');
    }
    // 다크모드 버튼 아이콘 초기화
    const dtBtn=document.getElementById('darkToggle');
    if(dtBtn) dtBtn.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
  } catch(e){
    document.getElementById('loadingMsg').textContent='연결 실패: '+e.message+' — 새로고침 해주세요.';
    console.error(e);
  }
}
boot();

// ── 시장 시간 헬퍼
// 8:00 — 오늘의 뉴스 3건 발행
// 9:00, 11:00, 12:50, 14:00 — 시세 변동 (뉴스 영향 + 랜덤 무빙) 4회
// 14:00 — 최종 종가 확정
// 거래 가능 시간: 평일 8:40~14:00

function isMarketOpen(){
  if(isWE()) return false;
  const now=kst();
  const h=now.getHours(), m=now.getMinutes();
  const mins=h*60+m;
  return mins>=8*60+40 && mins<14*60;
}

function getMarketUpdateKey(now){
  const h=now.getHours();
  const dateStr=now.toDateString();
  if(h>=8&&h<9) return `${dateStr}-0800`; // 뉴스 발행 (하루 1건)
  if(h>=9)      return `${dateStr}-0900`; // 시세 반영 · 종가 확정 (하루 1회)
  return null;
}
function marketHistoryPathKey(hourKey){
  return String(hourKey||'').replace(/[^0-9A-Za-z가-힣_-]/g,'_');
}

function getStudentDefaults(){
  return {bal:START_BALANCE,hld:{semi:0,food:0,ent:0},deps:[],dep0:0,cb:{semi:0,food:0,ent:0},iconSpent:0,iconMap:{},freeIconCoupons:0};
}

function ensureStudentShape(st){
  const base=getStudentDefaults();
  const merged={...base,...(st||{})};
  merged.hld={...base.hld,...(merged.hld||{})};
  merged.cb={...base.cb,...(merged.cb||{})};
  if(merged.deps&&!Array.isArray(merged.deps)) merged.deps=Object.values(merged.deps);
  if(!merged.deps) merged.deps=[];
  if(merged.iconCollection){
    const arr=Array.isArray(merged.iconCollection)?merged.iconCollection:Object.values(merged.iconCollection);
    merged.iconMap={...(merged.iconMap||{})};
    arr.forEach(e=>{ if(e) merged.iconMap[e]=true; });
    delete merged.iconCollection;
  }
  if(!merged.iconMap) merged.iconMap={};
  return merged;
}

async function claimMarketWindow(hourKey){
  const claimKey=marketHistoryPathKey(hourKey);
  const lockRef=ref(db,ROOT+'/marketHistory/'+claimKey);
  const result=await runTransaction(lockRef,(current)=>{
    if(current){
      if(current.doneAt) return;
      const age=Date.now()-new Date(current.claimedAt||0).getTime();
      if(age<3*60*1000) return;
    }
    return {hourKey, claimedAt:new Date().toISOString()};
  });
  return !!result.committed;
}

function marketStatus(){
  if(state?.marketPaused) return '교사 일시정지 중';
  if(isWE()) return '주말 휴장';
  const now=kst();
  const h=now.getHours(),m=now.getMinutes();
  const mins=h*60+m;
  if(mins<8*60) return '오늘의 뉴스 발행 전 (8:00)';
  if(mins<9*60){
    const hasNews=(state.todayNews&&state.todayNews.date===now.toDateString());
    return hasNews?'📰 오늘의 뉴스 공개 · 9:00 시세 반영':'뉴스 발행 중...';
  }
  return '🔔 오늘 시세 반영 완료 · 다음 변동은 내일 9:00';
}

async function runMarket(){
  if(!state) return;
  if(state.marketPaused) return;
  if(!cu || cu.type!=='teacher') return;

  const now=kst();
  const dateStr=now.toDateString();

  // 주말 수익은 출석체크 방식으로 학생이 직접 수령 (lastWeekendPaid 체크 불필요)

  if(isWE()) return;

  const hourKey=getMarketUpdateKey(now);
  if(!hourKey) return;
  const historyKey=marketHistoryPathKey(hourKey);
  if(state.lastHour===hourKey) return;
  if(state.marketHistory && state.marketHistory[historyKey]?.doneAt) return;

  const claimed=await claimMarketWindow(hourKey);
  if(!claimed) return;

  const isNews=hourKey.endsWith('-0800');
  const isFinal=hourKey.endsWith('-0900'); // 하루 1회 시세 반영이 곧 종가
  const isFirstToday=(state.lastMD!==dateStr);
  state.lastHour=hourKey;

  // ── 8:00: 오늘의 뉴스 발행
  if(isNews){
    // 하루 한 건만 발행 — 교사 이슈가 있으면 우선, 없으면 랜덤 종목의 랜덤 뉴스
    let pickSid=null, ni=null;
    if(state.teacherIssues&&state.teacherIssues.length>0){
      const issue=state.teacherIssues.find(i=>!i.used);
      if(issue){pickSid=issue.sid;ni={t:issue.text,p:issue.p};issue.used=true;}
    }
    if(!ni){
      pickSid=STOCKS[Math.floor(Math.random()*STOCKS.length)].id;
      const pool=NP[pickSid];
      ni=pool[Math.floor(Math.random()*pool.length)];
    }
    const todayNews=[{sid:pickSid,t:ni.t,p:ni.p}];
    state.news.unshift({
      sid:pickSid,t:ni.t,p:ni.p,
      date:dStr(),price:state.stocks[pickSid].price,prev:state.stocks[pickSid].price,
      chg:'0.00',time:'8:00',isBreaking:true
    });
    state.todayNews={date:dateStr,items:todayNews};
    if(state.teacherIssues) state.teacherIssues=state.teacherIssues.filter(i=>!i.used);
    if(state.news.length>100) state.news=state.news.slice(0,100);
    const newsUpd={todayNews:state.todayNews,news:state.news,lastHour:state.lastHour,teacherIssues:state.teacherIssues||null,marketRunLock:hourKey};
    newsUpd['marketHistory/'+historyKey]={hourKey,type:'news',doneAt:new Date().toISOString()};
    update(ref(db,ROOT),newsUpd).catch(()=>{});
    return;
  }

  if(isFinal){ state.lastMD=dateStr; state.dayCount++; }

  if(isFirstToday||!state.stocks[STOCKS[0].id].todayOpen?.[dateStr]){
    STOCKS.forEach(s=>{
      if(!state.stocks[s.id].todayOpen) state.stocks[s.id].todayOpen={};
      state.stocks[s.id].todayOpen[dateStr]=state.stocks[s.id].price;
    });
  }

  const big=isFinal&&(state.dayCount%22===0);
  const modeMap={
    normal:{max:0.015,bias:0},
    bull:  {max:0.02, bias:0.004},
    bear:  {max:0.02, bias:-0.004},
    flat:  {max:0.005,bias:0},
    surge: {max:0.06, bias:0.03},
    crash: {max:0.07, bias:-0.04},
  };
  const globalMode=modeMap[state.marketMode||'normal']||modeMap.normal;
  const scale=1; // 하루 1회 변동
  const todayNewsItems=(state.todayNews&&state.todayNews.date===dateStr)?state.todayNews.items:[];
  const timeStr='9:00';

  STOCKS.forEach(s=>{
    const stk=state.stocks[s.id];
    const stockModeKey=(state.stockMode||{})[s.id]||'normal';
    const stockMode=modeMap[stockModeKey]||modeMap.normal;
    const baseMode=stockModeKey==='normal'?globalMode:stockMode;
    const m=big?{max:0.08*scale,bias:baseMode.bias*1.5}:{max:baseMode.max*scale,bias:baseMode.bias*scale};

    // ── 실제 주가 모델: 추세 지속 + 변동성 군집 + 점프 + 완만한 평균회귀 ──
    const personality={semi:1.5,food:0.6,ent:1.0}[s.id]||1.0;
    if(stk.trend===undefined) stk.trend=0;
    if(stk.vol===undefined)   stk.vol=1;
    if(stk.fair===undefined)  stk.fair=stk.price;
    const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;

    let c;
    if(stockModeKey==='surge'||stockModeKey==='crash'||(stockModeKey==='normal'&&(state.marketMode==='surge'||state.marketMode==='crash'))){
      c=(Math.random()*m.max*2-m.max)+m.bias;
    }else{
      const noise=gauss()*0.012*personality*stk.vol;
      const momentum=stk.trend;
      const reversion=(stk.fair/stk.price-1)*0.04;
      let jump=0;
      if(Math.random()<0.05) jump=(Math.random()<0.5?-1:1)*(0.02+Math.random()*0.04);
      c=(noise+momentum+reversion+jump)*scale + m.bias;
      c=Math.max(-0.15,Math.min(0.15,c));
    }
    const todayNI=todayNewsItems.find(n=>n.sid===s.id);
    if(todayNI){
      const newsApplied=Math.random()<0.8;
      if(newsApplied){
        const newsInfluence=0.25+Math.random()*0.25;
        if(todayNI.p) c=c*(1-newsInfluence)+Math.abs(c)*newsInfluence;
        else          c=c*(1-newsInfluence)-Math.abs(c)*newsInfluence;
      }
    }

    const prev=stk.price;
    const np=Math.max(1,parseFloat((prev*(1+c)).toFixed(2)));
    stk.price=np;

    if(isFinal){
      stk.trend=parseFloat((stk.trend*0.85+c*0.15+gauss()*0.002).toFixed(5));
      stk.trend=Math.max(-0.02,Math.min(0.02,stk.trend));
      stk.vol=parseFloat(Math.max(0.5,Math.min(2.5,stk.vol*0.9+Math.random()*0.35+0.05)).toFixed(3));
      stk.fair=parseFloat((stk.fair*(1+(Math.random()-0.47)*0.005)).toFixed(2));
      stk.history.push(np);
      if(stk.history.length>61) stk.history.shift();
      if(!stk.dateHistory) stk.dateHistory=[];
      stk.dateHistory.push((now.getMonth()+1)+'/'+now.getDate());
      if(stk.dateHistory.length>61) stk.dateHistory.shift();
      stk.intraday=[];
    }
  });

  if(state.news.length>100) state.news=state.news.slice(0,100);

  // ── isFinal: 예금 만기 자동 지급 — runTransaction으로 서버 최신값 기준 처리 (캐시 덮어쓰기 방지)
  if(isFinal){
    const now2=kst();
    const allNames=STUDENTS.concat(state.extraStudents||[]).map(s=>s.name);
    for(const name of allNames){
      // 로컬 캐시로 빠른 스킵만 판단 (실제 계산은 트랜잭션 내부에서 서버 최신값 기준으로)
      const stLocal=state.students[name];
      if(!stLocal||!stLocal.deps||!stLocal.deps.length) continue;
      const hasMaturedLocal=stLocal.deps.some(d=>d&&!d.done&&!d.er&&new Date(d.md)<=now2);
      if(!hasMaturedLocal) continue;

      let totalRet=0;
      const txResult=await runTransaction(ref(db,ROOT+'/students/'+name),(cur)=>{
        if(!cur) return cur;
        let deps=cur.deps;
        if(deps&&!Array.isArray(deps)) deps=Object.values(deps);
        if(!deps||!deps.length) return; // abort — 변경 없음
        let changed=false;
        deps.forEach(d=>{
          if(d&&!d.done&&!d.er&&new Date(d.md)<=now2){
            const int=Math.round(d.amt*d.rate*d.mon);
            const tax=Math.round(int*0.01);
            const ret=d.amt+int-tax;
            d.done=true; d.ret=ret; d.tax=tax;
            totalRet+=ret;
            changed=true;
          }
        });
        if(!changed) return; // abort — 서버에는 이미 만기 아님(동시 처리됨)
        cur.deps=deps;
        cur.bal=parseFloat(((cur.bal||0)+totalRet).toFixed(2));
        return cur;
      }).catch(()=>({committed:false}));

      if(txResult.committed){
        state.students[name]=ensureReturnFields(ensureStudentShape(txResult.snapshot.val()));
        if(totalRet>0) addTxLog('deposit',name,totalRet,'시스템','예금 만기 자동 지급 (세후)');
      }
    }
  }

  const marketUpd={stocks:state.stocks,news:state.news,lastHour:state.lastHour,lastMD:state.lastMD??null,dayCount:state.dayCount??0,marketRunLock:hourKey};
  marketUpd['marketHistory/'+historyKey]={hourKey,type:isFinal?'close':'intraday',doneAt:new Date().toISOString()};
  update(ref(db,ROOT),marketUpd).catch(()=>{});
}

// 🏬 백화점 자동 처리 — 주간 정산 + 월세 (접속자 누구나 트리거, 잠금 트랜잭션으로 중복 방지)

function deptWeekKey(d){
  // ISO 주차 근사: 그 주 월요일 날짜를 키로 사용
  const t=new Date(d);
  const day=t.getDay();
  t.setDate(t.getDate()-(day===0?6:day-1));
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
async function runDeptAuto(){
  if(!state||!cu) return;
  if(!state.dept?.stores) return;
  const now=kst();
  if(isWE()) return;
  if(now.getDay()!==1) return; // 입점 수수료·세금 정산은 매주 월요일에만 진행

  const wk=deptWeekKey(now);
  const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const lockRef=ref(db,ROOT+'/dept/settleLock/'+wk);
  const claim=await runTransaction(lockRef,(cur)=>{
    if(cur) return;
    return {at:new Date().toISOString(),by:cu.name};
  }).catch(()=>({committed:false}));
  if(!claim.committed) return;

  const stores=state.dept.stores||{};
  for(const slotId of Object.keys(stores)){
    const st=stores[slotId];
    if(!st) continue;
    if(st.lastSettleWeek===wk) continue; // 이번 주 이미 처리됨
    const members=[st.ceo,...(st.partners||[])];
    const n=members.length;
    if(n<1) continue;

    // ── ① 입점 수수료 (월 1회, 위치 등급별 차등: 탑층60/중층40/바닥층30) ──
    // 사업체 계좌 우선 차감 → 부족분은 동업자가 1/n씩 분담
    if(st.rentPaidMonth!==ym){
      const fee=deptFeeForSlot(slotId);
      let need=fee;
      let bal=st.balance||0;
      const fromStore=Math.min(bal,need);
      if(fromStore>0){
        bal=parseFloat((bal-fromStore).toFixed(2));
        need=parseFloat((need-fromStore).toFixed(2));
      }
      let unpaid=0;
      if(need>0){
        const each=parseFloat((need/n).toFixed(2));
        for(const m of members){
          const mRef=ref(db,ROOT+'/students/'+m);
          const tx=await runTransaction(mRef,(cur)=>{
            if(!cur) return cur;
            if((cur.bal||0)<each) return; // 잔액 부족 — abort
            cur.bal=parseFloat(((cur.bal||0)-each).toFixed(2));
            return cur;
          }).catch(()=>({committed:false}));
          if(tx.committed){
            if(state.students[m]) state.students[m].bal=tx.snapshot.val()?.bal??state.students[m].bal;
            addTxLog('withdraw',m,each,'시스템',st.name+' 입점 수수료 분담 (1/'+n+')');
          } else {
            unpaid=parseFloat((unpaid+each).toFixed(2));
          }
        }
      }
      const overdue=unpaid>0?((st.rentOverdue||0)+1):0;
      st.balance=bal; st.rentPaidMonth=ym; st.rentOverdue=overdue;
      update(ref(db,ROOT+'/dept/stores/'+slotId),{balance:bal,rentPaidMonth:ym,rentOverdue:overdue}).catch(()=>{});
      const feeMemo=unpaid>0
        ? (st.name+' 입점 수수료 미납 '+fE(unpaid)+' 발생 (연체 '+overdue+'개월)')
        : (st.name+' 입점 수수료 '+fE(fee)+' 납부 완료 ('+deptTierLabel(deptFloorTier(slotId))+')');
      members.forEach((m,i)=>{
        const _ts=Date.now();
        const nid='noti'+(_ts+i)+'a';
        update(ref(db,ROOT+'/notifications/'+m+'/'+nid),{id:nid,type:unpaid>0?'withdraw':'deposit',amt:0,memo:feeMemo,from:'시스템',date:dStr(),ts:new Date().toISOString(),read:false}).catch(()=>{});
      });
    }

    // ── ② 사업소득세 20% 원천징수 후 주간 수익 분배 (수수료 차감 후 잔액 기준) ──
    const bal=st.balance||0;
    if(bal<DEPT_MIN_PAYOUT){
      st.lastSettleWeek=wk;
      update(ref(db,ROOT+'/dept/stores/'+slotId),{lastSettleWeek:wk}).catch(()=>{});
      continue;
    }
    const tax=Math.round(bal*DEPT_TAX_RATE);
    const afterTax=parseFloat((bal-tax).toFixed(2));
    const share=Math.floor(afterTax/n);          // 총액 보존: floor 분배
    const remain=parseFloat((afterTax-share*n).toFixed(2)); // 나머지는 다음 주 이월
    for(let i=0;i<members.length;i++){
      const m=members[i];
      const mRef=ref(db,ROOT+'/students/'+m);
      await runTransaction(mRef,(cur)=>{
        if(!cur) return cur;
        cur.bal=parseFloat(((cur.bal||0)+share).toFixed(2));
        return cur;
      }).catch(()=>{});
      if(state.students[m]) state.students[m].bal=parseFloat(((state.students[m].bal||0)+share).toFixed(2));
      addTxLog('deposit',m,share,'시스템',st.name+' 주간 수익 분배 (세후, 1/'+n+')');
      const _ts=Date.now();
      const nid='noti'+(_ts+i)+'b';
      const memo=st.name+' 매출 '+fE(bal)+' → 세금 '+fE(tax)+'(20%) 차감 후 '+fE(share)+' 입금됐습니다!';
      update(ref(db,ROOT+'/notifications/'+m+'/'+nid),{id:nid,type:'deposit',amt:share,memo,from:'시스템',date:dStr(),ts:new Date().toISOString(),read:false}).catch(()=>{});
    }
    st.balance=remain; st.lastSettleWeek=wk;
    update(ref(db,ROOT+'/dept/stores/'+slotId),{balance:remain,lastSettleWeek:wk}).catch(()=>{});
  }
}
