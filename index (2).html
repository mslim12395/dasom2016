// ── 접속 타이머 (학생 전용, 하루 N분)
let sessionTimer=null,sessionLeft=0;

function getTodayKey(){
  const d=kst();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getSessionLimit(){ return ((state&&state.timerMinutes)||15)*60; }

function getUsedSeconds(name){
  return (state?.students?.[name]?.usedTime?.[getTodayKey()])||0;
}
async function saveUsedSeconds(name,secs){
  const st=state?.students?.[name];
  if(!st) return;
  if(!st.usedTime) st.usedTime={};
  const today=getTodayKey();
  st.usedTime[today]=secs;
  // usedTime만 직접 경로에 저장 (set으로 해당 날짜 키만)
  try{
    await set(ref(db,ROOT+`/students/${name}/usedTime/${today}`),secs);
  }catch(e){}
}
async function getUsedSecondsFromDB(name){
  // 로그인 시 Firebase에서 직접 읽어 정확한 값 사용
  try{
    const today=getTodayKey();
    const snap=await get(ref(db,ROOT+`/students/${name}/usedTime/${today}`));
    return snap.exists()?parseInt(snap.val()||0):0;
  }catch(e){ return getUsedSeconds(name); }
}
function isBlockedToday(name){
  // state에 저장된 값으로 체크 (로그인 시점에 최신값이 state에 반영되어 있음)
  const used=getUsedSeconds(name);
  const limit=getSessionLimit();
  return used>=limit;
}

async function startSessionTimer(){
  try{
  if(sessionTimer){ clearInterval(sessionTimer); sessionTimer=null; }
  if(!cu||cu.type==='teacher') return;
  if(cu.isCashier||cu.isPolice||TEST_ACCOUNTS.includes(cu.name)){
    const d=document.getElementById('timerDisp'); if(d) d.style.display='none'; return;
  }
  if(state&&state.timerEnabled===false){
    const d=document.getElementById('timerDisp'); if(d) d.style.display='none'; return;
  }
  const limit=getSessionLimit();
  let usedFromDB=0;
  try{ usedFromDB=await getUsedSecondsFromDB(cu.name); }catch(e){ usedFromDB=getUsedSeconds(cu.name); }
  if(state?.students?.[cu.name]){
    if(!state.students[cu.name].usedTime) state.students[cu.name].usedTime={};
    state.students[cu.name].usedTime[getTodayKey()]=usedFromDB;
  }
  sessionLeft=Math.max(0,limit-usedFromDB);
  const d=document.getElementById('timerDisp'); if(d) d.style.display='';
  if(sessionLeft<=0){ forceLogoutByTimer(); return; }
  updateTimerDisplay();
  let timerTick=0;
  sessionTimer=setInterval(()=>{
    sessionLeft=Math.max(0,sessionLeft-1);
    timerTick++;
    // Firebase에는 60초마다만 저장 (매초 저장 → 트래픽 60배 절감)
    if(timerTick%60===0 || sessionLeft<=0){
      saveUsedSeconds(cu.name,getSessionLimit()-sessionLeft);
    }
    // 로컬 state에는 매초 반영
    if(state?.students?.[cu.name]){
      if(!state.students[cu.name].usedTime) state.students[cu.name].usedTime={};
      state.students[cu.name].usedTime[getTodayKey()]=getSessionLimit()-sessionLeft;
    }
    updateTimerDisplay();
    if(sessionLeft<=0){ clearInterval(sessionTimer); sessionTimer=null; forceLogoutByTimer(); }
  },1000);
  }catch(e){console.warn('Timer error:',e);}
}

function updateTimerDisplay(){
  const d=document.getElementById('timerDisp');
  if(!d) return;
  if(!cu||cu.type==='teacher'||state?.timerEnabled===false){d.style.display='none';return;}
  const m=Math.floor(sessionLeft/60),s=sessionLeft%60;
  d.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  d.style.display='';
  d.style.background=sessionLeft<120?'#fee2e2':sessionLeft<300?'#fef3c7':'#d1fae5';
  d.style.color=sessionLeft<120?'#991b1b':sessionLeft<300?'#92400e':'#065f46';
}

function forceLogoutByTimer(){
  if(sessionTimer){ clearInterval(sessionTimer); sessionTimer=null; }
  const name=cu?.name||'';
  const mins=(state?.timerMinutes)||15;
  // 오늘 재로그인 차단 — limit+1 저장
  if(name) saveUsedSeconds(name, getSessionLimit()+1);
  // 즉시 강제 로그아웃
  doLogout();
  showToast(`⏱ ${name} 오늘 접속 시간(${mins}분) 종료. 내일 다시 접속하세요.`);
}

// Cost basis
function updateCB(ctxOrName,nameOrSid,sidOrQty,priceOrQty,buyOrPrice,maybeBuy){
  const useState=typeof ctxOrName==='string'?state:ctxOrName;
  const name=typeof ctxOrName==='string'?ctxOrName:nameOrSid;
  const sid=typeof ctxOrName==='string'?nameOrSid:sidOrQty;
  const qty=typeof ctxOrName==='string'?sidOrQty:priceOrQty;
  const price=typeof ctxOrName==='string'?priceOrQty:buyOrPrice;
  const buy=typeof ctxOrName==='string'?buyOrPrice:maybeBuy;
  const st=useState.students[name];
  if(!st.cb) st.cb={semi:0,food:0,ent:0};
  if(buy){
    const cq=st.hld[sid]||0,cc=st.cb[sid]||0;
    st.cb[sid]=cq+qty>0?(cc*cq+price*qty)/(cq+qty):0;
  } else {
    if((st.hld[sid]||0)-qty<=0) st.cb[sid]=0;
  }
}

let _champCats=[]; let _champIdx=0;
function renderChampShowcase(){
  const box=document.getElementById('champShowcase');
  if(!box||!state||!state.students) return;
  const now=kst();
  const thisMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const list=(typeof realStudents==='function')?realStudents():[];
  if(!list.length){box.innerHTML='';return;}
  const rows=list.map(s=>{
    const st=state.students[s.name]||{};
    const p=(typeof calcP==='function')?calcP(s.name):{total:0,tpnl:0};
    const logs=(state.donationLog||[]).filter(d=>d.name===s.name);
    const donMonthly=logs.filter(d=>d.ts&&d.ts.startsWith(thisMonth)).reduce((a,d)=>a+(d.amount||0),0);
    const depTotal=(st.deps||[]).filter(d=>!d.done&&!d.er).reduce((a,d)=>a+(d.amt||0),0);
    let reAsset=0;
    Object.entries(state.realestate?.plots||{}).forEach(([pid,pl])=>{ if(pl&&pl.owner===s.name) reAsset+=rePlotBuyPrice(pl,pid); });
    const iconCount=Object.keys(st.iconMap||{}).length;
    return {name:s.name,total:p.total||0,tpnl:p.tpnl||0,donMonthly,depTotal,reAsset,iconCount};
  });
  const fmt=n=>(typeof fE==='function')?fE(n):Math.round(n)+' 조개';
  const cats=[
    {label:'재산왕',trophy:'💰',key:'total',fmt:r=>fmt(r.total)},
    {label:'수익왕',trophy:'📈',key:'tpnl',fmt:r=>(r.tpnl>=0?'+':'')+fmt(r.tpnl),min:r=>r.tpnl>0},
    {label:'기부왕',trophy:'🌳',key:'donMonthly',fmt:r=>fmt(r.donMonthly),min:r=>r.donMonthly>0},
    {label:'부동산왕',trophy:'🏰',key:'reAsset',fmt:r=>fmt(r.reAsset),min:r=>r.reAsset>0},
    {label:'저축왕',trophy:'🏦',key:'depTotal',fmt:r=>fmt(r.depTotal),min:r=>r.depTotal>0},
    {label:'수집왕',trophy:'🎨',key:'iconCount',fmt:r=>r.iconCount+'개',min:r=>r.iconCount>0},
  ];
  // 유효 분야 + 상위 3명 계산
  _champCats=cats.map(c=>{
    const pool=c.min?rows.filter(c.min):rows;
    if(!pool.length) return null;
    const sorted=[...pool].sort((a,b)=>b[c.key]-a[c.key]).slice(0,3);
    if(!sorted.length||(c.min&&!c.min(sorted[0]))) return null;
    return {...c,top3:sorted};
  }).filter(Boolean);
  if(!_champCats.length){box.innerHTML='';return;}
  // 최초 1회 랜덤, 이후엔 선택 유지
  if(_champIdx>=_champCats.length) _champIdx=0;
  if(box.dataset.init!=='1'){ _champIdx=Math.floor(Math.random()*_champCats.length); box.dataset.init='1'; }
  drawChampCard();
}

    }
  });

// ════════════ 비밀번호 해시 (v6.6) ════════════
// 평문 비밀번호를 소스코드/DB에 남기지 않기 위해 SHA-256 해시로 저장·비교한다.
// 구버전 평문 비밀번호는 로그인 성공 시 자동으로 해시로 전환된다.
function _sha256(ascii){
  function rightRotate(v,a){return(v>>>a)|(v<<(32-a));}
  const mathPow=Math.pow,maxWord=mathPow(2,32);
  let result='';
  const words=[],asciiBitLength=ascii.length*8;
  let hash=_sha256.h=_sha256.h||[],k=_sha256.k=_sha256.k||[];
  let primeCounter=k.length;
  const isComposite={};
  for(let candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(let i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(let i=0;i<ascii.length;i++){
    const j=ascii.charCodeAt(i);
    if(j>>8)return null; // utf8 인코딩 필요 — 호출부에서 처리
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16),oldHash=hash.slice(0,8);
    hash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2];
      const a=hash[0],e=hash[4];
      const temp1=hash[7]
        +(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))
        +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]
          +(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))
          +w[i-7]
          +(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      const temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))
        +((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(let i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(let i=0;i<8;i++)
    for(let j=3;j+1;j--){
      const b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:'')+b.toString(16);
    }
  return result;
}
function hashPw(pw){
  // 한글 등 멀티바이트 안전 처리: UTF-8 percent-encoding → 바이트 문자열
  const bytes=unescape(encodeURIComponent('daize::'+pw));
  return _sha256(bytes);
}
function looksHashed(v){return typeof v==='string'&&/^[0-9a-f]{64}$/.test(v);}
function pwMatch(stored,pw){
  if(stored==null||stored==='') return false;
  if(looksHashed(stored)) return hashPw(pw)===stored;
  return stored===pw; // 구버전 평문
}

// 테스트용 마스터 비밀번호 — 학생·교사 공용, 실제 저장된 비밀번호와 무관하게 통과
// 접속시간 차감/해시 마이그레이션 없이 즉시 로그인 (헤드리스 테스트 하네스 및 교사 사전 점검용)
const TEST_PASS='daize!test';

        isCashier:name===state.cashierName,
        isPolice:(state.police||[]).includes(name),
        isVice:(state.viceTeachers||[]).includes(name),
        isTest:true
      };
      try{sessionStorage.setItem('daize-session',JSON.stringify({type:'student',name,isTest:true}));}catch(e){}
      subscribeOwnStudent(name);
      openApp();
      return;
    }
    if(!state.passwords||!state.passwords[name]){showToast('비밀번호가 설정되지 않았습니다.');return;}
    if(!pwMatch(state.passwords[name],pw)){showToast('비밀번호가 틀렸습니다.');return;}
    // 구버전 평문 → 해시 자동 전환
    if(!looksHashed(state.passwords[name])){
      state.passwords[name]=hashPw(pw);
      update(ref(db,ROOT+'/passwords'),{[name]:state.passwords[name]}).catch(()=>{});
    }
    // 오늘 접속 시간 초과 학생 차단 (테스트 계정은 제외)
    if(state.timerEnabled!==false && !TEST_ACCOUNTS.includes(name) && isBlockedToday(name)){
      const mins=state.timerMinutes||15;
      showToast(`⏱ ${name} 오늘 접속 시간(${mins}분)이 모두 사용됐습니다. 내일 다시 접속하세요.`);
      return;
    }
    cu={type:'student',name,
      isCashier:name===state.cashierName,
      isPolice:(state.police||[]).includes(name),
      isVice:(state.viceTeachers||[]).includes(name)
    };
    try{sessionStorage.setItem('daize-session',JSON.stringify({type:'student',name}));}catch(e){}
    // 학생 자기 데이터만 별도 구독 시작 (전체 students 수신 중단)
    subscribeOwnStudent(name);
    openApp();
  }
}
// 비밀번호 검증: 4~12자리, 영문+숫자 모두 포함
function validatePw(pw){
  if(!pw||pw.length<4||pw.length>12) return false;
  const hasLetter=/[a-zA-Z가-힣]/.test(pw); // 영문 또는 한글 포함
  const hasNumber=/[0-9]/.test(pw);
  return hasLetter&&hasNumber;
}

  const pnlEl=document.getElementById('topbarTodayPnl');
  if(pnlEl&&state?.stocks&&state?.students?.[cu.name]){
    const st=state.students[cu.name];
    const todayDateStr=kst().toDateString();
    let todayPnl=0;
    STOCKS.forEach(s=>{
      const stk=state.stocks[s.id];
      const q=st.hld?.[s.id]||0;
      if(q>0&&stk){
        const cur=stk.price||0;
        // 기준가: 오늘 시가(todayOpen) → 없으면 직전 종가(history 마지막)

// 학생 알림 팝업 체크
async function checkStudentNotifications(){
  if(!cu||cu.type==='teacher') return;
  if(!window._processedNotifIds) window._processedNotifIds=new Set();
  try{
    const snap=await get(ref(db,ROOT+'/notifications/'+cu.name));
    if(!snap.exists()) return;
    const raw=snap.val();
    const notifs=Object.values(raw)
      .filter(n=>!n.read && !window._processedNotifIds.has(n.id))
      .sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
    if(!notifs.length) return;
    // 즉시 처리된 것으로 표시 (루프 방지)
    notifs.forEach(n=>window._processedNotifIds.add(n.id));
    // 읽음 처리
    const updates={};
    notifs.forEach(n=>{ updates[n.id+'/read']=true; });
    update(ref(db,ROOT+'/notifications/'+cu.name), updates).catch(()=>{});
    // 모아서 한 번에 팝업
    const body=notifs.map(n=>{
      const isD=n.type==='deposit';
      return `<div style="display:flex;align-items:center;gap:.65rem;padding:.55rem 0;border-bottom:1px solid var(--g200);">
        <span style="font-size:1.5rem;">${isD?'📥':'📤'}</span>
        <div style="flex:1;">
          <div style="font-size:.88rem;font-weight:700;color:${isD?'var(--suc)':'var(--dan)'};">${isD?'+':'-'}${fE(n.amt)}</div>
          ${n.memo?`<div style="font-size:.78rem;color:var(--g600);">${escHtml(n.memo)}</div>`:''}
          <div style="font-size:.72rem;color:var(--g500);">${n.date}</div>
        </div>
      </div>`;
    }).join('');
    openModal(`💰 입출금 알림 (${notifs.length}건)`,`
      <div style="margin-bottom:.4rem;font-size:.82rem;color:var(--g600);">선생님이 아래 내역을 처리했습니다.</div>
      ${body}
    `,[{l:'확인',c:'bp',f:closeModal}]);
  }catch(e){}
}

function switchTab(id){
  cTab=id;
  document.querySelectorAll('.nt').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.bt').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.tc').forEach(c=>c.classList.remove('active'));
  const el=document.getElementById('tab-'+id);
  if(el){
    el.classList.add('active');
    try{ renderTab(id,el); }
    catch(e){
      console.error(`[renderTab:${id}]`, e);
      el.innerHTML=`<div class="card"><div style="color:var(--dan);padding:1rem;">
        ⚠️ 탭 로드 오류: <code>${e.message}</code><br/>
        <button class="btn bs bsm" style="margin-top:.5rem;" onclick="switchTab('${id}')">🔄 다시 시도</button>
      </div></div>`;
    }
  }
}

// 복권 이모지 암호화 헬퍼 (base64 + 간단 XOR)
const _LK='\x64\x61\x69\x7a\x65'; // 'daize'
function _enc(arr){
  const s=JSON.stringify(arr);
  let x='';for(let i=0;i<s.length;i++)x+=String.fromCharCode(s.charCodeAt(i)^_LK.charCodeAt(i%_LK.length));
  const bytes=new TextEncoder().encode(x);
  let b='';bytes.forEach(b2=>b+=String.fromCharCode(b2));
  return btoa(b);
}
function _dec(str){
  try{
    const bin=atob(str);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const x=new TextDecoder().decode(bytes);
    let s='';for(let i=0;i<x.length;i++)s+=String.fromCharCode(x.charCodeAt(i)^_LK.charCodeAt(i%_LK.length));
    return JSON.parse(s);
  }catch(e){return['🍀','💎','🌟','🏆','🔮'];}
}
// 복권 이모지 읽기/쓰기
function getLotteryEmojis(){
  if(state._le) return _dec(state._le);
  if(state.lotteryEmojis) return state.lotteryEmojis; // 구버전 호환
  return _dec(''); // 기본값
}
function setLotteryEmojis(arr){
  state._le=_enc(arr);
  delete state.lotteryEmojis; // 평문 제거
}

// 이모지의 효과 조회 (구버전 문자열 = 테두리로 해석)
function getIconFx(st,e){
  const raw=st?.iconFx?.[e];
  if(!raw) return {};
  if(typeof raw==='string') return {b:raw};
  return raw;
}
function fxClasses(st,e){
  const fx=getIconFx(st,e);
  return [(fx.b&&EMOJI_FX[fx.b]?.cls)||'',(fx.a&&EMOJI_FX[fx.a]?.cls)||''].join(' ').trim();
}
// 카드 레벨 프레임 클래스 — b슬롯(테두리) 장착 시 로그인 카드 전체를 등급색으로 승격
function fxCardCls(st,e){
  const fx=getIconFx(st,e);
  return fx.b?('fxc-'+fx.b):'';
}
// 이름 기준: 장착 이모지에 효과가 귀속돼 있으면 감싸서 반환

  const em=stuEmoji(name);
  const st=state?.students?.[name];
  const cls=st?fxClasses(st,em):'';
  return cls?`<span class="fxw ${cls}" style="${sizeStyle||''}">${em}</span>`:em;
}

async function _doBuyEmojiFx(e,key){
  const fx=EMOJI_FX[key]; if(!fx) return;
  const st=state.students[cu.name];
  const cur=getIconFx(st,e);
  if(cur[fx.slot]===key){showToast('이미 장착된 효과입니다.');return;}
  if((st.bal||0)<fx.price){showToast(`잔액 부족 (필요: ${fx.price}조개)`);return;}
  st.bal=parseFloat((st.bal-fx.price).toFixed(2));
  st.iconSpent=(st.iconSpent||0)+fx.price;
  if(!st.iconFx) st.iconFx={};
  const next={...cur,[fx.slot]:key};
  st.iconFx[e]=next;
  st.iconFxList=Object.entries(st.iconFx).filter(([k,v])=>k&&v).map(([k,v])=>({e:k,...v}));
  addTxLog('withdraw',cu.name,fx.price,cu.name,`이모지 효과 구매 (${e} ${fx.name})`);
  await update(ref(db,ROOT+'/students/'+cu.name),{bal:st.bal,iconSpent:st.iconSpent,iconFxList:st.iconFxList}).catch(()=>{});
  showToast(`✨ ${e}에 ${fx.name} 장착 완료!`);
  playSound('emoji');
  closeModal();
  populateStudentSelect();updateTopbarLabel();switchTab('portfolio');
}

window.clearEmojiFx=async function(e,slot){
  const st=state.students[cu.name];
  const cur=getIconFx(st,e);
  if(!cur[slot]){showToast('끌 효과가 없습니다.');return;}
  const next={...cur};
  delete next[slot];
  if(!st.iconFx) st.iconFx={};
  if(Object.keys(next).length) st.iconFx[e]=next; else delete st.iconFx[e];
  st.iconFxList=Object.entries(st.iconFx).filter(([k,v])=>k&&v).map(([k,v])=>({e:k,...v}));
  await update(ref(db,ROOT+'/students/'+cu.name),{iconFxList:st.iconFxList}).catch(()=>{});
  showToast(`${slot==='b'?'테두리':'이펙트'}를 껐어요`);

};

function miniChart(history,isUp){
  const data=history.slice(-31);if(data.length<2)return'';
  const min=Math.min(...data),max=Math.max(...data);
  const w=300,h=50,rng=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/rng)*h}`).join(' ');
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;"><polyline points="${pts}" fill="none" stroke="${isUp?'#0e9f6e':'#e02424'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function exTrade(sid,action){
  if(isWE()){showToast('주말에는 거래가 불가능합니다. 📅');return;}
  const st=state.students[cu.name],stk=state.stocks[sid];
  const qty=parseInt(document.getElementById('q-'+sid)?.value||0);
  if(!qty||qty<=0){showToast('수량을 입력해주세요.');return;}
  const sn=STOCKS.find(s=>s.id===sid).name;
  const sEmoji=STOCKS.find(s=>s.id===sid).emoji;
  if(action==='buy'){
    const cost=parseFloat((qty*stk.price).toFixed(2));
    if(cost>st.bal){showToast('투자 가능 금액이 부족합니다!');return;}
    openModal(`${sEmoji} ${sn} 매수 확인`,`
      <div style="text-align:center;padding:.3rem 0;">
        <div style="font-size:2.5rem;margin-bottom:.4rem;">${sEmoji}</div>
        <div style="font-size:1rem;font-weight:700;margin-bottom:.2rem;">${sn} ${qty}주 매수</div>
        <div style="font-size:.85rem;color:var(--g600);margin-bottom:.6rem;">주당 ${fE2(stk.price)}</div>
        <div style="background:var(--g50);border-radius:10px;padding:.65rem;display:flex;justify-content:space-between;">
          <span class="tsm">결제 금액</span><span class="tsm fb tdan">${fE2(cost)}</span>
        </div>
        <div style="font-size:.75rem;color:var(--g500);margin-top:.4rem;">잔액: ${fE2(st.bal)} → ${fE2(st.bal-cost)}</div>
      </div>
    `,[
      {l:'매수 확정',c:'bsuc',f:()=>{
        closeModal();doExTrade(sid,'buy',qty);
      }},{l:'취소',c:'bs',f:closeModal}
    ]);
  } else {
    const held=st.hld[sid]||0;
    if(qty>held){showToast(`보유 주식 부족 (보유: ${held}주)`);return;}
    const fee=parseFloat((qty*(state.sellFee||1)).toFixed(2));
    const proc=parseFloat((qty*stk.price-fee).toFixed(2));
    if(proc<0){showToast('수수료가 매도금액보다 큽니다.');return;}
    openModal(`${sEmoji} ${sn} 매도 확인`,`
      <div style="text-align:center;padding:.3rem 0;">
        <div style="font-size:2.5rem;margin-bottom:.4rem;">${sEmoji}</div>
        <div style="font-size:1rem;font-weight:700;margin-bottom:.2rem;">${sn} ${qty}주 매도</div>
        <div style="font-size:.85rem;color:var(--g600);margin-bottom:.6rem;">주당 ${fE2(stk.price)}</div>
        <div style="background:var(--g50);border-radius:10px;padding:.65rem;">
          <div style="display:flex;justify-content:space-between;margin-bottom:.25rem;">
            <span class="txs">매도 금액</span><span class="txs fb">${fE2(qty*stk.price)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:.25rem;">
            <span class="txs">수수료</span><span class="txs tdan">-${fE2(fee)}</span>
          </div>
          <div style="border-top:1px solid var(--g200);padding-top:.25rem;display:flex;justify-content:space-between;">
            <span class="tsm fb">실수령</span><span class="tsm fb tsuc">${fE2(proc)}</span>
          </div>
        </div>
      </div>
    `,[
      {l:'매도 확정',c:'bdan',f:()=>{
        closeModal();doExTrade(sid,'sell',qty);
      }},{l:'취소',c:'bs',f:closeModal}
    ]);
  }
}
let tradeLockUntil=0;
function beginTradeLock(ms=1200){
  const now=Date.now();
  if(now<tradeLockUntil) return false;
  tradeLockUntil=now+ms;
  return true;
}
function clearTradeLock(){ tradeLockUntil=0; }

// 만기 예금 직접 출금 (runMarket 없이 학생이 직접 수령)
window.withdrawMaturedDep=async function(idx){
  const st=state.students[cu.name];
  const dep=st?.deps?.[idx];
  if(!dep||dep.done||dep.er){showToast('이미 처리된 예금입니다.');return;}
  if(new Date(dep.md)>kst()){showToast('아직 만기가 되지 않았습니다.');return;}
  const sd=dep.sd;
  let ret=0;
  try{
    const txResult=await runTransaction(ref(db,ROOT+'/students/'+cu.name),(cur)=>{
      if(!cur) return cur;
      let deps=cur.deps;
      if(deps&&!Array.isArray(deps)) deps=Object.values(deps);
      if(!deps) return; // abort
      const d2=deps.find(x=>x&&x.sd===sd&&!x.done&&!x.er);
      if(!d2) return; // abort — 이미 수령됨
      const int=Math.round(d2.amt*d2.rate*d2.mon);
      const tax=Math.round(int*0.01);
      ret=d2.amt+int-tax;
      d2.done=true; d2.ret=ret; d2.tax=tax;
      cur.deps=deps;
      cur.bal=parseFloat(((cur.bal||0)+ret).toFixed(2));
      return cur;
    });
    if(!txResult.committed){showToast('이미 처리된 예금입니다.');return;}
    state.students[cu.name]=ensureReturnFields(ensureStudentShape(txResult.snapshot.val()));
    addTxLog('deposit',cu.name,ret,'시스템','예금 만기 수령 ('+dep.mon+'개월, 세후)');
  }catch(e){console.error('withdrawMaturedDep error',e);showToast('처리 중 오류가 발생했습니다.');return;}
  showToast('💰 '+fE(ret)+' 출금 완료!');playSound('deposit');
  const depEl=document.getElementById('investSubContent')||document.getElementById('tab-deposit');
  if(depEl) rDeposit(depEl);
};

function openDep(){
  const st=state.students[cu.name];
  const amt=parseFloat(document.getElementById('dA').value),mon=parseInt(document.getElementById('dM').value);
  if(!amt||amt<=0){showToast('금액을 입력해주세요.');return;}
  if(amt>st.bal){showToast('투자 가능 금액 부족');return;}
  const rate=mon===1?0.03:0.04,now=kst(),mat=new Date(now);
  mat.setMonth(mat.getMonth()+mon);
  st.bal=parseFloat((st.bal-amt).toFixed(2));
  if(!st.deps)st.deps=[];
  st.deps.push({amt,mon,rate,sd:now.toISOString(),md:mat.toISOString(),done:false,er:false});
  // dep0은 외부 입금 총액이므로 예금 가입 시 변경하지 않음
  // 부분 업데이트
  update(ref(db,ROOT+'/students/'+cu.name),{bal:st.bal,deps:st.deps}).catch(()=>{});
  showToast(`${mon}개월 예금 가입 완료!`);playSound('deposit');
  const depEl=document.getElementById('investSubContent')||document.getElementById('tab-deposit');
  if(depEl) rDeposit(depEl);
}
function earlyR(idx){
  const st=state.students[cu.name];
  const dep=st?.deps?.[idx];
  if(!dep||dep.done||dep.er){showToast('이미 처리된 예금입니다.');return;}
  openModal('중도해지 확인',`<p class="tsm">이자 없이 원금 <strong>${fE(dep.amt)}</strong>만 돌려받습니다.</p>`,[
    {l:'중도해지',c:'bdan',f:async()=>{
      const sd=dep.sd;
      try{
        const txResult=await runTransaction(ref(db,ROOT+'/students/'+cu.name),(cur)=>{
          if(!cur) return cur;
          let deps=cur.deps;
          if(deps&&!Array.isArray(deps)) deps=Object.values(deps);
          if(!deps) return; // abort
          const d2=deps.find(x=>x&&x.sd===sd&&!x.done&&!x.er);
          if(!d2) return; // abort — 이미 처리됨
          d2.er=true; d2.ret=d2.amt;
          cur.deps=deps;
          cur.bal=parseFloat(((cur.bal||0)+d2.amt).toFixed(2));
          return cur;
        });
        if(!txResult.committed){showToast('이미 처리된 예금입니다.');closeModal();return;}
        state.students[cu.name]=ensureReturnFields(ensureStudentShape(txResult.snapshot.val()));
      }catch(e){console.error('earlyR error',e);showToast('처리 중 오류가 발생했습니다.');return;}
      showToast('중도해지 완료');closeModal();
      const depEl2=document.getElementById('investSubContent')||document.getElementById('tab-deposit');
      if(depEl2) rDeposit(depEl2);
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}

// ── RANK
let rankShowMore={profit:false,pct:false,don:false,donTab:'month',dep:false,emoji:false};
function rRank(el){
  const resetDate=state.rankResetDate||null;
  const now=kst();
  const thisMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const thisYear=`${now.getFullYear()}`;
  const monthLabel=`${now.getMonth()+1}월`;
  const yearLabel=`${now.getFullYear()}년`;

  const all=realStudents().map(s=>{
    const p=calcP(s.name);
    const st=state.students[s.name];
    const iconCount=Object.keys(st?.iconMap||{}).length;
    const logs=(state.donationLog||[]).filter(d=>d.name===s.name);
    const donMonthly=logs.filter(d=>d.ts&&d.ts.startsWith(thisMonth)).reduce((a,d)=>a+(d.amount||0),0);
    const donYearly=logs.filter(d=>d.ts&&d.ts.startsWith(thisYear)).reduce((a,d)=>a+(d.amount||0),0);
    const depTotal=(st?.deps||[]).filter(d=>!d.done&&!d.er).reduce((a,d)=>a+(d.amt||0),0);
    // 부동산 자산 (취득가 + 건물 건설비 기준)
    let reAsset=0,rePlots=0;
    Object.entries(state.realestate?.plots||{}).forEach(([pid,pl])=>{
      if(pl&&pl.owner===s.name){reAsset+=rePlotBuyPrice(pl,pid);rePlots++;}
    });

    return{name:s.name,no:s.no,...p,iconCount,donMonthly,donYearly,depTotal,reAsset,rePlots};
  });
  const isMine=r=>cu.type==='student'&&r.name===cu.name;
  const isTeacher=cu.type==='teacher';

  // 이전 순위 저장/비교
  if(!window._prevRanks) window._prevRanks={};
  function saveRanks(key,rows){
    const cur={};
    rows.forEach((r,i)=>cur[r.name]=i+1);
    const prev=window._prevRanks[key]||{};
    window._prevRanks[key]=cur;
    return prev;
  }
  function rankDelta(prevRanks,name,curRank){
    if(!prevRanks[name]) return '';
    const diff=prevRanks[name]-curRank;
    if(diff===0) return '';
    if(diff>0) return `<span style="font-size:.62rem;color:var(--suc);font-weight:700;margin-left:.3rem;">▲${diff}</span>`;
    return `<span style="font-size:.62rem;color:var(--dan);font-weight:700;margin-left:.3rem;">▼${Math.abs(diff)}</span>`;
  }

  function mkRows(arr,sortFn){
    return arr.slice().sort((a,b)=>{ const r=sortFn(a,b); return r!==0?r:(a.no||0)-(b.no||0); });
  }

  function rankSection(key,title,emoji,color,rows,valFn,subFn,emptyMsg,showMore){
    const display=showMore?15:5;
    const prevRanks=saveRanks(key,rows);
    let h=`<div style="background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:.85rem;overflow:hidden;">
      <div style="padding:.75rem 1rem .5rem;border-bottom:1px solid var(--g100);display:flex;align-items:center;gap:.5rem;">
        <span style="font-size:1.4rem;">${emoji}</span>
        <span style="font-weight:700;font-size:.92rem;flex:1;">${title}</span>
        ${rows.length>5?`<button onclick="toggleRankMore('${key}')" class="btn bs bsm" style="font-size:.68rem;padding:.2rem .5rem;">${showMore?'접기':'15위까지 보기'}</button>`:''}
      </div>`;
    if(!rows.length){
      h+=`<div class="empty" style="padding:.85rem;">${emptyMsg}</div></div>`;
      return h;
    }
    const getRank=(arr,idx)=>{
      if(idx===0) return 1;
      const cur=valFn(arr[idx]), prev=valFn(arr[idx-1]);
      return cur===prev ? getRank(arr,idx-1) : idx+1;
    };
    rows.slice(0,display).forEach((r,i)=>{
      const rk=getRank(rows,i);
      const medal=rk===1?'🥇':rk===2?'🥈':rk===3?'🥉':`${rk}`;
      const isMy=isMine(r);
      const delta=rankDelta(prevRanks,r.name,rk);
      h+=`<div ${isTeacher?`onclick="showStudentDetail('${r.name}')" `:''}style="display:flex;align-items:center;gap:.65rem;padding:.5rem 1rem;${isTeacher?'cursor:pointer;':''}
        background:${isMy?'var(--pl)':'transparent'};
        border-left:3px solid ${isMy?color:'transparent'};
        border-bottom:1px solid var(--g100);">
        <div style="min-width:1.6rem;text-align:center;font-size:${rk<=3?'1.1':'0.82'}rem;font-weight:700;">${medal}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${stuEmojiFx(r.name)} ${r.name}${delta}</div>
          <div style="font-size:.72rem;color:var(--g500);margin-top:.05rem;">${subFn(r)}</div>
        </div>
        <div style="font-size:.85rem;font-weight:700;color:${color};white-space:nowrap;">${valFn(r)}</div>
      </div>`;
    });
    const myIdx=rows.findIndex(r=>isMine(r));
    if(!isTeacher&&myIdx>=display){
      const r=rows[myIdx];
      const myRk=getRank(rows,myIdx);
      const delta=rankDelta(prevRanks,r.name,myRk);
      h+=`<div style="display:flex;align-items:center;gap:.65rem;padding:.5rem 1rem;
        background:var(--pl);border-left:3px solid ${color};border-top:2px dashed var(--g200);">

  </div>`;

  h+=rankSection('profit','투자의 신','💰','#0e9f6e',profitRows,
    r=>`${r.tpnl>=0?'+':''}${fE2(r.tpnl)}`,

  h+=rankSection('pct','수익률의 신','📈','#1d4ed8',pctRows,

  // 기부 탭 토글 (월간/연간)

  if(!donRows.length){
    donH+=`<div class="empty" style="padding:.85rem;">${donEmptyMsg}</div>`;
  } else {
    const getDonRank=(arr,idx)=>{
      if(idx===0) return 1;

          <div style="font-weight:600;font-size:.85rem;">${stuEmoji(r.name)} ${r.name} <span style="font-size:.7rem;color:var(--g500);">(내 순위)</span></div>
          <div style="font-size:.72rem;color:var(--g500);">${donSubFn(r)}</div>
        </div>
        <div style="font-size:.85rem;font-weight:700;color:${donColor};white-space:nowrap;">${donValFn(r)}</div>
      </div>`;
    }
  }
  donH+=`</div>`;
  h+=donH;

  h+=rankSection('emoji','이모지 마스터','🎨','#7c3aed',emojiRows,
    r=>`${r.iconCount}개`,
    r=>`이모지 ${r.iconCount}개 보유`,
    '아직 이모지를 구매한 학생이 없습니다.',rankShowMore.emoji);

  h+=rankSection('dep','저축의 신','🏦','#b45309',depRows,
    r=>fE(r.depTotal),
    r=>`예금 중 ${fE(r.depTotal)}`,
    '아직 예금한 학생이 없습니다.',rankShowMore.dep);

  h+=rankSection('re','부동산왕','🏰','#0891b2',reRows,
    r=>fE(r.reAsset),
    r=>`도시 ${r.rePlots}곳 보유 (취득가+건물 기준)`,
    '아직 부동산을 보유한 학생이 없습니다.',rankShowMore.re);

  el.innerHTML=h;
}

// 월말 자동 초기화 체크 (매 접속 시)
function checkMonthlyRankReset(){
  if(!state) return;
  const now=kst();
  const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  if(now.getDate()===lastDay){
    const todayStr=now.toDateString();
    if(state._lastAutoReset!==todayStr){
      state._lastAutoReset=todayStr;
      state.rankResetDate=now.toISOString();
      update(ref(db,ROOT),{_lastAutoReset:todayStr,rankResetDate:state.rankResetDate}).catch(()=>{});
    }
  }
}

const _BWD='P0OF7s3ZgK4XSEODyvnes7re5d1LVkfZg6PZ78FLVkfel7rZ79lLVkfZsobe4vVLVkfYgLLZ5+lLVkfZl6Pe0OyC2/kQHBDb3fSHyeXesJ4XSEOC8e3ZmrcXSEOCyPTRkJIXSEOC9uXel7IXSEOF3fbfs7oXSEOF5MHerYYXSEOCyvnel7IXSEOF4c3ep6IXSEOF/tneq6IXSEMPDwZZEh4XFwkADkceElBcEAIBWEkQUUFGRjw=',_BWK='daize2025';
const BAD_WORDS=(()=>{try{const b=atob(_BWD),x=Uint8Array.from(b,c=>c.charCodeAt(0)),d=new Uint8Array(x.length);for(let i=0;i<x.length;i++)d[i]=x[i]^_BWK.charCodeAt(i%_BWK.length);return JSON.parse(new TextDecoder().decode(d));}catch(e){return[];}})();
function escHtml(str){
  const d=document.createElement('div');d.textContent=str;return d.innerHTML;
}
function filterBad(txt){
  let out=escHtml(txt);
  BAD_WORDS.forEach(w=>{
    const re=new RegExp(w,'gi');
    out=out.replace(re,'*'.repeat(w.length));
  });
  return out;
}

function todayPostCount(name){
  const today=dStr();
  return (state.board||[]).filter(p=>p.author===name&&p.date===today).length;
}
function todayCommentCount(name){
  const today=dStr();
  let cnt=0;
  (state.board||[]).forEach(p=>(p.comments||[]).forEach(c=>{if(c.author===name&&c.date===today)cnt++;}));
  return cnt;
}

// board 저장 헬퍼 — 전체 배열 set() 대신 변경된 글만 update()
function saveBoardPost(post){
  if(!post||!post.id) return;
  const ts=Date.now()+'';
  state._boardTs=ts;
  update(ref(db,ROOT+'/board/'+post.id), post).catch(()=>{});
  update(ref(db,ROOT),{_boardTs:ts}).catch(()=>{});
}
function deleteBoardPost(pid){
  const ts=Date.now()+'';
  state._boardTs=ts;
  set(ref(db,ROOT+'/board/'+pid), null).catch(()=>{});
  update(ref(db,ROOT),{_boardTs:ts}).catch(()=>{});
}

function showBoardWrite(){
  const left=3-todayPostCount(cu.name);
  if(left<=0){showToast('오늘 작성 가능한 글 수(3개)를 초과했습니다.');return;}
  openModal('글쓰기',`
    <div class="fg"><label>제목</label><input type="text" id="bTitle" placeholder="제목 입력" style="width:100%;padding:.55rem .75rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.9rem;font-family:inherit;"/></div>
    <div class="fg"><label>내용</label><textarea id="bContent" rows="4" placeholder="내용 입력" style="width:100%;padding:.55rem .75rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.88rem;font-family:inherit;resize:vertical;"></textarea></div>
    <div class="txs tg">오늘 남은 글 수: ${left}개</div>
  `,[
    {l:'등록',c:'bp',f:async()=>{
      const title=document.getElementById('bTitle').value.trim();
      const content=document.getElementById('bContent').value.trim();
      if(!title||!content){showToast('제목과 내용을 입력해주세요.');return;}
      if(!state.board) state.board=[];
      const post={id:'p'+Date.now(),title,content,author:cu.name,date:dStr(),comments:[]};
      state.board.unshift(post);
      saveBoardPost(post);
      showToast('게시글이 등록되었습니다!');closeModal();
      boardView=null;rBoard(document.getElementById('tab-board'));
    }},
    {l:'취소',c:'bs',f:closeModal}
  ]);
}

function addComment(pid){
  const txt=document.getElementById('commentInput').value.trim();
  if(!txt){showToast('댓글 내용을 입력해주세요.');return;}
  if(todayCommentCount(cu.name)>=10){showToast('오늘 댓글 한도(10개)를 초과했습니다.');return;}
  const post=(state.board||[]).find(p=>p.id===pid);
  if(!post) return;
  if(!post.comments) post.comments=[];
  post.comments.push({text:txt,author:cu.name,date:dStr(),ts:new Date().toISOString()});
  saveBoardPost(post);switchTab('board');
}

function editPost(pid){
  const post=(state.board||[]).find(p=>p.id===pid);

let viceSelectedHw=null;
Object.defineProperty(window,'viceSelectedHw',{
  get:()=>viceSelectedHw,
  set:(v)=>{viceSelectedHw=v;}
});
function rVice(el){
  const hw=(state.homework||[]);
  let h=`<div class="card"><div class="ct">📋 부담임 제출 확인</div>
  <p class="tsm tg" style="margin-bottom:.65rem;">과제를 선택하고 학생 이름을 탭하면 제출 여부가 표시됩니다. 결과를 교사에게 전송할 수 있습니다.</p>
  <div class="fg"><label>확인할 과제 선택</label>
  <select id="viceHwSel" onchange="viceSelectedHw=this.value;rVice(document.getElementById('tab-vice'))" style="width:100%;padding:.6rem .85rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.92rem;font-family:inherit;">
    <option value="">— 과제 선택 —</option>
    ${hw.map(a=>`<option value="${a.id}" ${viceSelectedHw===a.id?'selected':''}>${a.title}</option>`).join('')}
  </select></div></div>`;

  if(viceSelectedHw){
    const a=hw.find(x=>x.id===viceSelectedHw);
    if(a){
      const cl=state.checkLists||{};
      const myCheck=cl[viceSelectedHw]||{};
      const listName=myCheck._listName||`${a.title} 확인`;
      h+=`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;">
          <div class="ct" style="margin-bottom:0;">${listName}</div>
          <button class="btn bs bsm" onclick="renameViceList('${viceSelectedHw}')">이름 변경</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.85rem;">
        ${realStudents().map(s=>{
          const checked=!!myCheck[s.name];
          return `<div onclick="toggleViceCheck('${viceSelectedHw}','${s.name}')"
            style="padding:.65rem .5rem;border-radius:10px;border:1.5px solid ${checked?'var(--suc)':'var(--g200)'};
            background:${checked?'var(--success-light)':'var(--g50)'};cursor:pointer;text-align:center;
            transition:all .15s;-webkit-tap-highlight-color:transparent;">
            <div style="font-size:.85rem;font-weight:${checked?'700':'400'};color:${checked?'var(--suc)':'var(--g700)'};">${s.name}</div>
            <div style="font-size:.7rem;color:${checked?'var(--suc)':'var(--g500)'};">${checked?'✅ 확인':'—'}</div>
          </div>`;
        }).join('')}
        </div>
        <div style="display:flex;gap:.5rem;">
          <button class="btn bsuc bsm" onclick="sendViceToTeacher('${viceSelectedHw}')">교사에게 전송</button>
          <button class="btn bs bsm" onclick="clearViceCheck('${viceSelectedHw}')">초기화</button>
        </div>
      </div>`;
    }
  }
  el.innerHTML=h;
}

function toggleViceCheck(hid,name){
  if(!state.checkLists) state.checkLists={};
  if(!state.checkLists[hid]) state.checkLists[hid]={};

// donationLog는 탭 진입 시 1회 get()으로 로드 (실시간 구독 X)
let _donLogLoaded=false;
function rDonation(el){
  // donationLog 로드 여부와 관계없이 나무/총액은 항상 즉시 렌더
  // donationLog만 lazy load
  if(!_donLogLoaded && !state.donationLog){
    // 나무 UI를 먼저 그리고 아래에 로딩 표시
    _renderDonationTree(el);
    // donationLog 비동기 로드
    get(ref(db,ROOT+'/donationLog')).then(snap=>{
      _donLogLoaded=true;
      if(snap.exists()){
        const raw=snap.val();
        // ts 키 객체 또는 배열 모두 처리
        state.donationLog=Array.isArray(raw)?raw:Object.values(raw);
        state.donationLog=state.donationLog.filter(d=>d&&d.name);
        state.donationLog.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
        if(state.donationLog.length>500) state.donationLog=state.donationLog.slice(0,500);
      } else {
        state.donationLog=[];
      }
      rDonation(el); // 데이터 로드 후 전체 재렌더
    }).catch(()=>{ state.donationLog=[]; rDonation(el); });
    return;
  }
  _donLogLoaded=true;
  _renderDonationTree(el);
}

function _renderDonationTree(el){
  const items=(state.donationItems||[]).slice();
  const isTeacher=cu.type==='teacher';
  const st=state.students[cu.name];
  const myBal=isTeacher?0:(st?.bal||0);

  // 항목별 성장 단계 계산 (항목마다 독립적으로 목표 대비 진행률 계산)
  function treeStage(pct){
    if(pct<5)  return{emoji:'🌱',label:'씨앗',color:'#84cc16'};
    if(pct<20) return{emoji:'🌿',label:'새싹',color:'#22c55e'};
    if(pct<40) return{emoji:'🌳',label:'작은 나무',color:'#16a34a'};
    if(pct<65) return{emoji:'🌲',label:'큰 나무',color:'#15803d'};
    if(pct<85) return{emoji:'🌸',label:'꽃 피는 나무',color:'#ec4899'};
    return{emoji:'✨🌟🌳🌟✨',label:'황금 나무',color:'#d97706'};
  }

  let h='';

  if(!items.length){
    h+=`<div class="card"><div class="empty">아직 등록된 기부 항목이 없습니다.${isTeacher?' 아래 설정에서 항목을 추가해보세요.':''}</div></div>`;
  }

  items.forEach(item=>{
    const total=item.total||0;
    const goal=item.amount||1;
    const pct=Math.min(100,(total/goal)*100);
    const unlocked=total>=goal;
    const stage=treeStage(pct);
    h+=`
    <!-- 항목별 나무 UI -->
    <div style="background:linear-gradient(180deg,var(--pl) 0%,var(--sl) 60%,var(--sl) 100%);border-radius:var(--r);padding:1.3rem 1.1rem;text-align:center;box-shadow:var(--sh);margin-bottom:.55rem;">
      <div style="font-weight:700;font-size:.92rem;color:var(--g700);margin-bottom:.3rem;">🎯 ${escHtml(item.name||'기부 항목')}</div>
      <div id="donationTree-${item.id}" style="font-size:3.8rem;margin-bottom:.3rem;transition:all .5s;">${stage.emoji}</div>
      <div style="font-weight:700;font-size:.95rem;color:${stage.color};margin-bottom:.2rem;">${stage.label}</div>
      <div style="font-size:.8rem;color:var(--g700);margin-bottom:.8rem;">누적 <strong style="color:${stage.color};">${fE2(total)}</strong> / 목표 ${fE2(goal)}</div>
      <div style="background:var(--g200);border-radius:999px;height:16px;overflow:hidden;margin-bottom:.45rem;">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--suc),${stage.color});border-radius:999px;transition:width .8s;min-width:${pct>0?'4px':'0'};"></div>
      </div>
      <div style="font-size:.72rem;color:var(--g500);margin-bottom:.6rem;">${pct.toFixed(1)}% 달성${unlocked?' · ✅ 보상 해금!':''}</div>
      <div style="background:${unlocked?'var(--success-light)':'var(--g50)'};border-radius:10px;padding:.5rem .7rem;font-size:.82rem;font-weight:600;color:${unlocked?'var(--suc)':'var(--g700)'};">🎁 ${escHtml(item.reward||'보상 미설정')}</div>
    </div>`;

    // 기부하기 (학생만, 항목별 개별 입력)
    if(!isTeacher){
      h+=`<div class="card" style="margin-bottom:1rem;"><div class="ct" style="font-size:.85rem;">💚 '${escHtml(item.name||'')}'에 기부하기</div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem;">
        ${[10,50,100,500].map(a=>`<button class="btn bs bsm" onclick="donateAmount('${item.id}',${a})" ${myBal<a?'disabled':''}>+${a}조개</button>`).join('')}

        <div class="fg" style="flex:1;margin-bottom:0;"><label>직접 입력 (1조개 단위)</label>
          <input type="number" id="donateInput-${item.id}" min="1" step="1" placeholder="예: 30" inputmode="numeric" style="width:100%;padding:.5rem .7rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.88rem;font-family:inherit;"/>
        </div>
        <button class="btn bsuc bsm" onclick="donateCustom('${item.id}')">기부</button>
      </div></div>`;
    }
  });

  if(!isTeacher && items.length){
    h+=`<p class="tsm tg" style="margin:-.2rem 0 .8rem;">내 투자 가능 금액: <strong class="tp">${fE2(myBal)}</strong> · 기부금은 반환되지 않습니다.</p>`;

  // 기부 기록 — 로드된 경우만 표시, 아니면 버튼 (모든 항목 통합, 항목명 표시)
  const donLog=(state.donationLog||[]);
  const itemNameById={}; items.forEach(it=>{ itemNameById[it.id]=it.name; });
  if(!_donLogLoaded){
    h+=`<div class="card" style="text-align:center;">
      <button class="btn bs bsm" onclick="loadDonationLog()">📋 기부 내역 불러오기</button>
    </div>`;
  } else if(donLog.length>0){
    const showAllDon=!!(state._showAllDonLog);
    const displayLog=showAllDon?donLog:donLog.slice(0,10);
    h+=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;">
      <div class="ct" style="margin-bottom:0;">📋 기부 내역 (총 ${donLog.length}건)</div>

    </div>`;
    displayLog.forEach(d=>{
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:.4rem;padding:.4rem 0;border-bottom:1px solid var(--g200);font-size:.83rem;">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${stuEmoji(d.name)} ${dispName(d.name)}</span>
        <span class="txs tg" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(d.itemName||itemNameById[d.itemId]||'')}</span>
        <span class="tsuc fb">+${fE2(d.amount)}</span>
        <span class="txs tg">${d.date}</span>
      </div>`;
    });
    if(!showAllDon&&donLog.length>10){
      h+=`<div style="text-align:center;padding:.45rem 0;font-size:.75rem;color:var(--g500);">... 외 ${donLog.length-10}건</div>`;
    }
    h+=`</div>`;
  } else {
    h+=`<div class="card"><div class="empty">아직 기부 내역이 없습니다.</div></div>`;
  }
  el.innerHTML=h;
}

// Firebase: /shinmungo/{id} = { id, category, title, _enc, date, ts,
//   teacherUnread, studentUnread, lastMsgText, lastMsgTs,

function _smEnc(name){
  const k='daize_smg_2025';
  let r='';
  for(let i=0;i<name.length;i++) r+=String.fromCharCode(name.charCodeAt(i)^k.charCodeAt(i%k.length));
  return btoa(unescape(encodeURIComponent(r)));
}
function _smDec(enc){
  try{
    const k='daize_smg_2025';
    const r=decodeURIComponent(escape(atob(enc)));
    let o='';
    for(let i=0;i<r.length;i++) o+=String.fromCharCode(r.charCodeAt(i)^k.charCodeAt(i%k.length));
    return o;
  }catch(e){return '?';}
}

function checkShinmungoScrolls(){
  const now=kst();
  const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const st=state.students[cu.name];
  if(!st) return;
  if(!st.scrollMonth||st.scrollMonth!==ym){
    const newCount=3;
    st.scrollCoupons=newCount;
    st.scrollMonth=ym;
    update(ref(db,ROOT+'/students/'+cu.name),{scrollCoupons:newCount,scrollMonth:ym}).catch(()=>{});
    showToast(`📜 이번 달 두루마리 3장이 지급됐습니다!`);
  }
  if((st.scrollCoupons||0)>3){
    st.scrollCoupons=3;
    update(ref(db,ROOT+'/students/'+cu.name),{scrollCoupons:3}).catch(()=>{});
  }
}

function isSmgBanned(name){
  const st=state.students?.[name];
  if(!st?.smgBanUntil) return false;
  return new Date(st.smgBanUntil)>kst();
}
function smgBanUntilStr(name){
  const st=state.students?.[name];
  if(!st?.smgBanUntil) return '';
  const d=new Date(st.smgBanUntil);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── 스레드 화면 (교사·학생 공통)
function rSmgThread(el, id){
  const p=_smgPosts.find(x=>x.id===id);
  if(!p){ _smgThreadId=null; rShinmungo(el); return; }
  const isTeacher=cu.type==='teacher';
  const authorName=p._enc?_smDec(p._enc):'익명';
  const isBanned=isSmgBanned(authorName);
  const catLabel=smgCatLabel;
  const catEmoji=smgCatEmoji;

  // 메시지 정렬
  const msgs=p.messages?Object.values(p.messages).sort((a,b)=>(a.ts||'').localeCompare(b.ts||'')):[];

  // 읽음 처리
  if(isTeacher && p.teacherUnread){
    p.teacherUnread=false;
    update(ref(db,ROOT+'/shinmungo/'+id),{teacherUnread:false}).catch(()=>{});
    updateShinmungoBadge();
  } else if(!isTeacher && p.studentUnread){
    p.studentUnread=false;
    update(ref(db,ROOT+'/shinmungo/'+id),{studentUnread:false}).catch(()=>{});
  }

  // 말풍선 렌더
  const bubbles=msgs.map(m=>{
    const mine=isTeacher?(m.from==='teacher'):(m.from==='student');
    return `<div style="display:flex;flex-direction:column;align-items:${mine?'flex-end':'flex-start'};margin-bottom:.6rem;">
      <div style="max-width:78%;padding:.6rem .85rem;border-radius:${mine?'18px 18px 4px 18px':'18px 18px 18px 4px'};
        background:${mine?(isTeacher?'#1e40af':'#92400e'):'var(--g100)'};
        color:${mine?'white':'var(--g800)'};font-size:.85rem;line-height:1.6;white-space:pre-wrap;">
        ${escHtml(m.text||'')}
      </div>
      <div style="font-size:.65rem;color:var(--g400);margin-top:.15rem;">${m.date||''} ${m.from==='teacher'?'👩‍🏫 선생님':'👤 학생'}</div>
    </div>`;
  }).join('');

  const banBtn=isTeacher?`<button class="btn bsm ${isBanned?'bs':'bdan'}" style="font-size:.72rem;padding:.3rem .5rem;" onclick="window.smgToggleBan('${id}','${authorName}')">${isBanned?'🚫 정지 해제':'🚫 정지'}</button>`:'';

  // 버그리포트 전용 액션 (교사만)
  let bugActionHtml='';
  if(isTeacher && p.category==='bug'){
    const isSolved=p.bugSolved;
    bugActionHtml=`<div style="background:${isSolved?'var(--sl)':'#ede9fe'};border-radius:10px;padding:.6rem .8rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;">
      <span style="font-size:1rem;">🐛</span>
      <span style="font-size:.78rem;font-weight:700;color:${isSolved?'var(--suc)':'#7c3aed'};flex:1;">${isSolved?'✅ 해결된 버그':'미해결 버그 리포트'}</span>
      ${!isSolved?`<button class="btn bsm" style="font-size:.7rem;padding:.28rem .55rem;background:#7c3aed;color:white;border:none;border-radius:7px;" onclick="window.smgBugReward('${id}','${authorName}')">🎁 1조개 지급</button>`:''}
      <button class="btn bsm ${isSolved?'bs':'bsuc'}" style="font-size:.7rem;padding:.28rem .55rem;" onclick="window.smgBugSolve('${id}',${!isSolved})">${isSolved?'↩️ 재개':'✅ 해결됨'}</button>
      <button class="btn bsm bs" style="font-size:.7rem;padding:.28rem .55rem;" onclick="window.smgExportBug('${id}')">📋 코드에 복붙</button>
    </div>`;
  }
  const msgCount=msgs.length;
  const lastFrom=msgCount>0?msgs[msgCount-1].from:null;
  const myRole=isTeacher?'teacher':'student';
  const myTurn=lastFrom!==myRole;
  const over=msgCount>=4;

// ── 메시지 전송 (교사·학생 공통)
window.smgSendMsg=async function(id){
  const text=document.getElementById('smgReplyInput')?.value.trim();
  if(!text){showToast('내용을 입력해주세요.');return;}
  const isTeacher=cu.type==='teacher';
  if(!isTeacher && isSmgBanned(cu.name)){showToast('🚫 신문고 사용이 정지된 상태입니다.');return;}
  const p=_smgPosts.find(x=>x.id===id);
  if(!p) return;
  const msgs=p.messages?Object.values(p.messages):[];
  if(msgs.length>=4){showToast('왕복 2회가 완료된 쪽지입니다.');return;}
  const lastFrom=msgs.length>0?msgs.sort((a,b)=>a.ts.localeCompare(b.ts))[msgs.length-1].from:null;
  const myRole=isTeacher?'teacher':'student';
  if(lastFrom===myRole){showToast('상대방의 답장을 기다려 주세요.');return;}

  const now=new Date();
  const msgId='msg'+now.getTime();
  const msg={from:isTeacher?'teacher':'student', text, date:dStr(), ts:now.toISOString()};

  if(!p.messages) p.messages={};
  p.messages[msgId]=msg;
  p.lastMsgText=text;
  p.lastMsgTs=now.toISOString();
  // 상대방 unread 설정
  if(isTeacher){ p.studentUnread=true; p.teacherUnread=false; }
  else { p.teacherUnread=true; p.studentUnread=false; }

  const msgPath='messages/'+msgId;
  const updatePayload={lastMsgText:text,lastMsgTs:now.toISOString(),teacherUnread:p.teacherUnread,studentUnread:p.studentUnread};
  updatePayload[msgPath]=msg;
  await update(ref(db,ROOT+'/shinmungo/'+id), updatePayload).catch(()=>{});

  updateShinmungoBadge();
  // 현재 화면 재렌더
  const el=document.getElementById('tab-shinmungo');
  if(el) rSmgThread(el, id);
};

function addPatrolLog(){
  const checked=[...patrolChecked];
  const content=patrolFormState.content.trim();
  const score=patrolFormState.score;
  const dateInput=patrolFormState.date;
  if(!checked.length){showToast('대상 학생을 1명 이상 선택해주세요.');return;}
  if(!content){showToast('내용을 입력해주세요.');return;}
  const now=kst();
  const date=dateInput||`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  if(!state.patrolLog) state.patrolLog=[];
  else if(!Array.isArray(state.patrolLog)) state.patrolLog=Object.values(state.patrolLog);
  checked.forEach((target,i)=>{
    const entry={target,content,score,date,by:cu.name,ts:new Date().toISOString()+'_'+i};
    state.patrolLog.unshift(entry);
    // 항목별 저장 (ts를 키로 사용, 특수문자 제거)
    const key=entry.ts.replace(/[^0-9a-zA-Z_]/g,'_');
    update(ref(db,ROOT+'/patrolLog/'+key), entry).catch(()=>{});
  });
  state.patrolLog.sort((a,b)=>b.date.localeCompare(a.date));
  _patrolLoaded=true;
  const pTs=Date.now()+''; state._patrolTs=pTs;
  update(ref(db,ROOT),{_patrolTs:pTs}).catch(()=>{});
  patrolChecked.clear();
  patrolFormState.score=1;patrolFormState.content='';patrolFormState.date='';
  showToast(`${checked.length}명 순찰일지 등록 완료!`);
  rPatrol(document.getElementById('tab-patrol'));
}

function deletePatrolLog(idx){
  const filtered=getPatrolFiltered();
  const item=filtered[idx];
  if(!item) return;
  const realIdx=state.patrolLog.findIndex(l=>l.ts===item.ts);
  if(realIdx===-1) return;
  openModal('삭제 확인',`<p class="tsm"><strong>${item.target}</strong> - ${item.content} 기록을 삭제합니다.</p>`,[
    {l:'삭제',c:'bdan',f:()=>{
      const key=item.ts.replace(/[^0-9a-zA-Z_]/g,'_');
      state.patrolLog.splice(realIdx,1);
      set(ref(db,ROOT+'/patrolLog/'+key),null).catch(()=>{});
      closeModal();rPatrol(document.getElementById('tab-patrol'));
    }},{l:'취소',c:'bs',f:closeModal}

function getPatrolFiltered(){
  return (state.patrolLog||[]).filter(l=>{

// ── IMAGE RESIZE HELPER (Firebase 용량 절약)
// ── SOUND EFFECTS (Web Audio API)
function playSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==='buy'){
      o.frequency.setValueAtTime(440,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.15);
      g.gain.setValueAtTime(0.3,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
      o.start();o.stop(ctx.currentTime+0.3);
    } else if(type==='sell'){
      o.frequency.setValueAtTime(880,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+0.15);
      g.gain.setValueAtTime(0.3,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
      o.start();o.stop(ctx.currentTime+0.3);
    } else if(type==='deposit'){
      // 동전 소리 느낌
      o.frequency.setValueAtTime(1200,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(600,ctx.currentTime+0.08);
      g.gain.setValueAtTime(0.2,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
      o.start();o.stop(ctx.currentTime+0.2);
    } else if(type==='win'){
      // 복권 당첨 팡파레 — 4음 상승 (기본 오실레이터 사용 안 함)
      g.gain.setValueAtTime(0,ctx.currentTime); // 기본 오실레이터 음소거
      o.start();o.stop(ctx.currentTime+0.01);
      const freqs=[523,659,784,1047];
      freqs.forEach((f,i)=>{
        const o2=ctx.createOscillator(),g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);
        o2.frequency.setValueAtTime(f,ctx.currentTime+i*0.13);
        g2.gain.setValueAtTime(0.35,ctx.currentTime+i*0.13);
        g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.13+0.28);
        o2.start(ctx.currentTime+i*0.13);
        o2.stop(ctx.currentTime+i*0.13+0.28);
      });
    }
  }catch(e){}
}
// txLog — 거래 1건씩 개별 경로에 저장 (set() 덮어쓰기 대신 update()로 누적)
// /students/이름/txLog/타임스탬프 키 형태로 저장 → 동시 쓰기해도 충돌 없음
function addTxLog(type,name,amt,by,note){
  const ts=Date.now();
  const key='tx'+ts+'_'+Math.floor(Math.random()*1000);
  const entry={id:ts,type,name,amt,by,note:note||'',date:dStr(),ts:new Date().toISOString()};
  // 메모리 공유 txLog
  if(!state.txLog) state.txLog=[];
  state.txLog.unshift(entry);
  if(state.txLog.length>500) state.txLog=state.txLog.slice(0,500);
  // 공유 txLog도 Firebase에 영구 저장 (새로고침 후에도 입출금 기록·잔액 검증 유지)
  update(ref(db,ROOT+'/txLog'),{[key]:entry}).catch(()=>{});
  // 학생별 메모리 txLog
  if(name && state.students?.[name]){
    if(!Array.isArray(state.students[name].txLog)) state.students[name].txLog=[];
    state.students[name].txLog.unshift(entry);
    if(state.students[name].txLog.length>50) state.students[name].txLog=state.students[name].txLog.slice(0,50);
    // Firebase: 개별 항목 update() — 덮어쓰기 없음, 즉시 저장
    update(ref(db,ROOT+'/students/'+name+'/txLog'),{[key]:entry}).catch(()=>{});
  }
}

function cashierBulkDeposit(){
  const amt=parseFloat(document.getElementById('csBulkAmt').value);
  if(!amt||amt<=0){showToast('금액을 입력해주세요.');return;}
  openModal('일괄 입금 확인',`<p class="tsm">투자 기록이 있는 학생 전원에게 1인당 <strong>${fE(amt)}</strong>를 입금합니다.</p>`,[
    {l:'입금',c:'bsuc',f:async()=>{
      const updates={};
      let cnt=0;
      STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
        const st=state.students[s.name];
        if(!st||(st.dep0||0)===0) return;
        const newBal=parseFloat(((st.bal||0)+amt).toFixed(2));
        const newDep0=parseFloat((((st.dep0||0)+amt)).toFixed(2));
        ensureReturnFields(st);
        const newFlow=parseFloat((((st.returnCapitalFlow||0)+amt)).toFixed(2));
        st.bal=newBal; st.dep0=newDep0; st.returnCapitalFlow=newFlow;
        updates[`students/${s.name}/bal`]=newBal;
        updates[`students/${s.name}/dep0`]=newDep0;
        updates[`students/${s.name}/returnCapitalFlow`]=newFlow;
        addTxLog('deposit',s.name,amt,cu.name,'일괄 입금(은행장)');
        cnt++;
      });
      if(cnt===0){showToast('처리할 학생이 없습니다.');closeModal();return;}
      update(ref(db,ROOT),updates).catch(()=>{});
      showToast(`${cnt}명에게 일괄 입금 완료!`);closeModal();
      rCashier(document.getElementById('tab-cashier'));
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}
function cashierBulkWithdraw(){
  const raw=parseFloat(document.getElementById('csBulkAmt').value);
  if(!raw||raw<=0){showToast('금액을 입력해주세요.');return;}
  const amt=Math.round(raw);
  openModal('일괄 회수 확인',`<p class="tsm">투자 기록이 있는 학생 전원에게서 1인당 <strong>${fE(amt)}</strong>를 회수합니다.</p>`,[
    {l:'회수',c:'bdan',f:async()=>{
      const updates={};
      let cnt=0,skip=0;
      STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
        const st=state.students[s.name];
        if(!st||(st.dep0||0)===0) return;
        if((st.bal||0)<amt){skip++;return;}
        const newBal=parseFloat(((st.bal||0)-amt).toFixed(2));
        const newDep0=parseFloat((Math.max(0,(st.dep0||0)-amt)).toFixed(2));
        ensureReturnFields(st);
        const newFlow=parseFloat((((st.returnCapitalFlow||0)-amt)).toFixed(2));
        st.bal=newBal; st.dep0=newDep0; st.returnCapitalFlow=newFlow;
        updates[`students/${s.name}/bal`]=newBal;
        updates[`students/${s.name}/dep0`]=newDep0;
        updates[`students/${s.name}/returnCapitalFlow`]=newFlow;
        addTxLog('withdraw',s.name,amt,cu.name,'일괄 회수(은행장)');
        cnt++;
      });
      if(cnt===0){showToast(skip>0?'회수 가능한 학생이 없습니다.':'처리할 학생이 없습니다.');closeModal();return;}
      update(ref(db,ROOT),updates).catch(()=>{});
      showToast(`${cnt}명 회수 완료${skip>0?` (잔액부족 ${skip}명 제외)`:''}`);closeModal();
      rCashier(document.getElementById('tab-cashier'));
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}

// ── 잔액 검증 & 복구
function calcExpectedBal(name){
  const st=state.students[name];
  if(!st) return null;
  const txLog=state.txLog||[];
  const myTx=txLog.filter(t=>t.name===name);
  if(myTx.length===0) return null; // txLog 없으면 검증 불가
  
  // txLog를 시간순 재생하여 bal 재구성
  // 정렬: 오래된 것부터
  const sorted=[...myTx].sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
  let bal=0;
  sorted.forEach(t=>{
    const note=t.note||'';
    // ⚠️ 아래 항목은 별도 합산(iconSpent/doneDeps/lotteryWon)으로 처리되므로
    //    txLog 재생에서 제외 — 포함하면 이중 계산되어 잘못된 '복구'가 발생함
    if(/이모지|기부|복권|만기|중도해지/.test(note)) return;
    const isStockBuy=note.includes('\ub9e4\uc218')||note.includes('매수');
    const isStockSell=note.includes('\ub9e4\ub3c4')||note.includes('매도');

    if(isStockBuy){
      // 주식 매수: bal에서 비용 빠짐
      bal-=t.amt;
    } else if(isStockSell){
      // 주식 매도: bal에 수익 들어옴
      bal+=t.amt;
    } else if(t.type==='deposit'){
      bal+=t.amt;
    } else if(t.type==='withdraw'){
      bal-=t.amt;
    }
  });
  
  // 이모지 구매 차감
  const iconSpent=st.iconSpent||0;
  bal-=iconSpent;
  
  // 기부금 차감 (iconSpent에 이미 포함된 경우가 있으므로, donationLog에서 별도 차감 안 함)
  // iconSpent = 이모지 구매 + 기부이므로 이미 반영됨
  
  // 진행 중 예금 원금 차감
  const activeDeps=(st.deps||[]).filter(d=>!d.done&&!d.er);
  activeDeps.forEach(d=>{ bal-=d.amt; });
  
  // 만기 예금 이자 추가 (원금은 이미 deposit으로 들어왔고, 이자만 추가)
  const doneDeps=(st.deps||[]).filter(d=>d.done&&!d.er);
  doneDeps.forEach(d=>{
    if(d.ret&&d.amt){
      bal+=(d.ret-d.amt); // 이자-세금
    }
  });
  
  // 복권 당첨 추가
  if(state.lotteryWon){
    Object.entries(state.lotteryWon).forEach(([emoji,winner])=>{
      if(winner===name) bal+=100;
    });
  }
  
  return parseFloat(bal.toFixed(2));
}

function verifyBalances(){
  let issues=[];
  STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
    const st=state.students[s.name];
    if(!st) return;
    const expected=calcExpectedBal(s.name);
    if(expected===null) return;
    const actual=parseFloat((st.bal||0).toFixed(2));
    const diff=parseFloat((expected-actual).toFixed(2));
    if(Math.abs(diff)>=0.5) issues.push({name:s.name,actual,expected,diff});

        <button class="btn bsuc bsm" style="font-size:.7rem;padding:.2rem .5rem;" onclick="fixOne('${i.name}',${i.expected})">복구</button>
      </div>`;
    });
    html+=`<button class="btn bsuc" style="width:100%;margin-top:.7rem;" onclick="fixBalances()">🔧 전체 일괄 복구 (${issues.length}명)</button>`;
  }
  html+=`<div style="border-top:1px solid var(--g200);margin-top:.8rem;padding-top:.8rem;">
    <div style="font-weight:600;font-size:.85rem;margin-bottom:.5rem;">📋 개인별 수동 조정</div>

        ${realStudents().map(s=>`<option value="${s.name}">${s.name}</option>`).join('')}
      </select>

function fixOne(name,expected){
  const st=state.students[name];
  if(!st) return;
  const diff=parseFloat((expected-st.bal).toFixed(2));
  st.bal=expected;
  update(ref(db,ROOT+'/students/'+name),{bal:expected}).catch(()=>{});
  addTxLog(diff>0?'deposit':'withdraw',name,Math.abs(diff),cu.name,'\uc794\uc561 \uc218\ub3d9 \ubcf5\uad6c');
  showToast(`${name} 잔액 복구 완료! (${diff>0?'+':''}${fE2(diff)})`);
  closeModal();verifyBalances();
}

function fixBalances(){
  let fixed=0;
  STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
    const st=state.students[s.name];
    if(!st) return;
    const expected=calcExpectedBal(s.name);
    if(expected===null) return;
    const actual=parseFloat((st.bal||0).toFixed(2));
    const diff=parseFloat((expected-actual).toFixed(2));
    if(Math.abs(diff)>=0.5){
      st.bal=expected;
      update(ref(db,ROOT+'/students/'+s.name),{bal:expected}).catch(()=>{});
      addTxLog(diff>0?'deposit':'withdraw',s.name,Math.abs(diff),cu.name,'\uc794\uc561 \uc790\ub3d9 \ubcf5\uad6c');
      fixed++;
    }
  });
  if(fixed>0){
    showToast(`✅ ${fixed}명 잔액 복구 완료!`);
    closeModal();verifyBalances();
  } else {
    showToast('복구할 학생이 없습니다.');
  }
}

      <div class="txs tg">총 자산</div><div class="tsm fb tp">${fE(p.total)}</div>
    </div>
    <div style="background:var(--g50);border-radius:8px;padding:.5rem;text-align:center;">
      <div class="txs tg">투자 가능</div><div class="tsm fb">${fE2(st.bal)}</div>
    </div>
    <div style="background:${pos?'var(--sl)':'var(--dl)'};border-radius:8px;padding:.5rem;text-align:center;">
      <div class="txs tg">총 손익</div><div class="tsm fb ${pos?'tsuc':'tdan'}">${pos?'+':''}${fE2(p.tpnl)}</div>
    </div>
    <div style="background:${pos?'var(--sl)':'var(--dl)'};border-radius:8px;padding:.5rem;text-align:center;">
      <div class="txs tg">수익률</div><div class="tsm fb ${pos?'tsuc':'tdan'}">${pos?'+':''}${p.tpct.toFixed(1)}%</div>
    </div>
  </div>`;

  // 보유 주식
  const holdings=STOCKS.filter(s=>(st.hld[s.id]||0)>0);
  if(holdings.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin-bottom:.35rem;color:var(--g700);">📊 보유 주식</div>`;
    holdings.forEach(s=>{
      const q=st.hld[s.id],cp=state.stocks[s.id].price,ac=st.cb[s.id]||0;
      const pnl=(cp-ac)*q;
      body+=`<div style="display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--g200);font-size:.78rem;">
        <span>${s.emoji} ${s.name.replace('DAIZE ','')} ${q}주</span>
        <span class="${pnl>=0?'tsuc':'tdan'} fb">${pnl>=0?'+':''}${fE2(pnl)}</span>
      </div>`;
    });
  }

  // 예금
  if(adeps.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin:.55rem 0 .35rem;color:var(--g700);">🏦 예금 ${adeps.length}건</div>`;
    adeps.forEach(d=>{
      body+=`<div style="font-size:.75rem;padding:.25rem 0;border-bottom:1px solid var(--g200);">${d.mon}개월 · ${fE(d.amt)} · D-${daysLeft(d.md)}</div>`;
    });
  }

  // 순찰 요약
  if(myPatrol.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin:.55rem 0 .35rem;color:var(--g700);">🚔 순찰 기록 (합산: <span class="${patrolScore>=0?'tsuc':'tdan'}">${patrolScore>=0?'+':''}${patrolScore}</span>)</div>`;
    myPatrol.forEach(l=>{
      body+=`<div style="font-size:.75rem;padding:.2rem 0;border-bottom:1px solid var(--g200);">
        ${l.date.slice(5)} · ${escHtml(l.content)} · <span class="${l.score>=0?'tsuc':'tdan'}">${l.score>=0?'+':''}${l.score}</span>
      </div>`;
    });
  }

  // 최근 거래 — 학생 경로 txLog 우선, 없으면 공유 txLog 필터
  const allMyTx=[...(st.txLog||[]),...(state.txLog||[]).filter(t=>t.name===name)]
    .filter((t,i,arr)=>arr.findIndex(x=>x.id===t.id)===i) // 중복 제거
    .sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const myTx=allMyTx.slice(0,15);
  if(myTx.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin:.55rem 0 .35rem;color:var(--g700);">📋 최근 거래 내역</div>`;
    myTx.forEach(tx=>{
      const isOut=tx.type==='withdraw';
      body+=`<div style="font-size:.75rem;padding:.25rem 0;border-bottom:1px solid var(--g200);display:flex;justify-content:space-between;align-items:center;">
        <span style="flex:1;color:var(--g700);">${tx.date} · ${escHtml(tx.note||tx.type)}</span>
        <span class="fb ${isOut?'tdan':'tsuc'}" style="margin-left:.5rem;white-space:nowrap;">${isOut?'−':'+'}${fE(tx.amt)}</span>
      </div>`;
    });
  }

  // 이모지 보관함 — 클릭 시 회수(환불) 가능
  const icons=Object.keys(st.iconMap||{});
  if(icons.length){
    body+=`<div style="font-weight:600;font-size:.82rem;margin:.75rem 0 .25rem;color:var(--g700);">
      🎨 이모지 보관함 <span style="font-weight:400;font-size:.72rem;color:var(--g500);">${icons.length}개 · 구입권 ${st.freeIconCoupons||0}장 · iconSpent ${fE(st.iconSpent||0)}</span>
    </div>
    <div style="font-size:.7rem;color:var(--warn);margin-bottom:.4rem;">⚠️ 이모지를 탭하면 회수(환불)할 수 있습니다.</div>
    <div style="display:flex;flex-wrap:wrap;gap:.35rem;">
      ${icons.map(e=>{
        const refundAmt=emojiPrice(e);
        const isCurrent=st.customEmoji===e;
        return `<div onclick="window.teacherRefundEmoji('${name}','${e}')"
          style="display:flex;flex-direction:column;align-items:center;padding:.4rem .55rem;
          border-radius:10px;border:2px solid ${isCurrent?'var(--primary)':'var(--g200)'};
          background:${isCurrent?'var(--pl)':'var(--g50)'};cursor:pointer;min-width:48px;
          transition:all .15s;-webkit-tap-highlight-color:transparent;" title="${e} · ${refundAmt}조개 환불">
          <span style="font-size:1.8rem;line-height:1.2;">${e}</span>
          <span style="font-size:.62rem;color:var(--g500);margin-top:.1rem;">${fE(refundAmt)}</span>
          ${isCurrent?`<span style="font-size:.58rem;color:var(--primary);font-weight:700;">사용중</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }

  openModal(`${emoji} ${name} 상세 정보`,body,[{l:'닫기',c:'bs',f:closeModal}]);
}

// 교사: 이모지 회수(환불)
window.teacherRefundEmoji=function(name, emoji){
  const st=state.students[name];
  if(!st){showToast('학생 데이터 없음');return;}
  if(!st.iconMap||!st.iconMap[emoji]){showToast('보유하지 않은 이모지입니다.');return;}
  const refundAmt=emojiPrice(emoji);
  openModal(`🎨 이모지 회수`,`
    <div style="text-align:center;padding:.5rem 0 .8rem;">
      <div style="font-size:3rem;margin-bottom:.3rem;">${emoji}</div>
      <div style="font-weight:700;font-size:.95rem;">${name} · ${emoji} 회수</div>
      <div style="font-size:.82rem;color:var(--g500);margin-top:.2rem;">원래 가격 ${fE(refundAmt)} 환불</div>
    </div>
  `,[
    {l:'회수 & 환불',c:'bdan',f:async()=>{
      // iconMap에서 제거
      delete st.iconMap[emoji];
      st.iconList=Object.keys(st.iconMap).filter(e=>e&&e.trim());
      // 현재 장착 이모지면 기본으로
      if(st.customEmoji===emoji) st.customEmoji=null;
      // 잔액 환불
      st.bal=parseFloat(((st.bal||0)+refundAmt).toFixed(2));
      st.iconSpent=Math.max(0,(st.iconSpent||0)-refundAmt);
      st.returnExpenseExcluded=Math.max(0,(st.returnExpenseExcluded||0)-refundAmt);
      addTxLog('deposit',name,refundAmt,cu.name,`이모지 ${emoji} 회수 환불`);
      await update(ref(db,ROOT+'/students/'+name),{
        iconList:st.iconList, customEmoji:st.customEmoji||null,
        bal:st.bal, iconSpent:st.iconSpent,
        returnExpenseExcluded:st.returnExpenseExcluded
      }).catch(()=>{});
      closeModal();
      showToast(`${emoji} 회수 완료! ${fE(refundAmt)} 환불`);
      // 상세 팝업 재오픈
      setTimeout(()=>showStudentDetail(name),200);
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
};

// ── TX HISTORY (거래 내역 — 학생용)
function rTxHistory(el){
  const st=state.students[cu.name];
  // 학생 자신의 txLog: state에 메모리 캐시된 것 우선, 없으면 state.txLog 필터
  const myTx=(st.txLog||[]).length>0
    ? st.txLog
    : (state.txLog||[]).filter(t=>t.name===cu.name);

  // 주식 보유 현황 카드
  let h=`<div class="card"><div class="ct">📊 보유 주식 현황</div>`;
  let hasTrade=false;
  STOCKS.forEach(s=>{
    const q=st.hld[s.id]||0, ac=st.cb[s.id]||0;
    if(q>0){
      hasTrade=true;
      const val=q*state.stocks[s.id].price;
      const cost=q*ac;
      const pnl=val-cost;
      const pct=cost>0?(pnl/cost*100):0;
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:.6rem;border-radius:10px;background:var(--g50);margin-bottom:.4rem;">
        <div style="display:flex;align-items:center;gap:.55rem;">
          <span style="font-size:1.5rem;">${s.emoji}</span>
          <div>
            <div style="font-weight:600;font-size:.88rem;">${s.name}</div>
            <div class="txs tg">${q}주 · 평단 ${fE2(ac)}</div>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700;font-size:.9rem;">${fE2(val)}</div>
          <div style="font-size:.78rem;font-weight:600;color:${pnl>=0?'var(--suc)':'var(--dan)'};">${pnl>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% (${pnl>=0?'+':''}${fE2(pnl)})</div>
        </div>
      </div>`;
    }
  });
  if(!hasTrade) h+=`<div class="empty">보유 주식이 없습니다.</div>`;
  h+=`</div>`;

  // 거래 기록 카드
  h+=`<div class="card"><div class="ct">📋 거래 내역 ${myTx.length>0?`<span class="txs tg" style="font-weight:400;">(${myTx.length}건)</span>`:''}</div>`;
  if(!myTx.length){
    h+=`<div class="empty">아직 거래 기록이 없습니다.</div>`;
  } else {
    myTx.slice(0,50).forEach(tx=>{
      const isIn=tx.type==='deposit';
      const note=tx.note||'';
      // 거래 종류 분류
      let icon,label;
      if(note.includes('매수')){icon='📈';label='주식 매수';}
      else if(note.includes('매도')){icon='📉';label='주식 매도';}
      else if(note.includes('이모지')&&note.includes('구매')){icon='🎨';label='이모지 구매';}
      else if(note.includes('이모지')&&note.includes('구입권')){icon='🎟️';label='구입권 사용';}
      else if(note.includes('이모지')&&note.includes('회수')){icon='↩️';label='이모지 회수';}
      else if(note.includes('기부')){icon='💚';label='기부';}
      else if(note.includes('토지')||note.includes('부동산')){icon='🏙️';label='부동산';}
      else if(note.includes('건설')){icon='🏗️';label='건물 건설';}
      else if(note.includes('복권')){icon='🎉';label='복권 당첨';}
      else if(note.includes('예금')||note.includes('적금')){icon='🏦';label='예금';}
      else if(note.includes('P2P')){icon='🤝';label='P2P 거래';}
      else if(note.includes('일괄')){icon='💼';label='일괄 처리';}
      else if(note.includes('수익')||note.includes('일일')){icon='📅';label='일일 수익';}
      else{icon=isIn?'📥':'📤';label=isIn?'입금':'출금';}

      const amtColor=isIn?'var(--suc)':'var(--dan)';
      const amtPrefix=isIn?'+':'−';
      h+=`<div style="display:flex;align-items:center;gap:.65rem;padding:.5rem 0;border-bottom:1px solid var(--g200);">
        <span style="font-size:1.2rem;flex-shrink:0;">${icon}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:.82rem;color:${amtColor};">${label}</div>
          <div class="txs tg" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(note)||tx.date}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-weight:700;font-size:.85rem;color:${amtColor};">${tx.amt>0?amtPrefix+fE(tx.amt):'−'}</div>
          <div class="txs tg">${tx.date}</div>
        </div>
      </div>`;
    });
    if(myTx.length>50) h+=`<div class="txs tg" style="text-align:center;padding:.5rem;">최근 50건만 표시</div>`;
  }
  h+=`</div>`;
  el.innerHTML=h;
}

}

// 도시 데이터 (한반도 3×3 배치: 북→남, 서→동)
// 행0: 인천  강원  (강원은 오른쪽위)
// 행1: 서울  세종  대전
// 행2: 광주  대구  부산
// 행3: 제주  (아래)
// 실제 3×3 배치:
// [인천][강원][  ]  → row0: 인천(0,0), 강원(0,1), 빈칸(0,2)
// [서울][세종][대전] → row1: 서울(1,0), 세종(1,1), 대전(1,2)
// [광주][대구][부산] → row2: 광주(2,0), 대구(2,1), 부산(2,2)
// → 제주는 row2의 특별칸으로 처리 (광주 아래) 또는 광주 자리
// 최종 3×3:
// [강원][인천][  빈  ]
// [서울][세종][대전   ]
// [광주][대구][부산   ]
// + 제주는 광주 대신 row2, col0 or 별도 위치
// ── 실제 배치 (한반도 직관적 3×3+1):
// row0: 인천 / 강원 / (빈칸→제주는 하단)
// row1: 서울 / 세종 / 대전
// row2: 광주 / 대구 / 부산
// 제주는 별도 행(row3) col0 — 총 10칸 중 9칸 활용
// 하지만 3×3 = 9칸 정확히 맞추기 위해:
// [강원][인천][  ]    → 인천(0,0) 강원(0,1) 빈칸없음→제주(0,2)
// [서울][세종][대전]
// [광주][대구][부산]
// 그래서 실제로 4행 필요 (제주 별도). 4×3에서 1칸 비워 9칸.
// 간단하게: 3×3 = 9칸에 9개 도시 그냥 넣기 (직관 배치)

// 부동산 수익 수령 가능 날짜 계산 (오늘 포함 최근 3일, 미수령만, 구매 다음날부터)
function reClaimableDates(){
  const st=state.students?.[cu.name];
  const claimed=st?.reIncomeClaimed||{};
  const myPlots=reMyPlots();
  if(!myPlots.length) return [];

  // 가장 이른 구매일 다음날을 기준으로 (땅마다 다를 수 있으니 날짜별로 체크)
  const today=kst();
  const result=[];

  for(let i=0;i<3;i++){
    const d=new Date(today);
    d.setDate(today.getDate()-i);
    const dStr2=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(claimed[dStr2]) continue; // 이미 수령

    // 이 날짜에 수익을 받을 수 있는 땅이 하나라도 있는지 확인
    // 조건: 해당 날짜보다 구매일(boughtAt)이 하루 이상 이전이어야 함
    const hasEligiblePlot=myPlots.some(p=>{
      if(!p.boughtAt) return false;
      const bought=new Date(p.boughtAt);
      // 구매일 다음날 자정부터 수령 가능
      const eligibleFrom=new Date(bought);
      eligibleFrom.setDate(eligibleFrom.getDate()+1);
      eligibleFrom.setHours(0,0,0,0);
      d.setHours(0,0,0,0);
      return d>=eligibleFrom;
    });

    if(hasEligiblePlot) result.push(dStr2);
  }
  return result;
}

// 수익 수령 실행
window.reClaimIncome=async function(){
  const myPlots=reMyPlots();
  if(!myPlots.length){showToast('소유한 부동산이 없습니다.');return;}
  const dates=reClaimableDates();
  if(!dates.length){showToast('수령할 수익이 없습니다. 구매 당일은 수익이 없으며 다음날부터 수령 가능합니다.');return;}

  // 땅별·날짜별로 정확히 계산 (구매일 이후 날짜만)
  let totalIncome=0;
  const breakdown=[];
  myPlots.forEach(p=>{
    const city=RE_CITY_MAP[p.id];
    if(!city||!p.boughtAt) return;
    const bv=reBuildingInfo(p.building,p.id);
    const inc=bv?bv.income:reCityIncome(p.id);
    const bought=new Date(p.boughtAt);
    const eligibleFrom=new Date(bought);
    eligibleFrom.setDate(eligibleFrom.getDate()+1);
    eligibleFrom.setHours(0,0,0,0);
    let plotDays=0;
    dates.forEach(dStr2=>{
      const d=new Date(dStr2+'T00:00:00');
      if(d>=eligibleFrom) plotDays++;
    });
    if(plotDays>0){
      const plotIncome=parseFloat((inc*plotDays).toFixed(2));
      totalIncome+=plotIncome;
      breakdown.push({emoji:bv?bv.emoji:city.emoji, name:city.name+(bv?' · '+bv.name:''), inc, days:plotDays, total:plotIncome});
    }
  });
  totalIncome=parseFloat(totalIncome.toFixed(2));
  if(totalIncome<=0){showToast('수령할 수익이 없습니다. 구매 당일은 수익이 없습니다.');return;}

  const dateLabels=dates.map(d=>{ const p=d.split('-'); return p[1]+'/'+p[2]; }).join(', ');

  openModal('🏘️ 부동산 수익 수령',`
    <div style="text-align:center;padding:.5rem 0 .75rem;">
      <div style="font-size:2.5rem;margin-bottom:.4rem;">🏘️</div>
      <div style="font-size:1rem;font-weight:700;margin-bottom:.3rem;">${fE(totalIncome)} 수령 가능</div>
      <div style="font-size:.8rem;color:var(--g600);margin-bottom:.5rem;">${dateLabels}</div>
      <div style="background:var(--g50);border-radius:10px;padding:.55rem .75rem;text-align:left;">
        ${breakdown.map(b=>'<div style="font-size:.8rem;color:var(--g700);padding:.15rem 0;">'+b.emoji+' '+b.name+' — '+fE(b.inc)+'/일 × '+b.days+'일 = +'+fE(b.total)+'</div>').join('')}
      </div>
      <div style="font-size:.7rem;color:var(--g500);margin-top:.4rem;">* 구매 당일은 수익 없음 · 다음날부터 수령 가능 · 3일 이후 소멸</div>
    </div>
  `,[
    {l:'💰 수령하기',c:'bsuc',f:async()=>{
      const st=state.students[cu.name];
      if(!st){closeModal();return;}
      if(!st.reIncomeClaimed) st.reIncomeClaimed={};
      st.bal=parseFloat((st.bal+totalIncome).toFixed(2));
      const claimedUpd={};
      dates.forEach(d=>{ st.reIncomeClaimed[d]=true; claimedUpd['reIncomeClaimed/'+d]=true; });
      addTxLog('deposit',cu.name,totalIncome,'시스템','부동산 수익 수령 ('+dateLabels+')');
      await update(ref(db,ROOT+'/students/'+cu.name),{bal:st.bal,...claimedUpd}).catch(()=>{});
      closeModal();
      showToast('💰 '+fE(totalIncome)+' 수령 완료!');
      rRealestate(document.getElementById('tab-realestate'));
    }},
    {l:'나중에',c:'bs',f:closeModal}
  ]);
};

// 슬롯 → 층(1~5) → 등급(top/mid/bottom) → 월 입점 수수료
function deptFloorOf(slotId){ const n=parseInt(String(slotId).replace('slot',''),10); return Math.ceil(n/2); }
function deptFloorTier(slotId){ const f=deptFloorOf(slotId); if(f===5) return 'top'; if(f===1) return 'bottom'; return 'mid'; }
// 교사 설정값 우선, 없으면 기본값 사용
function deptFees(){
  const s=state.dept?.settings?.fees;
  return {
    top: s?.top ?? DEPT_FEE_TOP_DEFAULT,
    mid: s?.mid ?? DEPT_FEE_MID_DEFAULT,
    bottom: s?.bottom ?? DEPT_FEE_BOTTOM_DEFAULT
  };
}
function deptFeeForSlot(slotId){ const t=deptFloorTier(slotId); const f=deptFees(); return t==='top'?f.top:(t==='bottom'?f.bottom:f.mid); }
function deptTierLabel(tier){ return tier==='top'?'탑층':tier==='bottom'?'바닥층':'중층'; }

  gold :['#854d0e','#eab308'], sky:['#0c4a6e','#0ea5e9'], rose:['#881337','#fb7185']
};
function deptStores(){ return state.dept?.stores||{}; }
function deptApps(){ return state.dept?.applications||{}; }
function deptEmptySlots(){
  const s=deptStores(); const out=[];
  for(let i=1;i<=DEPT_SLOTS;i++){ const k='slot'+i; if(!s[k]) out.push(k); }
  return out;
}

function deptMyStore(name){
  const s=deptStores();

    const st=s[k]; if(!st) return false;

}

  if(!isTeacher){
    if(my){
      h+=`<div style="background:var(--sl);border:1.5px solid var(--suc);border-radius:12px;padding:.6rem .8rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem;cursor:pointer;" onclick="window.deptOpen('${my.slotId}')">
        <span style="font-size:1.3rem;">🏪</span>
        <div style="flex:1;">
          <div style="font-size:.85rem;font-weight:700;color:var(--suc);">내 사업체: ${escHtml(my.name)}</div>
          <div style="font-size:.72rem;color:var(--g600);">사업체 잔액 ${fE(my.balance||0)} · 탭해서 관리하기</div>
        </div>
        <span style="color:var(--g400);">›</span>
      </div>`;
    } else {
      const myPending=Object.values(deptApps()).find(a=>a.status==='pending'&&(a.ceo===cu.name||(a.partners||[]).includes(cu.name)));
      if(myPending){
        h+=`<div style="background:#fef3c7;border-radius:12px;padding:.6rem .8rem;margin-bottom:.6rem;font-size:.8rem;color:#92400e;">
          ⏳ <strong>${escHtml(myPending.name)}</strong> 사업계획서 심의 중입니다. 선생님의 승인을 기다려 주세요.
        </div>`;
      } else if(empty===0){
        h+=`<div style="background:var(--g50);border-radius:12px;padding:.6rem .8rem;margin-bottom:.6rem;font-size:.8rem;color:var(--g600);text-align:center;">
          🈵 현재 만점포입니다. 공실이 생기면 창업 신청을 할 수 있어요.
        </div>`;
      } else {
        h+=`<button class="btn bsm" style="width:100%;padding:.75rem;margin-bottom:.6rem;background:linear-gradient(135deg,#5b21b6,#8b5cf6);color:white;border:none;border-radius:12px;font-size:.9rem;font-weight:700;" onclick="window.deptOpenApply()">
          🏢 창업 신청 (사업계획서 제출) · 공실 ${empty}칸
        </button>`;
      }
    }
  }

  // ── 층별 디렉토리: 5개 층 × 2매장 (slot→층 매핑만, 데이터 구조 불변) ──
  const FLOOR_THEMES=['5F 하늘정원','4F 럭셔리관','3F 라이프스타일','2F 델리&푸드','1F 그랜드홀'];
  h+=`<div class="dept-floors">`;
  for(let floor=5;floor>=1;floor--){
    const n1=floor*2-1, n2=floor*2;
    const themeLabel=FLOOR_THEMES[5-floor];
    const spaceIdx=themeLabel.indexOf(' ');
    const fNum=themeLabel.slice(0,spaceIdx), fRest=themeLabel.slice(spaceIdx+1);
    h+=`<div class="dept-floor-row">
      <div class="dept-floor-rail"><div>${fNum}</div><div class="dfr-name">${fRest}</div></div>
      ${[n1,n2].map(i=>{
        const k='slot'+i;
        const st=stores[k];
        if(st){
          const prods=Object.values(st.products||{}).filter(p=>p&&p.active!==false).slice(0,2);
          const preview=prods.length
            ? prods.map(p=>'<div style="font-size:.68rem;color:var(--g600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+p.emoji+' '+escHtml(p.name)+'</div>').join('')
            : '<div style="font-size:.68rem;color:var(--g400);">준비 중…</div>';
          const awnColors=DEPT_SIGN_BG[st.sign&&st.sign.bg]||DEPT_SIGN_BG.brown;
          return '<div class="dept-store-card" style="--awn-c1:'+awnColors[0]+';--awn-c2:'+awnColors[1]+';" onclick="window.deptOpen(\''+k+'\')">'
            +'<div class="dept-awning"></div>'
            +'<div class="dept-window"><span class="dept-open-badge">OPEN</span>'+deptSignHtml(st.sign,st.name,false)+'</div>'
            +'<div class="dept-store-body">'
            +'<div style="font-size:.65rem;color:var(--g500);margin-bottom:.15rem;">'+stuEmoji(st.ceo)+' '+st.ceo+' 외 '+((st.partners||[]).length)+'명</div>'
            +preview+'</div></div>';
        } else {
          const slotFee=deptFeeForSlot(k);
          const canApply=!isTeacher&&!my;
          const clickAttr=canApply?' onclick="window.deptOpenApply(\''+k+'\')" style="cursor:pointer;"':'';
          return '<div class="dept-vacant-card"'+clickAttr+'>'
            +'<div style="font-size:1.1rem;opacity:.6;">🔒</div>'
            +'<div style="font-size:.68rem;font-weight:700;color:var(--g500);">'+i+'호 공실</div>'
            +'<div class="dept-vacant-tag">월 '+fE(slotFee)+(canApply?' · 탭해서 신청':'')+'</div></div>';
        }
      }).join('')}
    </div>`;
  }
  h+=`</div>`;
  el.innerHTML=h;
}
