function rDeptApplyForm(el){
  const others=realStudents().filter(s=>s.name!==cu.name&&!deptMyStore(s.name));
  const sel=window._deptPartners||[];
  const prods=window._deptProducts||[{name:'',emoji:'🍪',price:1}];
  const total=1+sel.length;
  const ok=DEPT_PARTNER_OPTIONS.includes(total);
  const selectedSlot=window._deptDesiredSlot||null;
  const selectedFee=selectedSlot?deptFeeForSlot(selectedSlot):null;
  const feeEach=(ok&&selectedFee)?fE(selectedFee/total):'—';
  // 이모지 포함 문자열 + 연산은 템플릿 리터럴 밖에서 미리 조립 (파서 오류 방지)
  const okMsgYes='가능 · 1인당 입점 수수료(월) '+feeEach+' · 수익도 1/'+total;
  const okMsgNo=selectedSlot?'1·2·3·4명만 가능합니다':'먼저 원하는 위치를 선택해주세요';
  const okMsg=(ok&&selectedSlot)?okMsgYes:okMsgNo;
  const okMark=(ok&&selectedSlot)?'✓':'✗';

  // 위치 선택 그리드: 공실만 표시, 층별 등급/수수료 안내
  const emptySlots=deptEmptySlots();
  let locHtml='';

    locHtml='<div style="font-size:.8rem;color:var(--dan);padding:.5rem;text-align:center;">현재 공실이 없습니다.</div>';
  } else {
    const byFloor={};
    emptySlots.forEach(k=>{ const f=deptFloorOf(k); (byFloor[f]=byFloor[f]||[]).push(k); });
    const floorNums=Object.keys(byFloor).map(Number).sort((a,b)=>b-a);
    locHtml=floorNums.map(f=>{
      const tier=f===5?'top':(f===1?'bottom':'mid');
      const fee=deptFeeForSlot('slot'+(f*2));
      const tierLabel=deptTierLabel(tier);
      const btns=byFloor[f].map(k=>{
        const on=selectedSlot===k;
        const no=k.replace('slot','');
        return '<button onclick="window.deptSelectSlot(\''+k+'\')" style="flex:1;padding:.5rem .3rem;border:1.5px solid '+(on?'var(--primary)':'var(--g200)')+';background:'+(on?'var(--pl)':'var(--g50)')+';border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:700;color:'+(on?'var(--primary)':'var(--g700)')+';">'+no+'호</button>';
      }).join('');
      return '<div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;">'
        +'<div style="width:70px;font-size:.68rem;color:var(--g500);text-align:right;">'+f+'F '+tierLabel+'<br/><strong style="color:var(--g700);">'+fE(fee)+'</strong></div>'
        +'<div style="flex:1;display:flex;gap:.3rem;">'+btns+'</div></div>';
    }).join('');
  }

  let h=`<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;">
    <button onclick="window.deptBack()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--g600);">←</button>
    <div style="font-size:.95rem;font-weight:800;">🏢 사업계획서</div>
  </div>

  <div class="card">
    <div class="fg" style="margin-bottom:.3rem;"><label>📍 희망 위치 선택 (탑층 5F ${deptFees().top} · 중층 2~4F ${deptFees().mid} · 바닥층 1F ${deptFees().bottom})</label>
      <div style="background:var(--g50);border-radius:10px;padding:.5rem;">${locHtml}</div>
    </div>
  </div>

  <div class="card">
    <div class="fg"><label>사업체명 (12자)</label>
      <input type="text" id="dpName" maxlength="12" value="${escHtml(window._deptName||'')}" placeholder="예: 달콤 쿠키공방"
        oninput="window._deptName=this.value" style="width:100%;padding:.55rem .7rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.9rem;font-family:inherit;box-sizing:border-box;"/>
    </div>
    <div class="fg"><label>대표</label>
      <div style="font-size:.88rem;font-weight:600;padding:.45rem .7rem;background:var(--g50);border-radius:10px;">${stuEmoji(cu.name)} ${dispName(cu.name)}</div>
    </div>
    <div class="fg" style="margin-bottom:.3rem;"><label>동업자 선택 (총 인원 1·2·3·4명만 가능)</label>
      <div style="display:flex;flex-wrap:wrap;gap:.3rem;max-height:150px;overflow-y:auto;padding:.35rem;background:var(--g50);border-radius:10px;">
        ${others.map(s=>{
          const on=sel.includes(s.name);
          return `<button onclick="window.deptTogglePartner('${s.name}')" style="padding:.3rem .5rem;border:1.5px solid ${on?'var(--primary)':'var(--g200)'};background:${on?'var(--pl)':'white'};border-radius:20px;font-size:.75rem;cursor:pointer;color:${on?'var(--primary)':'var(--g600)'};font-weight:${on?'700':'400'};">${stuEmoji(s.name)} ${s.name}</button>`;
        }).join('')}
      </div>
    </div>
    <div style="font-size:.78rem;padding:.4rem .6rem;border-radius:8px;margin-bottom:.55rem;background:${(ok&&selectedSlot)?'var(--sl)':'var(--dl)'};color:${(ok&&selectedSlot)?'var(--suc)':'var(--dan)'};font-weight:600;">
      총 ${total}명 ${okMark} ${okMsg}
    </div>
    <div class="fg"><label>사업 아이템 설명 (100자)</label>
      <textarea id="dpDesc" rows="2" maxlength="100" placeholder="무엇을 왜 파는지 적어 주세요" oninput="window._deptDesc=this.value"
        style="width:100%;padding:.55rem .7rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.85rem;font-family:inherit;resize:none;box-sizing:border-box;">${escHtml(window._deptDesc||'')}</textarea>
    </div>
  </div>

  <div class="card">
    <div class="ct">🛒 판매 품목 (최대 5개 · 개당 ${DEPT_MAX_PRICE}조개 이하)</div>`;
  prods.forEach((p,i)=>{
    h+=`<div style="display:flex;gap:.3rem;align-items:center;margin-bottom:.35rem;">
      <div style="width:54px;">${deptEmojiSelectHtml('dpProdEmoji'+i, p.emoji, "window.deptEditProd("+i+",'emoji',this.value)")}</div>
      <input type="text" value="${escHtml(p.name)}" maxlength="14" placeholder="품목명" oninput="window.deptEditProd(${i},'name',this.value)"
        style="flex:1;padding:.45rem .6rem;border:1.5px solid var(--g200);border-radius:8px;font-size:.85rem;font-family:inherit;"/>
      <input type="number" value="${p.price}" min="1" max="${DEPT_MAX_PRICE}" step="1" oninput="window.deptEditProd(${i},'price',this.value)"
        style="width:64px;text-align:center;padding:.45rem .2rem;border:1.5px solid var(--g200);border-radius:8px;font-size:.85rem;font-family:inherit;"/>
      ${prods.length>1?`<button onclick="window.deptDelProd(${i})" style="background:none;border:none;cursor:pointer;color:var(--g400);font-size:.95rem;">✕</button>`:''}
    </div>`;
  });
  if(prods.length<5) h+=`<button class="btn bs bsm" style="width:100%;margin-top:.2rem;" onclick="window.deptAddProd()">＋ 품목 추가</button>`;
  h+=`</div>

  <div style="display:flex;gap:.4rem;margin-top:.5rem;">
    <button class="btn bs" style="flex:1;" onclick="window.deptBack()">취소</button>
    <button class="btn bsuc" style="flex:2;" onclick="window.deptSubmitApp()">📨 사업계획서 제출</button>
  </div>`;
  el.innerHTML=h;
}

window.deptOpenApply=function(preselectSlot){
  _deptView='apply';
  window._deptPartners=[]; window._deptProducts=[{name:'',emoji:'🍪',price:1}];
  window._deptName=''; window._deptDesc='';
  window._deptDesiredSlot=(typeof preselectSlot==='string')?preselectSlot:null;
  rDept(document.getElementById('tab-dept'));
};
window.deptSelectSlot=function(slotId){
  window._deptDesiredSlot=slotId;
  rDept(document.getElementById('tab-dept'));
};
window.deptBack=function(){ _deptView=null; rDept(document.getElementById('tab-dept')); };
window.deptOpen=function(slotId){ _deptView=slotId; rDept(document.getElementById('tab-dept')); };
window.deptTogglePartner=function(name){
  const s=window._deptPartners||[];
  const i=s.indexOf(name);
  if(i>=0) s.splice(i,1); else s.push(name);
  window._deptPartners=s;
  rDept(document.getElementById('tab-dept'));
};
window.deptAddProd=function(){
  const p=window._deptProducts||[];
  if(p.length>=5) return;
  p.push({name:'',emoji:'🍬',price:1});
  window._deptProducts=p;
  rDept(document.getElementById('tab-dept'));
};
window.deptDelProd=function(i){
  const p=window._deptProducts||[];
  p.splice(i,1);
  window._deptProducts=p;
  rDept(document.getElementById('tab-dept'));
};
window.deptEditProd=function(i,field,val){
  const p=window._deptProducts||[];
  if(!p[i]) return;
  if(field==='price'){
    let v=parseInt(val)||1;
    p[i].price=Math.max(1,Math.min(DEPT_MAX_PRICE,v));
  } else p[i][field]=val;
};

window.deptSubmitApp=async function(){
  if(_deptApplying) return;
  const name=(window._deptName||'').trim();
  const desc=(window._deptDesc||'').trim();
  const partners=(window._deptPartners||[]).slice();
  const prods=(window._deptProducts||[]).filter(p=>p.name&&p.name.trim());
  const total=1+partners.length;
  const desiredSlot=window._deptDesiredSlot||null;
  if(!desiredSlot){showToast('희망 위치를 먼저 선택해주세요.');return;}
  if(deptStores()[desiredSlot]){showToast('선택한 위치가 이미 입점됐습니다. 다른 위치를 선택해주세요.');return;}
  if(!name){showToast('사업체명을 입력해주세요.');return;}
  if(!DEPT_PARTNER_OPTIONS.includes(total)){showToast('총 인원은 1·2·3·4명만 가능합니다.');return;}
  if(!desc){showToast('사업 아이템 설명을 입력해주세요.');return;}
  if(!prods.length){showToast('판매 품목을 1개 이상 입력해주세요.');return;}
  if(prods.some(p=>p.price>DEPT_MAX_PRICE||p.price<1)){showToast('품목 가격은 1~'+DEPT_MAX_PRICE+'조개여야 합니다.');return;}
  if(deptEmptySlots().length===0){showToast('현재 만점포입니다.');return;}
  // 중복 방지: 본인/동업자 중 이미 사업체 소속이 있으면 거부
  const conflict=[cu.name,...partners].find(n=>deptMyStore(n));
  if(conflict){showToast(conflict+' 학생은 이미 사업체에 소속돼 있습니다.');return;}

  _deptApplying=true;
  try{
    const ts=Date.now();
    const appId='app'+ts;
    const app={id:appId,name,ceo:cu.name,partners,itemDesc:desc,desiredSlot,
      products:prods.map(p=>({name:p.name.trim(),emoji:p.emoji||'🛒',price:parseInt(p.price)})),
      status:'pending',date:dStr(),ts:new Date().toISOString()};
    await update(ref(db,ROOT+'/dept/applications/'+appId),app).catch(()=>{});
    if(!state.dept) state.dept={};
    if(!state.dept.applications) state.dept.applications={};
    state.dept.applications[appId]=app;
    _deptView=null;
    const slotNo=desiredSlot.replace('slot','');
    const msg='사업계획서가 제출됐습니다! (희망 위치: '+slotNo+'호) 선생님의 심의를 기다려 주세요.';
    openModal('📨 제출 완료',`<div style="text-align:center;padding:1rem 0;">
      <div style="font-size:3rem;margin-bottom:.5rem;">🏢</div>
      <div style="font-size:.9rem;color:var(--g700);line-height:1.6;">${msg}</div>
    </div>`,[{l:'확인',c:'bp',f:()=>{closeModal();rDept(document.getElementById('tab-dept'));}}]);
  } finally { _deptApplying=false; }
};

// ── 교사 심의
window.deptApprove=async function(appId){
  const app=deptApps()[appId];
  if(!app||app.status!=='pending'){showToast('신청을 찾을 수 없습니다.');return;}
  const conflict=[app.ceo,...(app.partners||[])].find(n=>deptMyStore(n));
  if(conflict){showToast(conflict+' 학생은 이미 사업체 소속입니다. 반려해주세요.');return;}

  // 학생이 신청 시 선택한 희망 위치 사용 (없으면 빈 자리 중 첫 번째로 대체)
  const slotId=app.desiredSlot&&!deptStores()[app.desiredSlot]?app.desiredSlot:deptEmptySlots()[0];
  if(!slotId){showToast('빈 점포가 없습니다.');return;}
  if(app.desiredSlot&&slotId!==app.desiredSlot){
    showToast('희망하신 '+app.desiredSlot.replace('slot','')+'호는 이미 다른 사업체가 입점했습니다. 다른 자리로 배정하거나 반려해주세요.');
    return;
  }

  const prodObj={};
  (app.products||[]).forEach((p,i)=>{
    const pid='p'+(Date.now()+i);
    prodObj[pid]={name:p.name,emoji:p.emoji,price:p.price,active:true};
  });
  const store={appId,name:app.name,ceo:app.ceo,partners:app.partners||[],
    products:prodObj,
    sign:{bg:'brown',emoji:(app.products?.[0]?.emoji)||'🏪',sub:'',font:'rounded',size:'M',nameColor:'#ffffff',subColor:'#f0ead6'},
    balance:0,openedAt:new Date().toISOString(),
    lastSettleWeek:null,rentPaidMonth:null,rentOverdue:0};

  const upd={};
  upd['dept/stores/'+slotId]=store;
  upd['dept/applications/'+appId+'/status']='approved';
  upd['dept/applications/'+appId+'/slotId']=slotId;
  await update(ref(db,ROOT),upd).catch(()=>{});
  if(!state.dept) state.dept={};
  if(!state.dept.stores) state.dept.stores={};
  state.dept.stores[slotId]=store;
  if(state.dept.applications?.[appId]) state.dept.applications[appId].status='approved';

  const slotNo=slotId.replace('slot','');
  const tierLabel=deptTierLabel(deptFloorTier(slotId));
  const fee=deptFeeForSlot(slotId);
  const memo='창업 승인! 백화점 '+slotNo+'호('+tierLabel+') 점포를 배정받았습니다. 매월 입점 수수료 '+fE(fee)+'을 동업자끼리 나눠 냅니다.';
  [app.ceo,...(app.partners||[])].forEach((n,i)=>{
    const _ts=Date.now();
    const nid='noti'+(_ts+i);
    update(ref(db,ROOT+'/notifications/'+n+'/'+nid),{id:nid,type:'deposit',amt:0,memo,from:'선생님',date:dStr(),ts:new Date().toISOString(),read:false}).catch(()=>{});
  });
  showToast('✅ 승인 완료! '+slotNo+'호 배정');
  rDept(document.getElementById('tab-dept'));
};

window.deptReject=function(appId){
  const app=deptApps()[appId];
  if(!app) return;
  openModal('❌ 사업계획서 반려',`
    <p class="tsm"><strong>${escHtml(app.name)}</strong> 신청을 반려합니다.</p>
    <textarea id="dpRejReason" rows="2" maxlength="100" placeholder="반려 사유 (학생에게 전달됩니다)"
      style="width:100%;padding:.5rem .7rem;border:1.5px solid var(--g200);border-radius:10px;font-size:.85rem;font-family:inherit;resize:none;box-sizing:border-box;"></textarea>
  `,[
    {l:'반려',c:'bdan',f:async()=>{

      const nid='noti'+_ts;
      update(ref(db,ROOT+'/notifications/'+app.ceo+'/'+nid),{id:nid,type:'withdraw',amt:0,memo,from:'선생님',date:dStr(),ts:new Date().toISOString(),read:false}).catch(()=>{});
      closeModal();showToast('반려 처리됐습니다.');
      rDept(document.getElementById('tab-dept'));
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
};

// ── 점포 상세
function rDeptStore(el,slotId){
  const st=deptStores()[slotId];
  if(!st){ _deptView=null; rDept(el); return; }
  const isTeacher=cu.type==='teacher';
  const isOwner=!isTeacher&&(st.ceo===cu.name||(st.partners||[]).includes(cu.name));
  const members=[st.ceo,...(st.partners||[])];
  const n=members.length;
  const prods=Object.entries(st.products||{}).filter(([,p])=>p);
  const slotNo=slotId.replace('slot','');

  const awnColors=DEPT_SIGN_BG[st.sign&&st.sign.bg]||DEPT_SIGN_BG.brown;
  let h=`<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;">
    <button onclick="window.deptBack()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--g600);">←</button>
    <div style="font-size:.95rem;font-weight:800;flex:1;">${escHtml(st.name)}</div>
    <span style="font-size:.72rem;color:var(--g500);">${slotNo}호</span>
  </div>

  <div class="dept-store-card" style="--awn-c1:${awnColors[0]};--awn-c2:${awnColors[1]};cursor:default;">
    <div class="dept-awning" style="height:20px;"></div>
    <div class="dept-window">${deptSignHtml(st.sign,st.name,true)}</div>
  </div>

  <div class="card" style="margin-top:.6rem;">
    <div style="font-size:.75rem;color:var(--g500);margin-bottom:.3rem;">👥 사업자 (${n}명 · 수익 1/${n} 분배)</div>
    <div style="display:flex;flex-wrap:wrap;gap:.3rem;">
      ${members.map((m,i)=>`<span style="font-size:.76rem;background:${i===0?'var(--pl)':'var(--g100)'};color:${i===0?'var(--primary)':'var(--g700)'};border-radius:20px;padding:.2rem .5rem;font-weight:${i===0?'700':'500'};">${stuEmoji(m)} ${m}${i===0?' (대표)':''}</span>`).join('')}
    </div>
  </div>

  <div class="dept-menuboard">
    <div class="dmb-title">✦ M E N U ✦</div>`;
  if(!prods.length){
    h+=`<div style="text-align:center;padding:1rem 0;color:#9ca3af;font-size:.8rem;">아직 등록된 품목이 없습니다.</div>`;
  } else {
    prods.forEach(([pid,p])=>{
      const off=p.active===false;
      const btn=isOwner
        ? `<span style="font-size:.65rem;color:#9ca3af;">내 점포</span>`
        : (isTeacher ? `<span style="font-size:.65rem;color:#9ca3af;">—</span>`
          : (off?`<span style="font-size:.65rem;color:#9ca3af;">판매중지</span>`
              :`<button class="dept-pricetag" onclick="window.deptBuy('${slotId}','${pid}')">${fE(p.price)}</button>`));
      h+=`<div class="dept-menu-item" style="opacity:${off?.5:1};">
        <span style="font-size:1.25rem;">${p.emoji||'🛒'}</span>
        <span class="dmi-name">${escHtml(p.name)}</span>
        <span class="dmi-leader"></span>
        ${isOwner||isTeacher?`<span class="dmi-price">${fE(p.price)}</span>`:''}
        ${btn}
      </div>`;
    });
  }
  h+=`</div>`;

  // 교사 전용: 연체 상태 + 폐업 처리
  if(isTeacher){
    const od=st.rentOverdue||0;
    h+=`<div class="card" style="border:1.5px solid ${od>0?'var(--dan)':'var(--g200)'};">
      <div class="ct">🔧 교사 관리</div>
      <div style="font-size:.8rem;color:var(--g700);margin-bottom:.15rem;">사업체 계좌: <strong>${fE(st.balance||0)}</strong></div>
      <div style="font-size:.8rem;color:${od>0?'var(--dan)':'var(--g600)'};margin-bottom:.5rem;">
        입점 수수료 연체: <strong>${od}개월</strong>${od>=2?' ⚠️ 퇴점 검토 대상':''}
      </div>
      <button class="btn bdan bsm" style="width:100%;" onclick="window.deptClose('${slotId}')">🚪 폐업 처리 (잔액 최종 분배 후 점포 비움)</button>
    </div>`;
  }

  // 동업자 관리 섹션 — 누적금액 · 1인당 예상 배당 · 판매 통계
  if(isOwner){
    const bal=st.balance||0;
    const fee=deptFeeForSlot(slotId);
    const feeDue=st.rentPaidMonth!==(kst().getFullYear()+'-'+String(kst().getMonth()+1).padStart(2,'0'));
    const balAfterFee=feeDue?Math.max(0,bal-fee):bal;
    const estTax=Math.round(balAfterFee*DEPT_TAX_RATE);
    const estAfterTax=balAfterFee-estTax;
    const estShare=Math.max(0,Math.floor(estAfterTax/n));
    h+=`<div class="card" style="border:1.5px solid var(--suc);">
      <div class="ct" style="color:var(--suc);">🔑 사업체 관리</div>
      <div style="background:var(--sl);border-radius:10px;padding:.6rem .75rem;margin-bottom:.5rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:.72rem;color:var(--g600);">사업체 누적 계좌</div>
            <div style="font-size:1.15rem;font-weight:800;color:var(--suc);">${fE(bal)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:.72rem;color:var(--g600);">1인당 예상 배당(이번 주)</div>
            <div style="font-size:1.05rem;font-weight:800;color:var(--primary);">${fE(estShare)}</div>
          </div>
        </div>
        <div style="font-size:.68rem;color:var(--g500);margin-top:.4rem;line-height:1.5;border-top:1px dashed var(--g200);padding-top:.35rem;">
          ${feeDue?('이번 달 입점 수수료 '+fE(fee)+' 차감 예정 → '):''}세금 20%(약 ${fE(estTax)}) 차감 후 1/${n} 분배 · ${DEPT_MIN_PAYOUT}조개 미만이면 이월
        </div>
      </div>
      <div style="display:flex;gap:.35rem;margin-bottom:.35rem;">
        <button class="btn bp bsm" style="flex:1;" onclick="window.deptEditSign('${slotId}')">🎨 간판 편집</button>
        <button class="btn bs bsm" style="flex:1;" onclick="window.deptManageProds('${slotId}')">🛒 품목 관리</button>
      </div>
      <button class="btn bsm" style="width:100%;background:var(--g800);color:white;border:none;" onclick="window.deptShowStats('${slotId}')">📊 판매 통계 보기</button>
    </div>`;
  }
  el.innerHTML=h;
}

// ── 간판 편집 (조합형 — 이미지 없음, 트래픽 0)

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;">${fontBtns}</div>
    </div>
    <div class="fg"><label>글씨 크기</label>
      <div style="display:flex;gap:.3rem;">${sizeBtns}</div>
    </div>
    <div style="display:flex;gap:.4rem;">
      <div class="fg" style="width:64px;"><label>이모지</label>
        <input type="text" id="dpSignEmoji" maxlength="2" value="${escHtml(window._dpSign.emoji)}" oninput="window.dpSetEmoji(this.value)"
          style="width:100%;text-align:center;padding:.5rem .2rem;border:1.5px solid var(--g200);border-radius:8px;font-size:1.1rem;"/>
      </div>
      <div class="fg" style="width:56px;"><label>이름색</label>
        <input type="color" id="dpSignNameColor" value="${window._dpSign.nameColor}" oninput="window.dpSetNameColor(this.value)"
          style="width:100%;height:38px;padding:.15rem;border:1.5px solid var(--g200);border-radius:8px;cursor:pointer;background:var(--card);"/>
      </div>
      <div class="fg" style="width:56px;"><label>부제색</label>
        <input type="color" id="dpSignSubColor" value="${window._dpSign.subColor}" oninput="window.dpSetSubColor(this.value)"
          style="width:100%;height:38px;padding:.15rem;border:1.5px solid var(--g200);border-radius:8px;cursor:pointer;background:var(--card);"/>
      </div>
      <div class="fg" style="flex:1;"><label>부제 (15자)</label>
        <input type="text" id="dpSignSub" maxlength="15" value="${escHtml(window._dpSign.sub)}" placeholder="예: 갓 구운 쿠키" oninput="window.dpSetSub(this.value)"
          style="width:100%;padding:.5rem .6rem;border:1.5px solid var(--g200);border-radius:8px;font-size:.85rem;font-family:inherit;box-sizing:border-box;"/>
      </div>
    </div>
  `,[
    {l:'저장',c:'bsuc',f:async()=>{
      const sign=window._dpSign;
      await update(ref(db,ROOT+'/dept/stores/'+slotId+'/sign'),sign).catch(()=>{});
      if(state.dept?.stores?.[slotId]) state.dept.stores[slotId].sign=sign;
      closeModal();showToast('🎨 간판이 저장됐습니다!');
      rDept(document.getElementById('tab-dept'));
    }},{l:'취소',c:'bs',f:closeModal}

};
function dpRefreshSignPreview(slotId){

window.dpSetEmoji=function(v){ window._dpSign.emoji=v||'🏪'; dpRefreshSignPreview(); };
window.dpSetSub=function(v){ window._dpSign.sub=v; dpRefreshSignPreview(); };
window.dpSetFont=function(k){

  Object.keys(DEPT_SIGN_FONTS).forEach(x=>{
    const b=document.getElementById('dpFont-'+x);

    const sel=(x===k);

// ── 품목 관리
window.deptManageProds=function(slotId){
  const st=deptStores()[slotId];
  if(!st) return;
  const prods=Object.entries(st.products||{});
  let body=prods.map(([pid,p])=>{
    const off=p.active===false;
    return `<div style="display:flex;align-items:center;gap:.4rem;padding:.4rem 0;border-bottom:1px solid var(--g100);opacity:${off?.55:1};">
      <span style="font-size:1.2rem;">${p.emoji}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:.85rem;font-weight:600;">${escHtml(p.name)}</div>
        <div style="font-size:.75rem;color:var(--primary);">${fE(p.price)}</div>
      </div>
      <button class="btn bsm ${off?'bsuc':'bs'}" style="font-size:.7rem;padding:.25rem .5rem;" onclick="window.deptToggleProd('${slotId}','${pid}',${off})">${off?'재개':'중지'}</button>
      <button class="btn bsm bdan" style="font-size:.7rem;padding:.25rem .45rem;" onclick="window.deptRemoveProd('${slotId}','${pid}')">✕</button>
    </div>`;
  }).join('');
  if(!prods.length) body='<div class="empty" style="padding:1rem 0;">품목이 없습니다.</div>';
  openModal('🛒 품목 관리',`
    ${body}
    ${prods.length<5?`<div style="margin-top:.6rem;padding-top:.5rem;border-top:1.5px dashed var(--g200);">
      <div style="font-size:.75rem;font-weight:700;color:var(--g700);margin-bottom:.35rem;">＋ 품목 추가 (${DEPT_MAX_PRICE}조개 이하)</div>
      <div style="display:flex;gap:.3rem;">
        <div style="width:54px;">${deptEmojiSelectHtml('dpNewEmoji','🛒','')}</div>
        <input type="text" id="dpNewName" maxlength="14" placeholder="품목명" style="flex:1;padding:.45rem .6rem;border:1.5px solid var(--g200);border-radius:8px;font-size:.85rem;font-family:inherit;"/>
        <input type="number" id="dpNewPrice" min="1" max="${DEPT_MAX_PRICE}" value="1" style="width:60px;text-align:center;padding:.45rem .2rem;border:1.5px solid var(--g200);border-radius:8px;font-size:.85rem;font-family:inherit;"/>
        <button class="btn bsuc bsm" style="font-size:.75rem;" onclick="window.deptAddProdLive('${slotId}')">추가</button>
      </div>
    </div>`:''}
  `,[{l:'닫기',c:'bs',f:closeModal}]);
};
window.deptToggleProd=async function(slotId,pid,turnOn){
  const p=state.dept?.stores?.[slotId]?.products?.[pid];
  if(!p) return;
  p.active=!!turnOn;
  await update(ref(db,ROOT+'/dept/stores/'+slotId+'/products/'+pid),{active:!!turnOn}).catch(()=>{});
  closeModal(); showToast(turnOn?'판매를 재개했습니다.':'판매를 중지했습니다.');
  rDept(document.getElementById('tab-dept'));
};
window.deptRemoveProd=async function(slotId,pid){
  const st=state.dept?.stores?.[slotId];
  if(!st?.products) return;
  delete st.products[pid];
  await set(ref(db,ROOT+'/dept/stores/'+slotId+'/products/'+pid),null).catch(()=>{});
  closeModal(); showToast('품목이 삭제됐습니다.');
  rDept(document.getElementById('tab-dept'));
};
window.deptAddProdLive=async function(slotId){
  const st=state.dept?.stores?.[slotId];
  if(!st) return;
  const name=document.getElementById('dpNewName')?.value.trim();
  const emoji=document.getElementById('dpNewEmoji')?.value.trim()||'🛒';
  let price=parseInt(document.getElementById('dpNewPrice')?.value)||1;
  price=Math.max(1,Math.min(DEPT_MAX_PRICE,price));
  if(!name){showToast('품목명을 입력해주세요.');return;}
  if(Object.keys(st.products||{}).length>=5){showToast('품목은 최대 5개입니다.');return;}
  const pid='p'+Date.now();
  const prod={name,emoji,price,active:true};
  if(!st.products) st.products={};
  st.products[pid]=prod;
  await update(ref(db,ROOT+'/dept/stores/'+slotId+'/products/'+pid),prod).catch(()=>{});
  closeModal(); showToast('품목이 추가됐습니다.');
  rDept(document.getElementById('tab-dept'));
};

// ── 구매 (Phase 3)
let _deptBuying=false;
window.deptBuy=function(slotId,pid){
  const st=deptStores()[slotId];
  const p=st?.products?.[pid];
  if(!st||!p||p.active===false){showToast('구매할 수 없는 품목입니다.');return;}
  if(st.ceo===cu.name||(st.partners||[]).includes(cu.name)){showToast('내 점포의 물건은 구매할 수 없습니다.');return;}
  const me=state.students[cu.name];
  if(!me||(me.bal||0)<p.price){showToast('잔액이 부족합니다. 필요: '+fE(p.price));return;}
  openModal('🛒 구매 확인',`
    <div style="text-align:center;padding:.6rem 0;">
      <div style="font-size:2.8rem;">${p.emoji}</div>
      <div style="font-size:1rem;font-weight:700;margin-top:.25rem;">${escHtml(p.name)}</div>
      <div style="font-size:.78rem;color:var(--g500);">${escHtml(st.name)}</div>
      <div style="font-size:1.35rem;font-weight:800;color:var(--primary);margin-top:.45rem;">${fE(p.price)}</div>
      <div style="font-size:.75rem;color:var(--g500);margin-top:.3rem;">구매 후 잔액: ${fE2((me.bal||0)-p.price)}</div>
    </div>
  `,[
    {l:'구매하기',c:'bsuc',f:async()=>{
      if(_deptBuying){showToast('처리 중입니다.');return;}
      _deptBuying=true;
      try{
        // 1) 구매자 잔액 차감 (원자적)
        const buyerRef=ref(db,ROOT+'/students/'+cu.name);
        const tx=await runTransaction(buyerRef,(cur)=>{
          if(!cur) return cur;
          if((cur.bal||0)<p.price) return;
          cur.bal=parseFloat(((cur.bal||0)-p.price).toFixed(2));
          return cur;
        });
        if(!tx.committed){showToast('잔액이 부족합니다.');_deptBuying=false;return;}
        if(me) me.bal=tx.snapshot.val()?.bal??me.bal;
        // 2) 사업체 계좌 가산 (원자적)
        const balRef=ref(db,ROOT+'/dept/stores/'+slotId+'/balance');
        await runTransaction(balRef,(cur)=>parseFloat((((cur||0))+p.price).toFixed(2))).catch(()=>{});
        if(state.dept?.stores?.[slotId]) state.dept.stores[slotId].balance=parseFloat(((st.balance||0)+p.price).toFixed(2));
        // 3) 판매 기록 + 거래내역
        const _ts=Date.now();
        const sale={buyer:cu.name,prodName:p.name,emoji:p.emoji,price:p.price,date:dStr(),ts:new Date().toISOString()};
        update(ref(db,ROOT+'/dept/sales/'+slotId+'/tx'+_ts),sale).catch(()=>{});
        addTxLog('withdraw',cu.name,p.price,cu.name,st.name+' - '+p.name+' 구매');
        // 4) 대표에게 판매 알림
        const memo=st.name+' 매출 발생: '+p.name+' '+fE(p.price);
        const nid='noti'+_ts;
        update(ref(db,ROOT+'/notifications/'+st.ceo+'/'+nid),{id:nid,type:'deposit',amt:0,memo,from:'시스템',date:dStr(),ts:new Date().toISOString(),read:false}).catch(()=>{});
        closeModal();
        showToast('🛒 구매 완료! '+p.emoji+' '+p.name);
        rDept(document.getElementById('tab-dept'));
      }catch(e){showToast('구매 처리 중 오류가 발생했습니다.');}
      finally{_deptBuying=false;}
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
};

window.deptShowStats=async function(slotId){
  const st=deptStores()[slotId];
  if(!st) return;
  openModal('📊 판매 통계 불러오는 중…','<div style="text-align:center;padding:2rem 0;color:var(--g500);">잠시만 기다려주세요…</div>',[{l:'닫기',c:'bs',f:closeModal}]);
  let sales=[];
  try{
    const snap=await get(ref(db,ROOT+'/dept/sales/'+slotId));
    if(snap.exists()){
      const raw=snap.val();
      sales=Object.values(raw).filter(Boolean).sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
    }
  }catch(e){}

  const totalCount=sales.length;
  const totalRevenue=sales.reduce((s,x)=>s+(x.price||0),0);
  const byProduct={};
  sales.forEach(s=>{
    const key=s.prodName||'기타';
    if(!byProduct[key]) byProduct[key]={emoji:s.emoji||'🛒',count:0,revenue:0};
    byProduct[key].count++;
    byProduct[key].revenue+=(s.price||0);
  });
  const rankedProducts=Object.entries(byProduct).sort((a,b)=>b[1].revenue-a[1].revenue);

  const today=dStr();
  const weekAgo=new Date(kst()); weekAgo.setDate(weekAgo.getDate()-7);
  const recentSales=sales.filter(s=>s.ts&&new Date(s.ts)>=weekAgo);
  const recentRevenue=recentSales.reduce((s,x)=>s+(x.price||0),0);

  let body=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.7rem;">
      <div style="background:var(--g50);border-radius:10px;padding:.6rem;text-align:center;">
        <div style="font-size:.68rem;color:var(--g500);">누적 판매 건수</div>
        <div style="font-size:1.15rem;font-weight:800;">${totalCount}건</div>
      </div>
      <div style="background:var(--g50);border-radius:10px;padding:.6rem;text-align:center;">
        <div style="font-size:.68rem;color:var(--g500);">누적 매출</div>
        <div style="font-size:1.15rem;font-weight:800;color:var(--primary);">${fE(totalRevenue)}</div>
      </div>
      <div style="background:var(--g50);border-radius:10px;padding:.6rem;text-align:center;">
        <div style="font-size:.68rem;color:var(--g500);">최근 7일 판매</div>
        <div style="font-size:1.15rem;font-weight:800;">${recentSales.length}건</div>
      </div>
      <div style="background:var(--g50);border-radius:10px;padding:.6rem;text-align:center;">
        <div style="font-size:.68rem;color:var(--g500);">최근 7일 매출</div>
        <div style="font-size:1.15rem;font-weight:800;color:var(--suc);">${fE(recentRevenue)}</div>
      </div>
    </div>
    <div style="font-size:.78rem;font-weight:700;color:var(--g700);margin-bottom:.35rem;">🏆 품목별 판매 순위</div>`;
  if(!rankedProducts.length){
    body+='<div style="text-align:center;color:var(--g400);font-size:.8rem;padding:.8rem 0;">아직 판매 기록이 없습니다.</div>';
  } else {
    body+=rankedProducts.map(([name,d])=>`<div style="display:flex;align-items:center;gap:.4rem;padding:.35rem 0;border-bottom:1px solid var(--g100);">
      <span style="font-size:1.1rem;">${d.emoji}</span>
      <span style="flex:1;font-size:.82rem;font-weight:600;">${escHtml(name)}</span>
      <span style="font-size:.75rem;color:var(--g500);">${d.count}건</span>
      <span style="font-size:.82rem;font-weight:700;color:var(--primary);">${fE(d.revenue)}</span>
    </div>`).join('');
  }
  body+='<div style="font-size:.78rem;font-weight:700;color:var(--g700);margin:.6rem 0 .35rem;">🧾 최근 거래 내역</div>';
  if(!sales.length){
    body+='<div style="text-align:center;color:var(--g400);font-size:.8rem;padding:.5rem 0;">거래 내역이 없습니다.</div>';
  } else {
    body+=sales.slice(0,10).map(s=>`<div style="display:flex;align-items:center;gap:.4rem;padding:.3rem 0;font-size:.76rem;color:var(--g600);">
      <span>${s.emoji||'🛒'}</span>
      <span style="flex:1;">${escHtml(s.buyer||'?')} · ${escHtml(s.prodName||'')}</span>
      <span style="font-weight:700;color:var(--g700);">${fE(s.price||0)}</span>
      <span style="color:var(--g400);">${s.date||''}</span>
    </div>`).join('');
  }

  openModal('📊 '+st.name+' 판매 통계', body, [{l:'닫기',c:'bs',f:closeModal}]);
};

window.deptClose=function(slotId){
  const st=deptStores()[slotId];
  if(!st) return;
  const members=[st.ceo,...(st.partners||[])];
  const n=members.length;
  const bal=st.balance||0;
  const share=Math.floor(bal/n);
  openModal('🚪 폐업 처리',`
    <div style="padding:.4rem 0;">
      <p class="tsm"><strong>${escHtml(st.name)}</strong> 점포를 폐업 처리합니다.</p>
      <p class="tsm tg">잔액 ${fE(bal)}을 ${n}명에게 ${fE(share)}씩 최종 분배한 뒤 점포를 비웁니다.</p>
      <p class="tsm tg" style="color:var(--dan);">이 작업은 되돌릴 수 없습니다.</p>
    </div>
  `,[
    {l:'폐업 처리',c:'bdan',f:async()=>{
      for(let i=0;i<members.length;i++){
        const m=members[i];
        if(share>0){
          const mRef=ref(db,ROOT+'/students/'+m);
          await runTransaction(mRef,(cur)=>{
            if(!cur) return cur;
            cur.bal=parseFloat(((cur.bal||0)+share).toFixed(2));
            return cur;
          }).catch(()=>{});
          if(state.students[m]) state.students[m].bal=parseFloat(((state.students[m].bal||0)+share).toFixed(2));
          addTxLog('deposit',m,share,'시스템',st.name+' 폐업 최종 정산');
        }
        const _ts=Date.now();
        const nid='noti'+(_ts+i);
        const memo=st.name+' 폐업 처리됐습니다. 최종 정산 '+fE(share)+' 입금';
        update(ref(db,ROOT+'/notifications/'+m+'/'+nid),{id:nid,type:'deposit',amt:share,memo,from:'선생님',date:dStr(),ts:new Date().toISOString(),read:false}).catch(()=>{});
      }
      await set(ref(db,ROOT+'/dept/stores/'+slotId),null).catch(()=>{});
      if(state.dept?.stores?.[slotId]) delete state.dept.stores[slotId];
      _deptView=null;
      closeModal(); showToast('🚪 폐업 처리 완료. 점포가 비워졌습니다.');
      rDept(document.getElementById('tab-dept'));
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
};

let _reBuying=false; // 중복 구매 방지 플래그
function reQuickBuy(plotId){
  const city=RE_CITY_MAP[plotId];
  if(!city){showToast('알 수 없는 도시입니다.');return;}
  const p=state.realestate?.plots?.[plotId];
  if(p&&p.owner){showToast('이미 소유된 땅입니다.');return;}
  const st=state.students[cu.name];
  const landPrice=reCityPrice(plotId);
  const tax=Math.round(landPrice*0.1);
  const total=landPrice+tax;
  const canAfford=(st?.bal||0)>=total;
  openModal(`${city.emoji} ${city.name}`,`
    <div style="text-align:center;padding:.5rem 0 .8rem;">
      <div style="font-size:3rem;margin-bottom:.3rem;">${city.emoji}</div>
      <div style="font-size:1.1rem;font-weight:700;">${city.name}</div>
      <div style="font-size:.82rem;color:var(--g600);margin:.2rem 0 .6rem;">${reCityDesc(plotId)}</div>
      <div style="background:var(--g50);border-radius:10px;padding:.65rem;display:inline-block;min-width:160px;">
        <div style="font-size:.75rem;color:var(--g500);">구매가</div>
        <div style="font-size:1.3rem;font-weight:700;color:var(--primary);">${fE(landPrice)}</div>
        <div style="font-size:.75rem;color:var(--warn);margin-top:.1rem;">취득세 10%: +${fE(tax)}</div>
        <div style="font-size:.78rem;font-weight:700;color:var(--dan);margin-top:.05rem;">합계: ${fE(total)}</div>
        <div style="font-size:.78rem;color:var(--suc);margin-top:.2rem;">일일 수익 +${reCityIncome(plotId)}조개/일</div>
      </div>
      ${!canAfford?`<div style="margin-top:.65rem;background:var(--dl);border-radius:8px;padding:.45rem .75rem;font-size:.78rem;color:var(--dan);">
        💸 잔액 부족 · 현재 ${fE2(st?.bal||0)} / 필요 ${fE(total)}<br/>
        <span style="font-size:.72rem;color:var(--g500);">앞으로 ${fE(total-(st?.bal||0))} 더 모으면 살 수 있어요!</span>
      </div>`:''}
    </div>
    ${RE_NO_BUILD[plotId]?`
    <div style="background:var(--sl);border-radius:12px;padding:.7rem .85rem;margin-top:.1rem;">
      <div style="font-size:.8rem;font-weight:700;color:var(--suc);margin-bottom:.2rem;">🌿 환경보존 지역</div>
      <div style="font-size:.74rem;color:var(--g600);line-height:1.6;">독도는 자연을 지키기 위해 <strong>건물을 지을 수 없어요.</strong><br/>대신 나라에서 <strong>환경보존 보조금 +${reCityIncome(plotId)}조개</strong>를 매일 지급합니다. 🦭</div>
    </div>`:`
    <div style="margin-top:.1rem;">
      <div style="font-size:.78rem;font-weight:700;color:var(--g700);margin-bottom:.35rem;">🏗️ 건물 건설 미리보기</div>
      <div style="display:flex;gap:.4rem;">
        ${Object.keys(RE_BUILDINGS).map(bk=>{
          const bv=reBuildingInfo(bk, plotId);
          const bTax=Math.round(bv.cost*0.1);
          const bTotal=bv.cost+bTax;
          const canBuild=(st?.bal||0)-(canAfford?total:0)>=bTotal;
          return `<div style="flex:1;background:${canBuild?'var(--sl)':'var(--g50)'};border:1.5px solid ${canBuild?'var(--suc)':'var(--g200)'};border-radius:10px;padding:.5rem .4rem;text-align:center;opacity:${canBuild?1:.55};">
            <div style="font-size:1.5rem;">${bv.emoji}</div>
            <div style="font-size:.7rem;font-weight:700;margin:.15rem 0;">${bv.name}</div>
            <div style="font-size:.65rem;color:var(--g600);">건설비 ${fE(bv.cost)}</div>
            <div style="font-size:.62rem;color:var(--warn);">취득세 +${fE(bTax)}</div>
            <div style="font-size:.68rem;color:var(--suc);font-weight:700;">+${bv.income}조개/일</div>
          </div>`;
        }).join('')}
      </div>
      <div style="font-size:.68rem;color:var(--g500);margin-top:.3rem;">* 토지 구매 후 건물 건설 가능 · 건설 시 취득세 10% 추가</div>
    </div>`}
    ${canAfford?`<div class="fg" style="margin-top:.5rem;margin-bottom:0;"><label style="font-size:.75rem;color:var(--g700);font-weight:700;">📝 취득 사유 <span style="color:var(--dan);">*</span></label>
      <textarea id="reBuyReason" rows="2" maxlength="100" placeholder="구매 이유를 입력해주세요 (필수)"
        style="width:100%;padding:.45rem .6rem;border:1.5px solid var(--g200);border-radius:8px;font-size:.85rem;font-family:inherit;resize:none;box-sizing:border-box;"></textarea>
    </div>
    <div style="font-size:.72rem;color:var(--g500);margin-top:.3rem;">※ 빈 토지는 바로 구매됩니다. (다른 학생의 매물 거래만 선생님 승인 필요)</div>`:''}
  `,[
    {l: canAfford ? '구매 (취득세 포함)' : '💸 잔액 부족', c: canAfford ? 'bsuc' : 'bs',
     f: canAfford ? async()=>{
      const reason=document.getElementById('reBuyReason')?.value.trim();
      if(!reason){showToast('취득 사유를 입력해주세요.');return;}
      if(_reBuying){showToast('처리 중입니다.');return;}
      _reBuying=true;
      try{
        const now=new Date().toISOString();
        const plotRef=ref(db,ROOT+'/realestate/plots/'+plotId);
        // 1) 땅 선점 — 트랜잭션으로 동시 구매 충돌 방지
        const claim=await runTransaction(plotRef,(curPlot)=>{
          if(curPlot&&curPlot.owner) return; // abort — 이미 주인 있음
          return {owner:cu.name,building:null,boughtAt:now,boughtPrice:landPrice,
            hist:[{o:cu.name,p:landPrice,at:now}]};
        });
        if(!claim.committed){showToast('방금 다른 학생이 구매했습니다.');closeModal();return;}
        // 2) 잔액 차감 — 실패 시 땅 선점 롤백
        const stuRef=ref(db,ROOT+'/students/'+cu.name);
        const txResult=await runTransaction(stuRef,(current)=>{
          if(!current) return current;
          if((current.bal||0)<total) return;
          current.bal=parseFloat(((current.bal||0)-total).toFixed(2));
          return current;
        });
        if(!txResult.committed){
          await set(plotRef,null).catch(()=>{});
          showToast('잔액이 부족합니다.');return;
        }
        if(st) st.bal=txResult.snapshot.val()?.bal??st.bal;
        if(!state.realestate) state.realestate={plots:{},settings:reSettings(),listings:{}};
        if(!state.realestate.plots) state.realestate.plots={};
        state.realestate.plots[plotId]={owner:cu.name,building:null,boughtAt:now,boughtPrice:landPrice,
          hist:[{o:cu.name,p:landPrice,at:now}]};
        addTxLog('withdraw',cu.name,total,cu.name,`${city.name} 취득 (사유: ${reason})`);
        closeModal();
        showToast(city.emoji+' '+city.name+' 구매 완료! 매일 +'+reCityIncome(plotId)+'조개');
        switchTab('realestate');
      }catch(e){console.error('reQuickBuy error',e);showToast('구매 처리 중 오류가 발생했습니다.');}
      finally{_reBuying=false;}
    } : closeModal},
    {l:'닫기',c:'bs',f:closeModal}
  ]);
}

// 슬라이더 전역 업데이트 핸들러
window.reUpdateSlider=function(val){
  const n=parseInt(val);
  const el=document.getElementById('reListAmt');
  const ni=document.getElementById('reListNumInput');
  if(el) el.textContent=(typeof fE==='function'?fE(n):n+'조개');
  if(ni) ni.value=n;
};
window.reUpdateNumInput=function(val){
  const n=parseInt(val)||0;
  const sl=document.getElementById('reListRange');
  const el=document.getElementById('reListAmt');
  if(!sl) return;
  const mn=parseInt(sl.min), mx=parseInt(sl.max);
  const clamped=Math.min(mx,Math.max(mn,n));
  sl.value=clamped;
  if(el) el.textContent=(typeof fE==='function'?fE(clamped):clamped+'조개');
};

// 빈 도시 클릭 → 즉시 구매
function reBuild(plotId,buildingKey){
  if(RE_NO_BUILD[plotId]){showToast('🦭 독도는 환경보존 지역이라 건물을 지을 수 없습니다.');return;}
  const bv=reBuildingInfo(buildingKey,plotId);
  if(!bv){showToast('잘못된 건물 유형입니다.');return;}
  const tax=Math.round(bv.cost*0.1);
  const total=bv.cost+tax;
  const st=state.students[cu.name];
  if(!st||(st.bal||0)<total){showToast(`잔액 부족. 필요: ${fE(total)} (취득세 포함)`);return;}
  const p=state.realestate?.plots?.[plotId];
  if(!p||p.owner!==cu.name){showToast('내 땅이 아닙니다.');return;}
  const city=RE_CITY_MAP[plotId];
  openModal(`${bv.emoji} ${bv.name} 건설 — ${city?.name||''}`,`
    <div style="text-align:center;padding:.5rem 0;">
      <div style="font-size:2.5rem;margin-bottom:.4rem;">${bv.emoji}</div>
      <div style="font-size:1rem;font-weight:700;margin-bottom:.3rem;">${bv.name} 건설</div>
      <div style="font-size:.88rem;color:var(--g700);">건설비: <strong>${fE(bv.cost)}</strong></div>
      <div style="font-size:.8rem;color:var(--warn);">취득세 10%: +${fE(tax)}</div>
      <div style="font-size:.9rem;font-weight:700;color:var(--dan);margin-top:.15rem;">합계: ${fE(total)}</div>
      <div style="font-size:.82rem;color:var(--suc);margin-top:.3rem;">완공 후 일일 수익: +${bv.income}조개/일</div>
    </div>
  `,[
    {l:'건설 (취득세 포함)',c:'bsuc',f:async()=>{
      if(_reBuying){showToast('처리 중입니다. 잠시만요.');return;}
      _reBuying=true;
      try{
        const stuRef=ref(db,ROOT+'/students/'+cu.name);
        const txResult=await runTransaction(stuRef,(current)=>{
          if(!current) return current;
          if((current.bal||0)<total) return; // abort
          current.bal=parseFloat(((current.bal||0)-total).toFixed(2));
          return current;
        });
        if(!txResult.committed){showToast('잔액이 부족하거나 이미 처리됐습니다.');_reBuying=false;return;}
        if(st) st.bal=txResult.snapshot.val()?.bal??st.bal;
        p.building=buildingKey;
        addTxLog('withdraw',cu.name,total,cu.name,`${bv.name} 건설 (취득세 ${fE(tax)} 포함, ${city?.name||''})`);
        const upd={};
        upd['realestate/plots/'+plotId+'/building']=buildingKey;
        await update(ref(db,ROOT),upd).catch(e=>console.error(e));
        closeModal(); showToast(`${bv.emoji} ${bv.name} 건설 완료! 일일 +${bv.income}조개`);
        switchTab('realestate');
      }catch(e){showToast('건설 처리 중 오류가 발생했습니다.');}
      finally{_reBuying=false;}
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}

// 교사: 부동산 설정 저장
function reSaveSettings(){
  if(!state.realestate) state.realestate={plots:{},listings:{}};
  if(!state.realestate.settings) state.realestate.settings={};

  // 도시 설정
  const newCities={};
  RE_CITIES.forEach(city=>{
    const price=parseFloat(document.getElementById(`re-c-price-${city.id}`)?.value);
    const income=parseFloat(document.getElementById(`re-c-income-${city.id}`)?.value);
    const desc=document.getElementById(`re-c-desc-${city.id}`)?.value.trim()||city.desc;
    if(!isNaN(price)&&price>0) newCities[city.id]={price, income:isNaN(income)?city.income:income, desc};
  });
  state.realestate.settings.cities=newCities;

  // 건물 공통 설정
  const newBuildings={};
  Object.keys(RE_BUILDINGS).forEach(bk=>{
    const bv=RE_BUILDINGS[bk];
    const cost=parseFloat(document.getElementById(`re-b-cost-${bk}`)?.value);
    const income=parseFloat(document.getElementById(`re-b-income-${bk}`)?.value);
    newBuildings[bk]={
      cost:  (!isNaN(cost)&&cost>0)?cost:bv.cost,
      income:(!isNaN(income)&&income>=0)?income:bv.income
    };
  });
  state.realestate.settings.buildings=newBuildings;

  // 도시별 건물 개별 설정
  const newCityBuildings={};
  RE_CITIES.forEach(city=>{
    const cb={};
    Object.keys(RE_BUILDINGS).forEach(bk=>{
      const cost=parseFloat(document.getElementById(`re-cb-cost-${city.id}-${bk}`)?.value);
      const income=parseFloat(document.getElementById(`re-cb-income-${city.id}-${bk}`)?.value);
      if(!isNaN(cost)&&cost>0) {
        cb[bk]={
          cost,
          income:(!isNaN(income)&&income>=0)?income:RE_BUILDINGS[bk].income
        };
      }
    });
    if(Object.keys(cb).length) newCityBuildings[city.id]=cb;
  });
  state.realestate.settings.cityBuildings=newCityBuildings;

  update(ref(db,ROOT+'/realestate/settings'),{
    cities:newCities,
    buildings:newBuildings,
    cityBuildings:Object.keys(newCityBuildings).length?newCityBuildings:null
  }).catch(()=>{});
  showToast('✅ 부동산 설정 저장 완료!');
  switchTab('realestate');
}

// 부동산 거래 승인
window.reApprove=async function(reqId){
  const approvals=state.rePending||{};
  const req=approvals[reqId];
  if(!req||req.type!=='p2p'){showToast('요청을 찾을 수 없습니다.');return;}
  const st=state.students[req.buyer];
  if(!st||(st.bal||0)<req.price){showToast(req.buyer+' 잔액 부족 (필요: '+fE(req.price)+')');return;}
  const listing=state.realestate?.listings?.[req.plotId];
  if(!listing){
    showToast('매물이 이미 취소됐습니다.');
    await update(ref(db,ROOT+'/rePending/'+reqId),{status:'cancelled'}).catch(()=>{});
    if(state.rePending?.[reqId]) state.rePending[reqId].status='cancelled';
    rRealestate(document.getElementById('tab-realestate'));
    return;
  }
  _reBuying=true;
  try{
    const stuRef=ref(db,ROOT+'/students/'+req.buyer);
    const tx=await runTransaction(stuRef,(cur)=>{
      if(!cur||((cur.bal||0)<req.price)) return;
      cur.bal=parseFloat(((cur.bal||0)-req.price).toFixed(2));
      return cur;
    });
    if(!tx.committed){showToast('잔액 부족으로 승인 실패.');_reBuying=false;return;}
    if(st) st.bal=tx.snapshot.val()?.bal??st.bal;
    const sellerSt=state.students[req.seller];
    if(sellerSt){
      sellerSt.bal=parseFloat(((sellerSt.bal||0)+req.sellerReceives).toFixed(2));
      await update(ref(db,ROOT+'/students/'+req.seller),{bal:sellerSt.bal}).catch(()=>{});
    }
    const p=state.realestate.plots[req.plotId];
    const transferAt=new Date().toISOString();
    let newHist=null;
    if(p){
      newHist=[...rePlotHist(p),{o:req.buyer,p:req.price,at:transferAt}];
      p.owner=req.buyer; p.boughtPrice=req.price; p.boughtAt=transferAt; p.hist=newHist;
    }
    delete state.realestate.listings[req.plotId];
    const upd={};
    upd['realestate/plots/'+req.plotId+'/owner']=req.buyer;
    upd['realestate/plots/'+req.plotId+'/boughtPrice']=req.price;
    upd['realestate/plots/'+req.plotId+'/boughtAt']=transferAt;
    if(newHist) upd['realestate/plots/'+req.plotId+'/hist']=newHist;
    upd['realestate/listings/'+req.plotId]=null;
    upd['rePending/'+reqId+'/status']='approved';
    await update(ref(db,ROOT),upd).catch(()=>{});
    addTxLog('withdraw',req.buyer,req.price,'시스템',req.city+' P2P 구매 승인됨');
    addTxLog('deposit',req.seller,req.sellerReceives,'시스템',req.city+' P2P 매도 승인됨');
    const _ts=Date.now(); const nid1='noti'+_ts; const nid2='noti'+(_ts+1);
    const memo1=req.city+' P2P 구매가 승인됐습니다!';
    const memo2=req.city+' 매도 완료! 수령: '+fE(req.sellerReceives);

function activeDepositTotal(st){
  return (st?.deps||[]).filter(d=>!d.done&&!d.er).reduce((a,d)=>a+(parseFloat(d.amt)||0),0);
}
function currentStockTotal(st){
  if(!st||!st.hld) return 0;
  return STOCKS.reduce((sum,s)=>sum+((st.hld[s.id]||0)*(state?.stocks?.[s.id]?.price||0)),0);
}
function currentInvestTotal(st){
  return parseFloat((((st?.bal||0)+currentStockTotal(st)+activeDepositTotal(st))).toFixed(2));
}
function ensureReturnFields(st){
  if(!st) return st;
  if(st.returnBaseTotal===undefined) st.returnBaseTotal=currentInvestTotal(st);
  if(st.returnCapitalFlow===undefined) st.returnCapitalFlow=0;
  if(st.returnExpenseExcluded===undefined) st.returnExpenseExcluded=0;
  if(st.returnBonusCashExcluded===undefined) st.returnBonusCashExcluded=0;
  if(!st.returnBonusLots) st.returnBonusLots={semi:0,food:0,ent:0};
  STOCKS.forEach(s=>{ if(st.returnBonusLots[s.id]===undefined) st.returnBonusLots[s.id]=0; });
  return st;
}
function bonusStockCurrentValue(st){
  ensureReturnFields(st);
  return STOCKS.reduce((sum,s)=>sum+((st.returnBonusLots?.[s.id]||0)*(state?.stocks?.[s.id]?.price||0)),0);
}
function effectiveReturnCapital(st){
  ensureReturnFields(st);
  return parseFloat(((st.returnBaseTotal||0)+(st.returnCapitalFlow||0)).toFixed(2));
}
function adjustedReturnTotal(st){
  ensureReturnFields(st);
  const total=currentInvestTotal(st);
  return parseFloat((total + (st.returnExpenseExcluded||0) - (st.returnBonusCashExcluded||0) - bonusStockCurrentValue(st)).toFixed(2));
}
async function migrateReturnSystemV60(force=false){
  if(!state||!state.students) return;
  if(!force && state.returnSystemVersion==='v60') return;
  const payload={};
  realStudents().forEach(s=>{
    const st=ensureStudentShape(state.students[s.name]);
    st.returnBaseTotal=currentInvestTotal(st);
    st.returnCapitalFlow=0;
    st.returnExpenseExcluded=0;
    st.returnBonusCashExcluded=0;
    st.returnBonusLots={semi:0,food:0,ent:0};
    payload[s.name]={
      returnBaseTotal:st.returnBaseTotal,
      returnCapitalFlow:0,
      returnExpenseExcluded:0,
      returnBonusCashExcluded:0,
      returnBonusLots:st.returnBonusLots
    };
  });
  state.returnSystemVersion='v60';
  state.rankResetDate=new Date().toISOString();
  try{
    await Promise.all([
      update(ref(db,ROOT+'/students'),payload),
      update(ref(db,ROOT),{returnSystemVersion:'v60',rankResetDate:state.rankResetDate})
    ]);
  }catch(e){
    console.warn('v6.0 return migration warning',e);
  }
}

function v60_calcP(name){
  if(!state.students) state.students={};
  if(!state.students[name]) state.students[name]={bal:START_BALANCE,hld:{semi:0,food:0,ent:0},deps:[],dep0:0,cb:{semi:0,food:0,ent:0}};
  const st=ensureReturnFields(state.students[name]);
  if(!st.hld) st.hld={semi:0,food:0,ent:0};
  if(!st.cb) st.cb={semi:0,food:0,ent:0};
  if(!st.deps) st.deps=[];
  if(!state.stocks) return {st,sv:0,total:st.bal||0,inv:0,tpnl:0,tpct:0,sd:[],dl:0};
  let sv=0;
  const sd=STOCKS.map(s=>{
    const q=st.hld[s.id]||0,cp=state.stocks[s.id].price,ac=st.cb[s.id]||0;
    const val=q*cp,cost=q*ac,pnl=val-cost,pct=cost>0?(pnl/cost*100):0;
    sv+=val;
    return {s,q,cp,ac,val,cost,pnl,pct,bonusQ:(st.returnBonusLots?.[s.id]||0)};
  });
  const dl=activeDepositTotal(st);
  // 부동산 자산 가치 (토지 구매가 기준)
  const rs=reSettings ? reSettings() : {};
  const landPrice=parseFloat(rs.landPrice)||400;
  const rePlots=state.realestate?.plots||{};
  let rl=0;
  Object.values(rePlots).forEach(p=>{ if(p&&p.owner===name) rl+=landPrice; });
  const total=parseFloat(((st.bal||0)+sv+dl+rl).toFixed(2));
  const inv=effectiveReturnCapital(st);
  const adjTotal=adjustedReturnTotal(st);
  const tpnl=parseFloat((adjTotal-inv).toFixed(2));
  const tpct=inv>0?tpnl/inv*100:0;
  return {st,sv,total,inv,tpnl,tpct,sd,dl,rl};
}

// 부드러운 곡선 path (Catmull-Rom → Bezier)
function smoothPath(pts){
  if(pts.length<3) return 'M '+pts.map(p=>p[0]+' '+p[1]).join(' L ');
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}

// 가챠 룰렛 연출 (당첨은 picked로 이미 확정, 연출만 표시)
function playGachaReveal(picked, pool){
  // 릴에 보여줄 후보들 (당첨 포함 셔플)
  const reel=[];
  const sample=pool.slice();
  for(let i=sample.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sample[i],sample[j]]=[sample[j],sample[i]];}
  for(let i=0;i<24;i++) reel.push(sample[i%sample.length]||picked);
  reel.push(picked); // 마지막은 당첨
  const overlay=document.getElementById('modalOverlay');
  const title=document.getElementById('mTitle');
  const body=document.getElementById('mBody');
  const acts=document.getElementById('mActs');
  title.textContent='🎁 랜덤 이모지 뽑기';
  acts.innerHTML='';
  body.innerHTML=`
    <div class="gacha-stage">
      <div class="gacha-glow" id="gachaGlow"></div>
      <div class="gacha-orbit" id="gachaOrbit">
        <span class="gacha-spark s1">✨</span><span class="gacha-spark s2">⭐</span>
        <span class="gacha-spark s3">💫</span><span class="gacha-spark s4">✨</span>
      </div>
      <div class="gacha-box" id="gachaBox">
        <div class="gacha-emoji" id="gachaEmoji">🎁</div>
      </div>
      <div class="gacha-caption" id="gachaCaption">두근두근... 뽑는 중!</div>
    </div>`;
  overlay.classList.add('open'); document.body.style.overflow='hidden';
  const emo=document.getElementById('gachaEmoji');
  const boxEl=document.getElementById('gachaBox');
  const cap=document.getElementById('gachaCaption');
  const glow=document.getElementById('gachaGlow');
  let i=0; let delay=55;
  playSound&&playSound('buy');
  function tick(){
    emo.textContent=reel[i%reel.length];
    emo.style.transform='scale(1.05)';
    setTimeout(()=>{emo.style.transform='scale(1)';},40);
    i++;
    // 점점 느려지는 감속
    if(i>16) delay+=14;
    if(i>22) delay+=40;
    if(i<reel.length-1 && delay<320){
      setTimeout(tick,delay);
    } else {
      // 당첨 확정 연출
      emo.textContent=picked;
      boxEl.classList.add('gacha-hit');
      glow.classList.add('on');
      cap.textContent='🎉 획득!';
      cap.classList.add('hit');
      burstConfetti();
      playSound&&playSound('win');
      setTimeout(()=>{
        acts.innerHTML='';
        body.innerHTML=`<div style="text-align:center;padding:.4rem 0;">
          <div class="gacha-final">${picked}</div>
          <div style="font-size:1.15rem;font-weight:900;color:var(--suc);margin:.4rem 0 .25rem;">${picked} 획득!</div>
          <div style="font-size:.82rem;color:var(--g600);">새 이모지를 장착했어요.<br/>보관함에서 ✨효과도 달 수 있어요!</div>
        </div>`;
        const b=document.createElement('button');b.className='btn bsuc';b.style.flex='1';b.textContent='🎉 좋아요!';b.onclick=()=>{closeModal();switchTab('portfolio');};
        acts.appendChild(b);
      },1300);
    }
  }
  tick();
}

function burstConfetti(){

async function v60_processDonate(itemId,amt){
  const rounded=Math.floor(amt);
  if(rounded<=0){showToast('금액을 다시 확인해주세요.');return;}
  const item=(state.donationItems||[]).find(it=>it.id===itemId);
  if(!item){showToast('기부 항목을 찾을 수 없습니다.');return;}
  const stuRef=ref(db,ROOT+'/students/'+cu.name);
  // 학생 잔액 트랜잭션 — 동시 기부 충돌 방지
  let newBal=0;
  try{
    const txResult=await runTransaction(stuRef,(cur)=>{
      if(!cur) return cur;
      const bal=parseFloat(cur.bal||0);
      if(bal<rounded) return; // abort — 잔액 부족
      cur.bal=parseFloat((bal-rounded).toFixed(2));
      cur.iconSpent=parseFloat(((cur.iconSpent||0)+rounded).toFixed(2));
      cur.returnExpenseExcluded=parseFloat(((cur.returnExpenseExcluded||0)+rounded).toFixed(2));
      return cur;
    });
    if(!txResult.committed){
      showToast('잔액이 부족합니다.');return;
    }
    newBal=txResult.snapshot.val()?.bal??0;
    // 로컬 state 동기화
    const st=state.students[cu.name];
    if(st){
      st.bal=newBal;
      st.iconSpent=(st.iconSpent||0)+rounded;
      st.returnExpenseExcluded=(st.returnExpenseExcluded||0)+rounded;
    }
  }catch(e){
    showToast('기부 처리 중 오류가 발생했습니다.');
    console.error('[donate] student tx error:',e);return;
  }
  // 항목별 total 트랜잭션 — 누락 방지 (항목마다 독립적으로 누적, 다른 항목에는 영향 없음)
  const itemTotalRef=ref(db,ROOT+'/donationItems/'+itemId+'/total');
  try{
    await runTransaction(itemTotalRef,(cur)=>{
      return parseFloat(((cur||0)+rounded).toFixed(2));
    });
  }catch(e){
    console.error('[donate] item total tx error:',e);
  }
  // donationLog 항목 추가 (어느 항목에 기부했는지 함께 기록)
  const entry={name:cu.name,itemId,itemName:item.name,amount:rounded,date:dStr(),ts:new Date().toISOString()};
  const key=entry.ts.replace(/[^0-9a-zA-Z_]/g,'_');
  update(ref(db,ROOT+'/donationLog/'+key), entry).catch(()=>{});
  // 로컬 state
  item.total=parseFloat(((item.total||0)+rounded).toFixed(2));
  if(!state.donationLog) state.donationLog=[];
  state.donationLog.unshift(entry);
  _donLogLoaded=true;
  addTxLog('withdraw',cu.name,rounded,cu.name,`💚 ${item.name} 기부`);
  playSound('buy');
  showToast(`💚 ${fE(rounded)} 기부 완료! 고마워요!`);
  const donEl=document.getElementById('tab-donation');
  if(donEl&&donEl.classList.contains('active')) rDonation(donEl);
  else switchTab('donation');
  setTimeout(()=>{
    const tree=document.getElementById('donationTree-'+itemId);
    if(tree){ tree.classList.remove('tree-shake'); void tree.offsetWidth; tree.classList.add('tree-shake'); }
  },150);
}
async function v60_doExTrade(sid,action,qty){
  qty=Math.floor(Number(qty));
  if(!Number.isInteger(qty)||qty<=0){showToast('수량을 다시 확인해주세요.');return;}
  if(!beginTradeLock()){showToast('잠시만요. 이전 거래를 처리 중입니다.');return;}
  const stk=state.stocks[sid];
  const sn=STOCKS.find(s=>s.id===sid).name;
  const studentRef=ref(db,ROOT+'/students/'+cu.name);
  let resultMsg='', sound='', tx=null;
  try{
    const txResult=await runTransaction(studentRef,(current)=>{
      const st=ensureReturnFields(ensureStudentShape(current));
      if(action==='buy'){
        const cost=parseFloat((qty*stk.price).toFixed(2));
        if(cost>st.bal) return;
        updateCB({students:{[cu.name]:st}},cu.name,sid,qty,stk.price,true);
        st.bal=parseFloat((st.bal-cost).toFixed(2));
        st.hld[sid]=(st.hld[sid]||0)+qty;
        tx={type:'deposit',amt:cost,note:`${sn} ${qty}주 매수 @${fE2(stk.price)}`};
        resultMsg=`${sn} ${qty}주 매수 완료! 🎉`; sound='buy';
        return st;
      }
      const held=st.hld[sid]||0;
      if(qty>held) return;
      const fee=parseFloat((qty*(state.sellFee||1)).toFixed(2));
      const proc=parseFloat((qty*stk.price-fee).toFixed(2));
      if(proc<0) return;
      const bonusHeld=st.returnBonusLots?.[sid]||0;
      const bonusSold=Math.min(qty,bonusHeld);
      if(bonusSold>0){
        const bonusNet=parseFloat((bonusSold*stk.price - fee*(bonusSold/qty)).toFixed(2));
        st.returnBonusLots[sid]=Math.max(0,bonusHeld-bonusSold);
        st.returnBonusCashExcluded=parseFloat(((st.returnBonusCashExcluded||0)+bonusNet).toFixed(2));
      }
      updateCB({students:{[cu.name]:st}},cu.name,sid,qty,stk.price,false);
      st.bal=parseFloat((st.bal+proc).toFixed(2));
      st.hld[sid]=Math.max(0,(st.hld[sid]||0)-qty);
      tx={type:'withdraw',amt:proc,note:`${sn} ${qty}주 매도 @${fE2(stk.price)} (수수료 ${fE2(fee)})`};
      resultMsg=`${sn} ${qty}주 매도 완료! (+${fE2(proc)})`; sound='sell';
      return st;
    });
    if(!txResult.committed){
      clearTradeLock();
      showToast(action==='buy'?'잔액 변동으로 매수 실패':'보유 수량 변동으로 매도 실패');
      return;
    }
    state.students[cu.name]=ensureReturnFields(ensureStudentShape(txResult.snapshot.val()));
    if(tx) addTxLog(tx.type,cu.name,tx.amt,cu.name,tx.note);
    showToast(resultMsg);
    if(sound) playSound(sound);
  }catch(err){
    console.error('Trade error',err);
    clearTradeLock(); showToast('거래 처리 중 오류가 발생했습니다.'); return;
  }
  clearTradeLock(); investSubTab='trade'; switchTab('invest');
}
async function v60_appC(id){
  const req=state.pd.find(r=>r.id===id); if(!req) return;
  const studentRef=ref(db,ROOT+'/students/'+req.to);
  const amt=parseFloat(req.amt.toFixed?req.amt.toFixed(2):req.amt);
  try{
    const txResult=await runTransaction(studentRef,(current)=>{
      const st=ensureReturnFields(ensureStudentShape(current));
      if(req.type==='deposit'){
        st.bal=parseFloat(((st.bal||0)+amt).toFixed(2));
        st.dep0=parseFloat((((st.dep0||0)+amt)).toFixed(2));
        st.returnCapitalFlow=parseFloat((((st.returnCapitalFlow||0)+amt)).toFixed(2));
        return st;
      }
      if((st.bal||0)<amt) return;
      st.bal=parseFloat(((st.bal||0)-amt).toFixed(2));
      st.dep0=parseFloat((Math.max(0,(st.dep0||0)-amt)).toFixed(2));
      st.returnCapitalFlow=parseFloat((((st.returnCapitalFlow||0)-amt)).toFixed(2));
      return st;
    });
    if(!txResult.committed){showToast('투자 가능 금액 부족');return;}
    state.students[req.to]=ensureReturnFields(ensureStudentShape(txResult.snapshot.val()));
    addTxLog(req.type==='deposit'?'deposit':'withdraw',req.to,amt,cu.name,'요청 승인');
    req.st='approved'; set(ref(db,ROOT+'/pd'),state.pd).catch(()=>{});
    showToast(`${req.to} ${req.type==='deposit'?'입금':'출금'} 승인!`);
    rCashier(document.getElementById('tab-cashier'));
  }catch(e){
    console.error('Approve cashier request error',e); showToast('승인 처리 중 오류가 발생했습니다.');
  }
}
async function v60_csDir(type){
  const name=selectedCashierStu||document.getElementById('csStu')?.value;
  if(!name){showToast('학생을 먼저 선택해주세요.');return;}
  const raw=parseFloat(document.getElementById('csAmt').value);
  if(!raw||raw<=0){showToast('금액을 입력해주세요.');return;}
  const memo=document.getElementById('csMemo')?.value.trim()||'';
  const studentRef=ref(db,ROOT+'/students/'+name);
  const amt=parseFloat(raw.toFixed(2));
  const isDeposit=type==='deposit';
  const noteText=memo
    ? (isDeposit?`입금: ${memo}`:`출금: ${memo}`)
    : (isDeposit?'직접 입금':'직접 출금');
  try{
    const txResult=await runTransaction(studentRef,(current)=>{
      const st=ensureReturnFields(ensureStudentShape(current));
      if(isDeposit){
        st.bal=parseFloat(((st.bal||0)+amt).toFixed(2));
        st.dep0=parseFloat((((st.dep0||0)+amt)).toFixed(2));
        st.returnCapitalFlow=parseFloat((((st.returnCapitalFlow||0)+amt)).toFixed(2));
        return st;
      }
      if((st.bal||0)<amt) return;
      st.bal=parseFloat(((st.bal||0)-amt).toFixed(2));
      st.dep0=parseFloat((Math.max(0,(st.dep0||0)-amt)).toFixed(2));
      st.returnCapitalFlow=parseFloat((((st.returnCapitalFlow||0)-amt)).toFixed(2));
      return st;
    });
    if(!txResult.committed){showToast('잔액이 부족합니다.');return;}
    state.students[name]=ensureReturnFields(ensureStudentShape(txResult.snapshot.val()));
    addTxLog(isDeposit?'deposit':'withdraw',name,amt,cu.name,noteText);

    // 학생 알림 저장 — 해당 학생 로그인 시 팝업으로 표시
    const notifId='noti'+Date.now();
    const notif={
      id:notifId,
      type:isDeposit?'deposit':'withdraw',
      amt,
      memo,
      from:cu.name,
      date:dStr(),
      ts:new Date().toISOString(),
      read:false
    };
    update(ref(db,ROOT+'/notifications/'+name+'/'+notifId), notif).catch(()=>{});

    showToast(isDeposit?`${name}에게 ${fE(amt)} 입금 완료!`:`${name}에서 ${fE(amt)} 출금 완료!`);
    // 메모 초기화, 금액 포커스
    const memoEl=document.getElementById('csMemo');
    if(memoEl) memoEl.value='';
    setTimeout(()=>{ document.getElementById('csAmt')?.focus(); },50);
  }catch(e){
    console.error('Direct cashier transaction error',e); showToast('처리 중 오류가 발생했습니다.');
  }
}
function v60_bulkDeposit(){

    {l:'입금',c:'bsuc',f:async()=>{

        const st=state.students[s.name]; if(!st||(st.dep0||0)===0) return;

function v60_bulkWithdraw(){
  const amt=parseFloat(document.getElementById('bulkAmt').value);
  if(!amt||amt<=0){showToast('금액을 입력해주세요.');return;}
  const withdrawAmt=Math.round(amt);
  openModal('일괄 회수 확인',`<p class="tsm">투자 기록이 있는 학생 전원에게서 1인당 <strong>${fE(withdrawAmt)}</strong>를 회수합니다. 잔액 부족한 학생은 제외됩니다.</p>`,[
    {l:'회수',c:'bdan',f:async()=>{
      const updates={}; let cnt=0,skip=0;
      STUDENTS.concat(state.extraStudents||[]).forEach(s=>{
        const st=state.students[s.name]; if(!st||(st.dep0||0)===0) return;
        if((st.bal||0)<withdrawAmt){skip++;return;}
        ensureReturnFields(st);
        const newBal=parseFloat(((st.bal||0)-withdrawAmt).toFixed(2));
        const newDep0=parseFloat((Math.max(0,(st.dep0||0)-withdrawAmt)).toFixed(2));
        const newFlow=parseFloat((((st.returnCapitalFlow||0)-withdrawAmt)).toFixed(2));
        st.bal=newBal; st.dep0=newDep0; st.returnCapitalFlow=newFlow;
        updates[`students/${s.name}/bal`]=newBal;
        updates[`students/${s.name}/dep0`]=newDep0;
        updates[`students/${s.name}/returnCapitalFlow`]=newFlow;
        addTxLog('withdraw',s.name,withdrawAmt,cu.name,'일괄 회수');
        cnt++;
      });
      if(cnt===0){showToast(skip>0?'회수 가능한 학생이 없습니다.':'처리할 학생이 없습니다.');closeModal();return;}
      update(ref(db,ROOT),updates).catch(()=>{});
      showToast(`${cnt}명 회수 완료${skip>0?` (잔액부족 ${skip}명 제외)`:''}`); closeModal();
      rTeacher(document.getElementById('tab-teacher'));
    }},{l:'취소',c:'bs',f:closeModal}
  ]);
}
function v60_applyAdjust(){
  const name=document.getElementById('adjStudent')?.value;
  const balAdj=parseFloat(document.getElementById('adjBal')?.value)||0;
  const sid=document.getElementById('adjStock')?.value;
  const qtyAdj=parseInt(document.getElementById('adjQty')?.value)||0;
  if(!name){showToast('학생을 선택해주세요.');return;}
  if(balAdj===0&&qtyAdj===0){showToast('조정할 값을 입력해주세요.');return;}
  const st=ensureReturnFields(state.students[name]);
  if(!st){showToast('학생 데이터가 없습니다.');return;}
  const changes=[]; const upd={};
  if(balAdj!==0){
    st.bal=parseFloat((st.bal+balAdj).toFixed(2));
    st.returnCapitalFlow=parseFloat((((st.returnCapitalFlow||0)+balAdj)).toFixed(2));
    upd.bal=st.bal; upd.returnCapitalFlow=st.returnCapitalFlow;
    addTxLog(balAdj>0?'deposit':'withdraw',name,Math.abs(balAdj),cu.name,'교사 수동 조정');
    changes.push(`잔액 ${balAdj>0?'+':''}${fE2(balAdj)}`);
  }
  if(qtyAdj!==0&&sid){
    if(!st.hld) st.hld={semi:0,food:0,ent:0};
    if(!st.cb) st.cb={semi:0,food:0,ent:0};
    const oldQty=st.hld[sid]||0;
    const newQty=Math.max(0,oldQty+qtyAdj);
    const curPrice=state.stocks[sid].price;
    if(qtyAdj>0&&newQty>0){
      const oldCost=oldQty*(st.cb[sid]||0), addCost=qtyAdj*curPrice;
      st.cb[sid]=parseFloat(((oldCost+addCost)/newQty).toFixed(2));
      st.returnBonusLots[sid]=(st.returnBonusLots[sid]||0)+qtyAdj;
    }else if(qtyAdj<0){
      const removeQty=Math.abs(qtyAdj);
      const bonusQ=st.returnBonusLots[sid]||0;
      const usedBonus=Math.min(removeQty, bonusQ);
      st.returnBonusLots[sid]=Math.max(0, bonusQ-usedBonus);
      const regularRemoved=removeQty-usedBonus;
      if(regularRemoved>0){
        st.returnCapitalFlow=parseFloat((((st.returnCapitalFlow||0)-(regularRemoved*curPrice))).toFixed(2));
        upd.returnCapitalFlow=st.returnCapitalFlow;
      }
    }
    if(newQty===0) st.cb[sid]=0;
    st.hld[sid]=newQty;
    upd[`hld/${sid}`]=newQty; upd[`cb/${sid}`]=st.cb[sid]; upd[`returnBonusLots/${sid}`]=st.returnBonusLots[sid]||0;
    const sn=STOCKS.find(s=>s.id===sid)?.name||sid; changes.push(`${sn} ${qtyAdj>0?'+':''}${qtyAdj}주`);
  }
  update(ref(db,ROOT+'/students/'+name),upd).catch(()=>{});
  showToast(`${name}: ${changes.join(', ')} 조정 완료!`);
  closeModal();
}
